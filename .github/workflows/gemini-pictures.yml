name: Make pictures with Gemini

# Makes the pictures that cases.json lists but images/ doesn't have yet, with Google's Gemini API
# (Nano Banana 2), and commits them. Runs only when started by hand from the Actions tab, and only
# when the owner has asked for it: each picture is paid from the AI Studio prepaid balance.
# Needs the repository secret GEMINI_API_KEY. See tools/gemini_pictures.py for the spending limits.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these pictures, comma-separated (e.g. lights-at-nine-adult-cover). Leave empty for all missing pictures."
        required: false
        default: ""
      check_only:
        description: "Only check the key (makes nothing, costs nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pictures
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Make the pictures
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ inputs.only }}
          CHECK_ONLY: ${{ inputs.check_only }}
          MAX_PICTURES: "34"
          BUDGET_USD: "2.38"
        run: python3 tools/gemini_pictures.py

      - name: Save the new pictures
        run: |
          git add images
          if git diff --cached --quiet; then
            echo "No new pictures to save."
            exit 0
          fi
          n=$(git diff --cached --name-only | wc -l)
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Pictures made with Gemini ($n)"
          git pull --rebase origin main
          git push origin HEAD:main
