name: Check the AI judge (temporary)

# Asks the live judge a few tricky questions with the game's prompt. Removed again after the check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Ask the judge
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_PASS: ${{ secrets.RELAY_PASS }}
        run: node tools/judge-check/run.js
