name: Check relay address (temporary)

# One-off check that the AI judge relay answers at the address the game will use by default.
# Prints only whether the RELAY_URL secret matches and the relay's public status text.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare and ask the relay for its status
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          want="https://case-room-judge.youth-bf0.workers.dev"
          have="${RELAY_URL%/}"
          if [ "$have" = "$want" ]; then echo "::notice::The RELAY_URL secret is $want"; else echo "::warning::The RELAY_URL secret is a different address"; fi
          out=$(curl -sS --max-time 20 -A "Mozilla/5.0 (compatible; case-room-check/1.0)" "$want/" | head -c 400 || true)
          out="${out//$'\n'/ | }"
          echo "::notice::GET $want answers: ${out:-nothing}"
