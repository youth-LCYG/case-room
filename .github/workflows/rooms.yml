name: Deploy rooms server

# Puts rooms/worker.js (the multiplayer room server) on Cloudflare.
# Needs the repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "rooms/**"
      - ".github/workflows/rooms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rooms-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check the Cloudflare secrets
        if: env.READY != 'true'
        run: echo "::warning::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then run this workflow again."

      - name: Checkout
        if: env.READY == 'true'
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare
        id: deploy
        if: env.READY == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: rooms

      # Shows where the server went and whether it answers, as notes on the run.
      - name: Check the server
        if: env.READY == 'true'
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "::notice::Deployed to: ${DEPLOYED_URL:-unknown}"
          url="https://case-room-rooms.youth-bf0.workers.dev"
          for i in 1 2 3 4 5 6; do
            out=$(curl -sS --max-time 10 "$url/" || true)
            case "$out" in *case-room-rooms*) break ;; esac
            sleep 5
          done
          echo "::notice::$url answers: ${out:-nothing}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST -H 'Origin: https://youth-lcyg.github.io' "$url/rooms" || true)
          echo "::notice::Creating a test room from the game's address: HTTP $code"
