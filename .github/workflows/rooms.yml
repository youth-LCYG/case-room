name: Deploy rooms server

# Puts rooms/worker.js (the multiplayer room server) on Cloudflare.
# Needs the repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "rooms/**"
      - ".github/workflows/rooms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rooms-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check the Cloudflare secrets
        if: env.READY != 'true'
        run: echo "::warning::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then run this workflow again."

      - name: Checkout
        if: env.READY == 'true'
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare
        if: env.READY == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: rooms
