<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="예/아니오 질문만으로 사건의 진상을 밝히는 추리 게임 · A yes-or-no deduction game">
<meta name="theme-color" content="#0a0e15">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Case Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root {
  /* Layout: a dark case room. Home is a grid of picture case files; a case shows its picture and statement on the left and the questioning desk on the right; phones stack picture, questions, tools, transcript. One dark look by design. */
  color-scheme: dark;
  --bg: #0a0e15;
  --panel: #10151f;
  --panel-2: #161d2a;
  --field: #0c1119;
  --line: #1f2836;
  --line-strong: #2e3a4e;
  --ink: #e8ecf3;
  --ink-2: #aab3c3;
  --ink-3: #7a869b;
  --accent: #d9b25f;
  --accent-ink: #171207;
  --yes: #5fd09a;
  --no: #ff8a7d;
  --meh: #a8b0bf;
  --silent: #b99cf4;
  --rephrase: #7cc0ea;
  --shadow: rgba(0, 0, 0, 0.6);
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-display: "Noto Serif KR", "AppleMyungjo", "Batang", Georgia, serif;
}

html { font-size: clamp(15px, 0.5vw + 10.5px, 20px); font-synthesis: none; -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(1100px 520px at 85% -8%, rgba(217, 178, 95, 0.07), transparent 62%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.55;
}
:root[lang="ko"] body { word-break: keep-all; overflow-wrap: break-word; }
button, input, textarea { font: inherit; color: inherit; }
p, h1, h2, h3, h4 { margin: 0; }
h1, h2, h3, h4 { font-weight: 700; }

.wrap {
  max-width: 1320px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 3rem;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 0.75rem 1.25rem; padding-block: 1rem; border-bottom: 1px solid var(--line);
}
.brand {
  display: inline-flex; align-items: center; gap: 0.6rem; background: none; border: 0; padding: 0;
  color: var(--ink); cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; line-height: 1.2;
}
.brand svg { width: 1.55rem; height: 1.55rem; color: var(--accent); flex: none; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--field); border: 1px solid var(--line-strong); border-radius: 9px; }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); padding: 0.3rem 0.7rem; border-radius: 6px;
  font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.mode-chip { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
.mode-chip i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--ink-3); }
.mode-chip[data-s="connecting"] i { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }

/* Shared pieces */
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
:root[lang="ko"] .eyebrow { letter-spacing: 0.08em; }
.fineprint { font-size: 0.82rem; color: var(--ink-3); }
.vchip {
  display: inline-flex; align-items: center; padding: 0.1rem 0.55rem; border-radius: 6px;
  font-size: 0.8rem; font-weight: 700; line-height: 1.5; white-space: nowrap; color: var(--c);
  background: color-mix(in srgb, var(--c) 12%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
}
.v-yes { --c: var(--yes); }
.v-no { --c: var(--no); }
.v-meh { --c: var(--meh); }
.v-silent { --c: var(--silent); }
.v-rephrase { --c: var(--rephrase); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--line-strong); }
.dots i.on { background: var(--accent); }
.keys-chip {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em; color: var(--ink-2);
  border: 1px solid var(--line-strong); border-radius: 5px; padding: 0.06rem 0.45rem; white-space: nowrap;
}
.answer-set { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.55rem; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink);
  padding: 0.55rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; line-height: 1.3; cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s, filter 0.15s;
}
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.08); }
.btn-danger { background: transparent; border-color: color-mix(in srgb, var(--no) 55%, transparent); color: var(--no); }
.btn-small { padding: 0.35rem 0.75rem; font-size: 0.85rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.notice {
  border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--ink); padding: 0.65rem 0.85rem; border-radius: 8px; font-size: 0.95rem;
}
.ok-msg {
  border: 1px solid color-mix(in srgb, var(--yes) 50%, transparent); background: color-mix(in srgb, var(--yes) 8%, transparent);
  color: var(--ink); padding: 0.65rem 0.85rem; border-radius: 8px; font-size: 0.95rem;
}
.panel { display: grid; gap: 0.7rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; }
.panel.warn { border-color: color-mix(in srgb, var(--no) 50%, transparent); }
.panel h4 { font-family: var(--font-display); font-size: 1.05rem; margin-top: 0.3rem; }

/* Pictures */
.media { display: block; position: relative; overflow: hidden; background: var(--field); aspect-ratio: 16 / 9; max-width: 100%; }
.media .ph {
  position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 0.4rem; color: var(--ink-3);
  background-image:
    radial-gradient(120% 90% at 50% 0%, rgba(217, 178, 95, 0.06), transparent 60%),
    repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 14px);
}
.media .ph b { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1; color: rgba(232, 236, 243, 0.12); }
.media .ph svg { width: 1.6rem; height: 1.6rem; opacity: 0.55; }
.media img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
  transition: opacity 0.35s ease, transform 0.5s ease, filter 0.35s ease;
}
.media img[data-ok] { opacity: 1; }
.media .tag {
  position: absolute; left: 0.6rem; top: 0.6rem; z-index: 1; font-family: var(--font-mono); font-size: 0.68rem;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); background: rgba(8, 11, 17, 0.74);
  border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.18rem 0.5rem; border-radius: 5px;
}
.media .tag.status { left: auto; right: 0.6rem; color: var(--accent); letter-spacing: 0.04em; text-transform: none; font-family: var(--font-ui); font-weight: 600; }
.media.zoomable.has-img { cursor: zoom-in; }
.zoom {
  position: absolute; right: 0.6rem; bottom: 0.6rem; z-index: 1; display: none; align-items: center; gap: 0.35rem;
  background: rgba(8, 11, 17, 0.78); color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 7px; padding: 0.3rem 0.6rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;
}
.zoom svg { width: 0.9rem; height: 0.9rem; }
.media.has-img .zoom { display: inline-flex; }

/* Home */
.intro { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2rem; align-items: center; padding-block: 2.6rem 2.2rem; }
.intro h2 {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 3.8vw, 3.2rem);
  line-height: 1.22; letter-spacing: -0.01em; text-wrap: balance; max-width: 16ch; margin-top: 0.6rem;
}
:root[lang="ko"] .intro h2 { max-width: 12em; }
.rules { list-style: none; margin: 1.5rem 0 0; padding: 0; display: grid; gap: 0.55rem; max-width: 34rem; }
.rules li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); align-items: baseline; color: var(--ink-2); font-size: 1.02rem; }
.rules li b { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; color: var(--accent); }
.hero-media { border-radius: 14px; border: 1px solid var(--line); aspect-ratio: 16 / 10; }
.hero-media:not(.has-img) { display: none; }
@media (min-width: 900px) {
  .intro:has(.hero-media.has-img) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 3rem; }
}
.shelf { padding-block: 1.8rem 1rem; border-top: 1px solid var(--line); }
.shelf-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.7rem 1.5rem; margin-bottom: 1.2rem; }
.shelf-title { display: flex; align-items: baseline; gap: 0.6rem; }
.shelf h2 { font-family: var(--font-display); font-size: 1.65rem; line-height: 1.15; }
.count { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-3); }
.note { color: var(--ink-2); font-size: 0.92rem; margin-top: 0.3rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 1.1rem; }
.case-card {
  display: flex; flex-direction: column; text-align: left; padding: 0; cursor: pointer; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
}
.case-card:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: 0 18px 36px -24px var(--shadow); }
.case-card .media { aspect-ratio: 16 / 10; border-bottom: 1px solid var(--line); }
.case-card .media img { filter: grayscale(0.85) brightness(0.8); }
.case-card:hover .media img, .case-card:focus-visible .media img { filter: none; transform: scale(1.03); }
.cc-body { display: grid; gap: 0.4rem; padding: 0.85rem 1rem 1rem; }
.cc-title { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.3; }
.cc-teaser {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-size: 0.88rem; line-height: 1.5; color: var(--ink-2);
}
.cc-meta { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.15rem; }

/* Settings */
.settings { margin-top: 1rem; max-width: 40rem; }
.settings-title { font-family: var(--font-display); font-size: 1.3rem; }
.settings-form { display: grid; gap: 0.45rem; }
.settings-form label { font-weight: 600; font-size: 0.9rem; margin-top: 0.3rem; }
.settings-form input {
  min-width: 0; padding: 0.6rem 0.75rem; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--field); font-family: var(--font-mono); font-size: 0.95rem;
}
.settings-form .actions { margin-top: 0.5rem; }

/* Case */
.case-head { display: grid; gap: 0.45rem; padding-block: 1.2rem 1.3rem; }
.back { justify-self: start; background: none; border: 0; padding: 0.2rem 0; color: var(--ink-2); font-weight: 600; font-size: 0.92rem; cursor: pointer; }
.back:hover { color: var(--ink); }
.fileline { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; }
.fileno { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.case-title { font-family: var(--font-display); font-size: clamp(1.9rem, 3.2vw, 2.7rem); line-height: 1.15; text-wrap: balance; }
.case-grid { display: flex; flex-direction: column; gap: 1.1rem; }
.col-left, .col-right { display: contents; }
.b-scene { order: 1; }
.b-ask { order: 2; }
.b-tools { order: 3; }
.b-log { order: 4; }
@media (min-width: 960px) {
  .case-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 1.6rem; align-items: start; }
  .col-left, .col-right { display: flex; flex-direction: column; gap: 1.1rem; min-width: 0; }
}
.scene { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.scene > .media { border-bottom: 1px solid var(--line); }
.scene-body { display: grid; gap: 0.9rem; padding: 1.1rem 1.3rem 1.3rem; }
.setup { font-size: 1.3rem; line-height: 1.72; font-weight: 500; max-width: 62ch; }
.scene-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 1rem; }

.tools { display: grid; gap: 0.9rem; }
.hint-card {
  display: grid; gap: 0.5rem; width: 100%; text-align: left; cursor: pointer; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.85rem 1rem 1rem; transition: border-color 0.15s;
}
.hint-card:hover { border-color: var(--line-strong); }
.hint-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.3rem 1rem; }
.hint-tag { font-size: 0.78rem; color: var(--ink-3); }
.hint-card .eyebrow { color: var(--accent); }
.htext { display: block; font-size: 1.08rem; line-height: 1.6; }
.hint-media { border-radius: 9px; border: 1px solid var(--line); margin-top: 0.2rem; width: 100%; max-width: 28rem; }
.hint-media:not(.has-img) { display: none; }
.confirm-q { font-weight: 600; }
.notes-warn { font-weight: 600; color: var(--no); }
.solve textarea {
  width: 100%; box-sizing: border-box; min-height: 8rem; padding: 0.7rem 0.8rem; border: 1px solid var(--line-strong);
  border-radius: 8px; background: var(--field); font-size: 1.05rem; line-height: 1.55; resize: vertical;
}
.waiting { color: var(--ink-2); align-self: center; }
.check-result { display: grid; gap: 0.4rem; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
.checklist li { display: flex; gap: 0.6rem; align-items: baseline; }
.mark { font-weight: 700; width: 1.1rem; flex: none; }
.mark.hit { color: var(--yes); }
.mark.miss { color: var(--no); }
.feedback { color: var(--ink-2); }

.desk { display: grid; gap: 0.9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.2rem 1.2rem; }
.desk-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
.count-big { display: flex; align-items: baseline; gap: 0.5rem; }
.count-big b { font-size: 2.5rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.count-big span { color: var(--ink-3); font-size: 0.9rem; }
.count-small { display: flex; flex-direction: column; align-items: flex-end; gap: 0.15rem; text-align: right; color: var(--ink-2); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.next-hint { color: var(--accent); font-size: 0.82rem; }
.count-small b { color: var(--ink); }
.ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.55rem; }
.ask input, .memo {
  min-width: 0; width: 100%; box-sizing: border-box; padding: 0.75rem 0.9rem; border: 1px solid var(--line-strong);
  border-radius: 10px; background: var(--field); font-size: 1.1rem;
}
.ask input:disabled { opacity: 0.55; }
.ask .btn { padding-inline: 1.2rem; }
.vpad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6rem; }
.vbtn {
  min-height: 4.4rem; padding: 0.6rem 0.4rem; border-radius: 10px; cursor: pointer; color: var(--c);
  border: 1.5px solid color-mix(in srgb, var(--c) 50%, transparent); background: color-mix(in srgb, var(--c) 9%, transparent);
  font-weight: 700; font-size: clamp(1.15rem, 1.9vw, 1.6rem); line-height: 1.15; overflow-wrap: anywhere;
  transition: background-color 0.12s, transform 0.08s;
}
.vbtn.long { font-size: clamp(0.95rem, 1.3vw, 1.15rem); }
.vbtn:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
.vbtn:active { transform: scale(0.98); }
.pad-foot { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.4rem 1rem; }
.undo { background: none; border: 0; padding: 0.1rem 0; color: var(--ink-2); text-decoration: underline; cursor: pointer; font-size: 0.88rem; }
.stage {
  min-height: 10.5rem; display: grid; align-content: center; justify-items: center; gap: 0.8rem; text-align: center;
  padding: 1.2rem 0.6rem; border-radius: 12px; background: var(--field); border: 1px solid var(--line);
}
.stage-q { color: var(--ink-2); font-size: 1.05rem; max-width: 40ch; overflow-wrap: anywhere; }
.stage-empty { color: var(--ink-3); }
.stage-note { color: var(--rephrase); font-weight: 600; }
.verdict {
  display: inline-block; max-width: 100%; box-sizing: border-box; color: var(--c);
  font-weight: 700; font-size: clamp(2.1rem, 4.2vw, 3.6rem); line-height: 1.08; text-wrap: balance;
  padding: 0.16em 0.6em 0.2em; border-radius: 14px;
  border: 2px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent);
}
.verdict.long { font-size: clamp(1.6rem, 3vw, 2.5rem); }
.verdict.fresh { animation: pop 0.28s cubic-bezier(0.2, 0.8, 0.3, 1.2) both; }
@keyframes pop { from { transform: scale(0.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.thinking { color: var(--ink-2); font-size: 1.2rem; }
.thinking::after { content: "▍"; margin-left: 0.15rem; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.log { display: grid; gap: 0.5rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.2rem 0.5rem; }
.log-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
.transcript { list-style: none; margin: 0; padding: 0; }
.transcript li {
  display: grid; grid-template-columns: 2.8rem minmax(0, 1fr) auto; gap: 0.25rem 0.75rem;
  align-items: baseline; padding: 0.62rem 0; border-top: 1px solid var(--line);
}
.tn { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tq { font-size: 1rem; overflow-wrap: anywhere; }
.tq.muted { color: var(--ink-3); }
.tnote { grid-column: 2 / -1; font-size: 0.85rem; color: var(--rephrase); }
.empty { color: var(--ink-3); padding: 0.2rem 0 0.8rem; }
@media (max-width: 560px) {
  .transcript li { grid-template-columns: 2.4rem minmax(0, 1fr); }
  .transcript .vchip { grid-column: 2; justify-self: start; }
}

.closing { display: grid; gap: 0.9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1.3rem 1.3rem 1.4rem; }
.closing .verdict { justify-self: start; }
.closing h3 { font-family: var(--font-display); font-size: 1.2rem; margin-top: 0.5rem; }
.rank { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: var(--accent); }
.truth { font-size: 1.08rem; line-height: 1.75; }
.keylist, .silentlist { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.45rem; color: var(--ink-2); }
.keylist strong { color: var(--ink); }
.readit { color: var(--ink-2); }

/* Closing: truth picture, key-point chips, clue archive */
.truth-pic .media { border-radius: 10px; border: 1px solid var(--line); margin-top: 0.45rem; }
.truth-pic:has(.truth-media:not(.has-img)) { display: none; }
.kchips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.45rem; }
.kchip {
  display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.32rem 0.7rem; border-radius: 999px;

.clue-archive .arch-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.4rem 1rem; }
.unlock-chip {
  font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent); border-radius: 6px; padding: 0.15rem 0.5rem;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
}
.hint-card.archive { cursor: default; box-sizing: border-box; }
.hint-card.archive:hover { border-color: var(--line); }
.hint-tag.unlocked { color: var(--accent); }

/* Hint pop-up */
.clue-modal {
  position: fixed; inset: 0; z-index: 40; display: flex; overflow-y: auto; background: rgba(3, 5, 9, 0.8);
  padding: max(1rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px)) max(1rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
}
.clue-card {
  margin: auto; width: min(100%, 50rem); box-sizing: border-box; display: grid; gap: 0.9rem; justify-items: center; text-align: center;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 16px; padding: 1.4rem 1.5rem 1.5rem;
  box-shadow: 0 40px 90px -30px #000; animation: rise 0.25s ease both;
}
.clue-card .eyebrow { color: var(--accent); }
.clue-card h2 { font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); line-height: 1.25; text-wrap: balance; }
.clue-text {
  width: 100%; box-sizing: border-box; text-align: left; font-size: 1.28rem; line-height: 1.65;
  background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.2rem;
}
.clue-media { width: 100%; border-radius: 12px; border: 1px solid var(--line); }
.clue-media:not(.has-img) { display: none; }
.clue-nav { display: flex; align-items: center; gap: 0.6rem; }
.clue-nav span { font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-3); }
.clue-close { min-width: 8rem; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Picture viewer */
.lightbox {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; cursor: zoom-out;
  padding: max(1rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px)) max(1rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
  background: rgba(3, 5, 9, 0.92);
}
.lightbox img { max-width: min(96vw, 1600px); max-height: 88vh; border-radius: 10px; box-shadow: 0 30px 80px -20px #000; }
.lb-close {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 0.8rem); right: calc(env(safe-area-inset-right, 0px) + 0.8rem);
  width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: 50%; cursor: pointer;
  background: rgba(16, 21, 31, 0.9); color: var(--ink); border: 1px solid var(--line-strong);
}
.lb-close svg { width: 1.1rem; height: 1.1rem; }

@media (prefers-reduced-motion: reduce) {
  .verdict.fresh, .thinking::after, .mode-chip[data-s="connecting"] i, .clue-card { animation: none; }
  .case-card, .media img, .vbtn, .btn { transition: none; }
  .case-card:hover, .case-card:hover .media img { transform: none; }
}

  const L = obj => (obj && (obj[state.lang] ?? obj.en)) || "";
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
  const cur = () => CASES.find(c => c.id === state.caseId);
  const effMode = () => (state.mode === "host" || ai.status === "off" || ai.status === "blocked") ? "host" : "ai";

  function game(id) {
    if (!state.games[id]) state.games[id] = { log: [], hints: 0, hintSrc: [], attempts: 0, status: "open", lastCheck: null };
    return state.games[id];
  }
  const counted = g => g.log.filter(x => x.v !== "INVALID").length;
  const rankIndex = (q, h) => { const s = q + 5 * h; return s <= 10 ? 0 : s <= 20 ? 1 : s <= 35 ? 2 : 3; };
  const teaser = c => { const s = L(c.setup); const m = s.match(/^.+?[.!?](?=\s|$)/); return m ? m[0] : s; };

  // Cloudflare refills the free AI allowance at 00:00 UTC; show that moment in local time.
  function resetTime() {
    const d = new Date();
    d.setUTCHours(24, 0, 0, 0);
    try {
      return d.toLocaleTimeString(state.lang === "ko" ? "ko-KR" : "en-US", { hour: "numeric", minute: "2-digit" });
    } catch (e) {
      return "00:00 UTC";
    }
  }
  function errText(t, key) {
    return (t.err[key] || t.err.generic).replace("{time}", resetTime());
  }

  /* ---------- AI prompts (used only inside Claude) ---------- */
  function judgePrompt(c, g, question) {
    const bible = c.kind === "bible";
    const langName = state.lang === "ko" ? "Korean" : "English";
    const history = g.log.filter(x => x.v !== "INVALID" && x.q).slice(-8)
      .map(x => `Q: ${x.q}\nA: ${x.v}`).join("\n") || "(none yet)";
    const parts = [
      "You are the judge in a yes/no deduction game. A group (often a church youth group) sees only the SETUP and tries to uncover the hidden story by asking yes/no questions. You answer each new question with exactly one verdict.",
      "",
      `CASE TYPE: ${bible ? "Bible case based on " + c.ref.en : "fictional mystery"}`,
      `SETUP shown to players:\n${c.setup.en}`,
      "",
      `SECRET FACTS (authoritative${bible ? "; they summarize the passage" : "; treat them as the complete truth"}):\n${c.facts}`
    ];
    if (bible) {
      parts.push("",
        `Judge strictly by what the Bible text says (${c.ref.en}; parallel passages count). Do not add church tradition, movie or storybook details, or guesses about feelings and motives the text does not state.`,
        `THE TEXT DOES NOT STATE (answer NOT_STATED if asked):\n${c.notStated}`);
    }
    parts.push("",
      "VERDICTS:",
      `YES = the question is true according to the ${bible ? "text" : "facts"}.`,
      `NO = the question is false according to the ${bible ? "text" : "facts"}.`,
      bible
        ? "NOT_STATED = the text does not say, even if tradition or common sense suggests an answer."
        : "IRRELEVANT = the facts do not settle it, and it does not matter for solving the case.",
      `INVALID = it cannot be answered with yes or no, it asks two separate things at once, it asks you to explain or reveal the answer, or it is not a real question. Only for INVALID, write a short reason in ${langName} (at most 12 words) in "note".`,
      "",
      "RULES:",
      "- Judge only the NEW question. Use earlier questions only to understand words like \"he\" or \"that\".",
      "- Accept loose wording, synonyms, typos, and either Korean or English.",
      "- If a single claim is partly false, answer NO.",
      "- Never add hints or explanations. \"note\" must be \"\" unless the verdict is INVALID.",
      "",
      `EARLIER QUESTIONS:\n${history}`,
      "",
      `NEW QUESTION: ${question}`,
      "",
      `Reply with only JSON, for example {"verdict":"YES","note":""}. Allowed verdicts: YES, NO, ${bible ? "NOT_STATED" : "IRRELEVANT"}, INVALID.`
    );
    return parts.join("\n");
  }

  function gradePrompt(c, text) {
    const langName = state.lang === "ko" ? "Korean" : "English";
    const keys = c.keys.map(k => `- ${k.id}: ${k.text.en}`).join("\n");
    return [
      "You check a player's proposed solution in a yes/no deduction game.",
      "",
      `SETUP: ${c.setup.en}`,
      `TRUTH: ${c.truth.en}`,
      `FACTS:\n${c.facts}`,
      "",
      "KEY POINTS the solution must capture. Wording may differ, and Korean or English is fine, but the core idea must be right. A vague guess that only hints at it does not count. Wrong extra details elsewhere do not cancel a key point that is right.",
      keys,
      "",
      `PLAYER'S SOLUTION:\n"""${text}"""`,
      "",
      "For each key point id, give true if the solution captures it and false if it is missing or wrong.",
      `Also write "feedback": one short encouraging sentence in ${langName} that does NOT reveal any missing or secret information.`,
      `Reply with only JSON, for example {"hits":{"${c.keys[0].id}":true},"feedback":"..."}`
    ].join("\n");
  }

  /* ---------- Asking the AI: Claude inside Claude, Cloudflare Workers AI through the relay elsewhere ---------- */
  function parseJSONLoose(text) {
    try { return JSON.parse(text); } catch (e) { /* try the braces */ }
    const a = text.indexOf("{");
    const b = text.lastIndexOf("}");
    if (a >= 0 && b > a) {
      try { return JSON.parse(text.slice(a, b + 1)); } catch (e) { /* not JSON */ }
    }
    return null;
  }

  async function aiJSON(prompt, task, signal) {
    if (ai.source === "claude") {
      return ai.sample.json(prompt, task === "grade" ? { modelTier: "default", signal } : { modelTier: "quick" });
    }
    if (ai.source !== "relay" || !relay.url) throw { code: "not_declared" };
    let res;
    try {
      res = await fetch(relay.url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Passcode": relay.pass },
        body: JSON.stringify({ prompt, task }),
        signal
      });
    } catch (e) {
      if (e && e.name === "AbortError") throw { code: "cancelled" };
      throw { code: "relay_down" };
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    if (!res.ok) {
      const err = data && data.error;
      if (res.status === 401 || err === "bad_passcode") throw { code: "bad_passcode" };
      if (res.status === 429 || err === "rate_limited") throw { code: "relay_rate" };
      if (err === "not_configured") throw { code: "relay_config" };
      throw { code: "upstream_error" };
    }
    const parsed = parseJSONLoose(data && typeof data.text === "string" ? data.text : "");
    if (parsed === null || typeof parsed !== "object") throw { code: "invalid_json" };
    return parsed;
  }

  /* ---------- Pictures ---------- */
  // Pictures live in an images/ folder next to index.html:
  //   images/<case id>-cover.jpg, images/<case id>-hint1.jpg, images/<case id>-hint2.jpg, images/hero.jpg (.png works too)
  // A missing file leaves the placeholder in place. The Claude page cannot load these files, so it skips them.
  const CAN_IMAGES = !hasClaude;
  const IMG_EXT = ["jpg", "png"];
  const imgState = {};   // picture name -> working address, or null when no file exists
  const hasPic = name => CAN_IMAGES && typeof imgState[name] === "string";

  const ICON_LENS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>';
  const ICON_MARK = '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="1.5" y="1.5" width="25" height="25" rx="7"/><circle cx="12.5" cy="12.5" r="5"/><path d="M16.3 16.3 20.5 20.5"/></svg>';
  const ICON_ZOOM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>';
  const ICON_CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  function pic(name, alt, lazy) {
    if (!CAN_IMAGES || imgState[name] === null) return "";
    const known = imgState[name];
    const src = known || `images/${name}.${IMG_EXT[0]}`;
    return `<img src="${esc(src)}" alt="${esc(alt)}" decoding="async"${lazy ? ' loading="lazy"' : ""} data-pic="${esc(name)}" data-ext="0"${known ? " data-ok" : ""}>`;
  }

  // o.el: "span" inside buttons. o.big: faint text shown while there is no picture.
  function media(name, alt, o = {}) {
    const el = o.el || "div";
    const cls = ["media", o.cls || "", o.zoom ? "zoomable" : "", hasPic(name) ? "has-img" : ""].filter(Boolean).join(" ");
    return `<${el} class="${cls}" data-media${o.zoom ? ' data-act="zoom"' : ""}>
      <span class="ph" aria-hidden="true">${o.big ? `<b>${esc(o.big)}</b>` : ICON_LENS}</span>
      ${pic(name, alt, o.lazy)}
      ${o.tag ? `<span class="tag">${esc(o.tag)}</span>` : ""}
      ${o.status ? `<span class="tag status">${esc(o.status)}</span>` : ""}
      ${o.zoom ? `<button type="button" class="zoom" data-act="zoom">${ICON_ZOOM}<span>${esc(u().zoom)}</span></button>` : ""}
    </${el}>`;
  }

  // When a picture loads, remember its address; when it is missing, try the next file type, then fall back to the placeholder.
  document.addEventListener("load", e => {
    const im = e.target;
    if (!(im instanceof HTMLImageElement) || !im.dataset.pic) return;
    imgState[im.dataset.pic] = im.getAttribute("src");
    im.setAttribute("data-ok", "");
    const box = im.closest("[data-media]");
    if (box) box.classList.add("has-img");
  }, true);
  document.addEventListener("error", e => {
    const im = e.target;
    if (!(im instanceof HTMLImageElement) || !im.dataset.pic) return;
    const next = Number(im.dataset.ext || 0) + 1;
    if (next < IMG_EXT.length) {
      im.dataset.ext = String(next);
      im.src = `images/${im.dataset.pic}.${IMG_EXT[next]}`;
      return;
    }
    imgState[im.dataset.pic] = null;
    const box = im.closest("[data-media]");
    im.remove();
    if (box) box.classList.remove("has-img");
  }, true);

  // Cases are numbered by their place on each shelf. A Bible case shows its passage only after it is closed.
  const caseNo = c => String(CASES.filter(k => k.kind === c.kind).indexOf(c) + 1).padStart(2, "0");
  const tagFor = c => c.kind === "bible" ? u().bibleTag(caseNo(c)) : `Case ${caseNo(c)}`;
  const bigFor = c => caseNo(c);

  /* ---------- Rendering ---------- */
  const app = document.getElementById("app");

  function chip(v) {
    const V = VERDICTS[v];
    return `<span class="vchip ${V.cls}">${esc(V[state.lang])}</span>`;
  }
  function dots(c) {
    return `<span class="dots" role="img" aria-label="${esc(u().level[c.level - 1])}">${[1, 2, 3].map(n => `<i class="${n <= c.level ? "on" : ""}"></i>`).join("")}</span>`;
  }
  function progressLabel(t, g) {
    if (!g) return "";
    if (g.status === "solved") return t.solvedTag;
    if (g.status === "revealed") return t.revealedTag;
    return counted(g) ? t.inProgress(counted(g)) : "";
  }
  function truthBlock(c, t, Tag) {
    const bible = c.kind === "bible";
    return `<${Tag}>${esc(t.truthTitle)}</${Tag}>
      <p class="truth">${esc(L(c.truth))}</p>
      <${Tag}>${esc(t.keysTitle)}</${Tag}>
      <ul class="keylist">${c.keys.map(k => `<li><strong>${esc(L(k.label))}.</strong> ${esc(L(k.text))}</li>`).join("")}</ul>
      ${bible ? `<${Tag}>${esc(t.silentTitle)}</${Tag}>
      <ul class="silentlist">${c.silent.map(s => `<li>${esc(L(s))}</li>`).join("")}</ul>` : ""}`;
  }

  function header() {
    const t = u();
    let mode;
    if (ai.status === "ready") {
      mode = `<div class="seg" role="group" aria-label="${esc(t.modeLabel)}">
        <button type="button" data-act="mode" data-mode="ai" aria-pressed="${state.mode === "ai"}">${esc(t.modeAi)}</button>
        <button type="button" data-act="mode" data-mode="host" aria-pressed="${state.mode === "host"}">${esc(t.modeHost)}</button>
      </div>`;
    } else {
      const connecting = ai.status === "connecting" && state.mode === "ai";
      mode = `<span class="mode-chip" data-s="${connecting ? "connecting" : "host"}"><i></i>${esc(connecting ? t.aiConnecting : t.modeHost)}</span>`;
    }
    const connect = hasClaude ? "" :
      `<button type="button" class="btn btn-small" data-act="settings" aria-expanded="${showSettings}">${esc(t.connectBtn)}</button>`;
    return `<header class="top">
      <h1><button type="button" class="brand" data-act="home">${ICON_MARK}<span>${esc(t.brand)}</span></button></h1>
      <div class="controls">
        ${mode}
        ${connect}
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-act="lang" data-lang="ko" aria-pressed="${state.lang === "ko"}">한국어</button>
          <button type="button" data-act="lang" data-lang="en" aria-pressed="${state.lang === "en"}">English</button>
        </div>
      </div>
    </header>`;
  }

  function settingsPanel() {
    const t = u();
    let msg = "";
    if (settingsMsg) {
      const text = t[settingsMsg.key] || errText(t, settingsMsg.key);
      msg = `<p class="${settingsMsg.ok ? "ok-msg" : "notice"}" role="status">${esc(text)}</p>`;
    }
    return `<section class="panel settings" aria-labelledby="settings-h">
      <h2 id="settings-h" class="settings-title">${esc(t.settingsTitle)}</h2>
      <p class="fineprint">${esc(t.settingsIntro)}</p>
      <form class="settings-form" data-form="settings" autocomplete="off">
        <label for="relay-url">${esc(t.relayUrlLabel)}</label>
        <input id="relay-url" type="url" inputmode="url" spellcheck="false" placeholder="${esc(t.relayUrlPh)}">
        <label for="relay-pass">${esc(t.relayPassLabel)}</label>
        <input id="relay-pass" type="password" autocomplete="off">
        <div class="actions">
          <button type="submit" class="btn btn-primary" ${testing ? "disabled" : ""}>${esc(testing ? t.testing : t.testSave)}</button>
          ${relay.url ? `<button type="button" class="btn btn-danger" data-act="disconnect" ${testing ? "disabled" : ""}>${esc(t.disconnect)}</button>` : ""}
          <button type="button" class="btn" data-act="settings-close">${esc(t.close)}</button>
        </div>
      </form>
      ${msg}
    </section>`;
  }

  function homeView() {
    const t = u();
    const card = c => `<button type="button" class="case-card" data-act="open" data-id="${c.id}">
        ${media(`${c.id}-cover`, L(c.title), { el: "span", lazy: true, tag: tagFor(c), status: progressLabel(t, state.games[c.id]), big: bigFor(c) })}
        <span class="cc-body">
          <span class="cc-title">${esc(L(c.title))}</span>
          <span class="cc-teaser">${esc(teaser(c))}</span>
          <span class="cc-meta">${dots(c)}<span class="keys-chip">${esc(t.keysChip(c.keys.length))}</span></span>
        </span>
      </button>`;
    const shelf = (kind, title, note, set) => {
      const list = CASES.filter(c => c.kind === kind);
      return `<section class="shelf" aria-labelledby="h-${kind}">
        <div class="shelf-head">
          <div>
            <div class="shelf-title"><h2 id="h-${kind}">${esc(title)}</h2><span class="count">${esc(t.count(list.length))}</span></div>
            <p class="note">${esc(note)}</p>
          </div>
          <div class="answer-set"><span class="eyebrow">${esc(t.answersLabel)}</span>${set.map(chip).join("")}</div>
        </div>
        <div class="cards">${list.map(card).join("")}</div>
      </section>`;
    };
    return `<main>
      <section class="intro">
        <div>
          <p class="eyebrow">${esc(t.kicker)}</p>
          <h2>${esc(t.tagline)}</h2>
          <ol class="rules">${t.steps.map((s, i) => `<li><b>0${i + 1}</b><span>${esc(s)}</span></li>`).join("")}</ol>
        </div>
        ${CAN_IMAGES ? media("hero", t.heroAlt, { cls: "hero-media" }) : ""}
      </section>
      ${casesStatus === "ready"
        ? `${shelf("mystery", t.mysteries, t.mysteriesNote, ["YES", "NO", "IRRELEVANT"])}
      ${shelf("bible", t.bible, t.bibleNote, ["YES", "NO", "NOT_STATED"])}`
        : `<section class="panel load-state" aria-live="polite">${casesStatus === "error"
          ? `<p class="notice">${esc(t.loadError)}</p><div class="actions"><button type="button" class="btn btn-primary" data-act="reload-cases">${esc(t.retry)}</button></div>`
          : `<p class="fineprint">${esc(t.loading)}</p>`}</section>`}
    </main>`;
  }

  // Once a case is closed, every hint is shown with its picture, including the ones nobody opened.
  function clueArchive(c, g, t) {
    const unlocked = Math.max(0, c.hints.length - g.hints);
    const cards = c.hints.map((h, i) => {
      const opened = i < g.hints;
      return `<article class="hint-card archive">
          <span class="hint-top"><span class="eyebrow">${esc(t.hintBtn(i + 1))}</span><span class="hint-tag${opened ? "" : " unlocked"}">${esc(opened ? t.clueOpenedTag : t.clueUnlockedTag)}</span></span>
          <span class="htext">${esc(L(h))}</span>
          ${CAN_IMAGES ? media(`${c.id}-hint${i + 1}`, `${L(c.title)} · ${t.hintBtn(i + 1)}`, { cls: "hint-media", zoom: true }) : ""}
        </article>`;
    }).join("");
    return `<section class="tools b-tools clue-archive" aria-labelledby="arch-h">
        <div class="arch-head"><h3 id="arch-h" class="eyebrow">${esc(t.archiveTitle)}</h3>${unlocked ? `<span class="unlock-chip">${esc(t.unlockedChip(unlocked))}</span>` : ""}</div>
        ${unlocked ? `<p class="fineprint">${esc(t.archiveNote)}</p>` : ""}
        ${cards}
      </section>`;
  }

  function caseView() {
    const t = u();
    const c = cur();
    const g = game(c.id);
    const bible = c.kind === "bible";
    const q = counted(g);
    const closed = g.status !== "open";
    const mode = effMode();
    const aiOk = ai.status === "ready";
    const third = bible ? "NOT_STATED" : "IRRELEVANT";

    const scene = `<article class="scene b-scene">
      ${media(`${c.id}-cover`, L(c.title), { zoom: true, big: bigFor(c) })}
      <div class="scene-body">
        <p class="eyebrow">${esc(t.statement)}</p>
        <p class="setup">${esc(L(c.setup))}</p>
        <div class="scene-meta">
          <div class="answer-set"><span class="eyebrow">${esc(t.answersLabel)}</span>${["YES", "NO", third].map(chip).join("")}</div>
          <span class="keys-chip">${esc(t.keysChip(c.keys.length))}</span>
        </div>
      </div>
    </article>`;

    let tools = "";
    if (!closed) {
      const hints = c.hints.slice(0, g.hints).map((h, i) => {
        const auto = (g.hintSrc || [])[i] === "auto";
        return `<button type="button" class="hint-card" data-act="clue" data-i="${i}">
          <span class="hint-top"><span class="eyebrow">${esc(t.hintBtn(i + 1))}</span><span class="hint-tag">${esc(auto ? t.hintAutoTag(HINT_EVERY * (i + 1)) : t.hintManualTag)}</span></span>
          <span class="htext">${esc(L(h))}</span>
          ${CAN_IMAGES ? media(`${c.id}-hint${i + 1}`, `${L(c.title)} · ${t.hintBtn(i + 1)}`, { el: "span", cls: "hint-media" }) : ""}
        </button>`;
      }).join("");
      let panel = "";
      if (confirmAct) {
        const isReveal = confirmAct === "reveal";
        panel = `<div class="panel warn" role="group">
          <p class="confirm-q">${esc(isReveal ? t.revealConfirm : t.solvedConfirm)}</p>
          <div class="actions">
            <button type="button" class="btn ${isReveal ? "btn-danger" : "btn-primary"}" data-act="confirm-yes">${esc(isReveal ? t.revealYes : t.solvedYes)}</button>
            <button type="button" class="btn" data-act="confirm-no">${esc(t.keepGoing)}</button>
          </div>
        </div>`;
      } else if (mode === "ai" && showSolve) {
        let result = "";
        if (g.lastCheck) {
          const hits = c.keys.filter(k => g.lastCheck.hits[k.id]).length;
          result = `<div class="check-result" aria-live="polite">
            <p class="eyebrow">${esc(t.keysFound(hits, c.keys.length))}</p>
            <ul class="checklist">${c.keys.map(k => {
              const ok = !!g.lastCheck.hits[k.id];
              return `<li><span class="mark ${ok ? "hit" : "miss"}" aria-hidden="true">${ok ? "✓" : "✗"}</span><span>${esc(L(k.label))}</span></li>`;
            }).join("")}</ul>
            ${g.lastCheck.feedback ? `<p class="feedback">${esc(g.lastCheck.feedback)}</p>` : ""}
          </div>`;
        }
        panel = `<form class="panel solve" data-form="solve" autocomplete="off">
          <label class="eyebrow" for="sol">${esc(t.solveTitle)}</label>
          <textarea id="sol" maxlength="1500" placeholder="${esc(t.solvePlaceholder)}"></textarea>
          <div class="actions">
            ${busy === "check"
              ? `<span class="waiting">${esc(t.checking)}</span><button type="button" class="btn btn-danger" data-act="check-cancel">${esc(t.cancel)}</button>`
              : `<button type="submit" class="btn btn-primary" ${aiOk && !busy ? "" : "disabled"}>${esc(t.check)}</button><button type="button" class="btn" data-act="solve-close">${esc(t.cancel)}</button>`}
          </div>
          ${result}
        </form>`;
      } else if (mode === "host" && showNotes) {
        panel = `<div class="panel notes">
          <p class="notes-warn">${esc(t.notesWarn)}</p>
          ${truthBlock(c, t, "h4")}
          <div class="actions"><button type="button" class="btn" data-act="notes-close">${esc(t.close)}</button></div>
        </div>`;
      }
      const hintBtn = g.hints < c.hints.length
        ? `<button type="button" class="btn" data-act="hint">${esc(t.hintEarly(g.hints + 1))}</button>` : "";
      const modeBtns = mode === "ai"
        ? (showSolve ? "" : `<button type="button" class="btn" data-act="solve-open" ${aiOk ? "" : "disabled"}>${esc(t.solve)}</button>`)
        : `<button type="button" class="btn" data-act="solved">${esc(t.solvedBtn)}</button>
           <button type="button" class="btn" data-act="notes" aria-expanded="${showNotes}">${esc(t.notesBtn)}</button>`;
      const actions = confirmAct ? "" : `<div class="actions">${hintBtn}${modeBtns}<button type="button" class="btn" data-act="reveal">${esc(t.reveal)}</button></div>
        ${g.hints < c.hints.length ? `<p class="fineprint">${esc(t.hintRule(HINT_EVERY))}</p>` : ""}`;
      tools = `<section class="tools b-tools">${actions}${panel}${hints}</section>`;
    } else {
      tools = clueArchive(c, g, t);
    }

    let ask;
    if (closed) {
      const solved = g.status === "solved";
      const hits = g.lastCheck ? g.lastCheck.hits : null;
      const found = hits ? c.keys.filter(k => hits[k.id]).length : 0;
      const chips = c.keys.map(k => {
        const ok = !!(hits && hits[k.id]);
        return `<span class="kchip${ok ? " hit" : ""}">${ok ? '<i aria-hidden="true">✓</i>' : ""}${esc(L(k.label))}</span>`;
      }).join("");
      ask = `<section class="closing b-ask" aria-live="polite">
        <span class="verdict ${solved ? "v-yes" : "v-meh"}${freshStamp ? " fresh" : ""}">${esc(solved ? t.closedSolved : t.closedRevealed)}</span>
        ${solved ? `<p class="rank">${esc(t.rank[rankIndex(q, manualHints(g))])}</p><p class="readit">${esc(t.solvedIn(q, g.hints))}</p>` : ""}
        ${CAN_IMAGES ? `<div class="truth-pic"><p class="eyebrow">${esc(t.truthPicTitle)}</p>${media(`${c.id}-truth`, `${L(c.title)} · ${t.truthPicTitle}`, { cls: "truth-media", zoom: true })}</div>` : ""}
        <div class="kchips-wrap"><p class="eyebrow">${esc(t.keyChipsTitle(c.keys.length))}${hits ? ` · ${esc(t.keysFound(found, c.keys.length))}` : ""}</p><div class="kchips">${chips}</div></div>
        ${truthBlock(c, t, "h3")}
        ${bible ? `<p class="readit">${esc(t.readIt)}: <strong>${esc(L(c.ref))}</strong></p>` : ""}
        <div class="actions">
          <button type="button" class="btn btn-primary" data-act="home">${esc(t.back)}</button>
          <button type="button" class="btn" data-act="again">${esc(t.playAgain)}</button>
        </div>
      </section>`;
    } else {
      const last = g.log[g.log.length - 1];
      let stage;
      if (busy === "ask") {
        stage = `<div class="stage" aria-live="polite"><p class="stage-q">“${esc(pendingQ)}”</p><span class="thinking">${esc(t.thinking)}</span></div>`;
      } else if (last) {
        const V = VERDICTS[last.v];
        stage = `<div class="stage" aria-live="polite">
          ${last.q ? `<p class="stage-q">“${esc(last.q)}”</p>` : ""}
          <span class="verdict ${V.cls}${V.long ? " long" : ""}${freshStamp ? " fresh" : ""}">${esc(V[state.lang])}</span>
          ${last.note ? `<p class="stage-note">${esc(last.note)}</p>` : ""}
        </div>`;
      } else {
        stage = `<div class="stage"><p class="stage-empty">${esc(t.stageEmpty)}</p></div>`;
      }
      const notice = ai.noticeKey ? `<p class="notice" role="status">${esc(errText(t, ai.noticeKey))}</p>` : "";
      const deskHead = `<div class="desk-head">
          <div class="count-big"><b>${q}</b><span>${esc(t.questions)}</span></div>
          <div class="count-small"><span>${esc(t.hints)} <b>${g.hints}</b> / ${c.hints.length}</span><span class="next-hint">${esc(g.hints < c.hints.length ? t.nextHintIn(Math.max(0, HINT_EVERY * (g.hints + 1) - q)) : t.allHintsOpen)}</span></div>
        </div>`;
      if (mode === "ai") {
        ask = `<section class="desk b-ask">
          ${deskHead}
          <form class="ask" data-form="ask" autocomplete="off">
            <input id="q" type="text" maxlength="200" placeholder="${esc(t.askPlaceholder)}" aria-label="${esc(t.askLabel)}" ${aiOk ? "" : "disabled"}>
            <button type="submit" class="btn btn-primary" ${aiOk && !busy ? "" : "disabled"}>${esc(t.ask)}</button>
          </form>
          ${notice}
          <p class="fineprint">${esc(aiOk ? `${ai.source === "relay" ? t.relayConsent : t.consent} ${t.notCounted}` : t.aiConnectingNote)}</p>
          ${stage}
        </section>`;
      } else {
        ask = `<section class="desk b-ask">
          ${deskHead}
          <input id="memo" class="memo" type="text" maxlength="200" placeholder="${esc(t.memoPlaceholder)}" aria-label="${esc(t.memoLabel)}">
          <div class="vpad" role="group" aria-label="${esc(t.stampLabel)}">
            ${["YES", "NO", third].map(v => {
              const V = VERDICTS[v];
              return `<button type="button" id="stamp-${v}" class="vbtn ${V.cls}${V.long ? " long" : ""}" data-act="stamp" data-v="${v}">${esc(V[state.lang])}</button>`;
            }).join("")}
          </div>
          <div class="pad-foot">
            <p class="fineprint">${esc(t.hostIntro)}</p>
            ${g.log.length ? `<button type="button" class="undo" data-act="undo">${esc(t.undo)}</button>` : ""}
          </div>
          ${notice}
          ${stage}
        </section>`;
      }
    }

    let n = 0;
    const rows = g.log.map(x => ({ x, num: x.v === "INVALID" ? "–" : String(++n).padStart(2, "0") })).reverse();
    const log = `<section class="log b-log" aria-labelledby="log-h">
      <div class="log-head"><h3 id="log-h" class="eyebrow">${esc(t.transcript)}</h3></div>
      ${rows.length ? `<ul class="transcript">${rows.map(({ x, num }) => {
        const V = VERDICTS[x.v];
        return `<li><span class="tn">Q${esc(num)}</span>${x.q ? `<span class="tq">${esc(x.q)}</span>` : `<span class="tq muted">${esc(t.noRecord)}</span>`}<span class="vchip ${V.cls}">${esc(V[state.lang])}</span>${x.note ? `<span class="tnote">${esc(x.note)}</span>` : ""}</li>`;
      }).join("")}</ul>` : `<p class="empty">${esc(t.noQuestions)}</p>`}
    </section>`;

    return `<main>
      <div class="case-head">
        <button type="button" class="back" data-act="home">← ${esc(t.allCases)}</button>
        <div class="fileline"><span class="fileno">${esc(bible && closed ? L(c.ref) : tagFor(c))}</span>${dots(c)}</div>
        <h2 class="case-title">${esc(L(c.title))}</h2>
      </div>
      <div class="case-grid">
        <div class="col-left">${scene}${tools}</div>
        <div class="col-right">${ask}${log}</div>
      </div>
    </main>`;
  }

  /* ---------- Picture viewer ---------- */
  const lightbox = document.getElementById("lightbox");
  let lightboxReturn = null;
  function openLightbox(src, alt) {
    if (!lightbox) return;
    lightboxReturn = document.activeElement;
    lightbox.innerHTML = `<img src="${esc(src)}" alt="${esc(alt || "")}"><button type="button" class="lb-close" aria-label="${esc(u().close)}">${ICON_CLOSE}</button>`;
    lightbox.hidden = false;
    const btn = lightbox.querySelector(".lb-close");
    if (btn) btn.focus({ preventScroll: true });
  }
  function closeLightbox() {
    if (!lightbox || lightbox.hidden) return;
    lightbox.hidden = true;
    lightbox.innerHTML = "";
    if (lightboxReturn && document.contains(lightboxReturn)) lightboxReturn.focus({ preventScroll: true });
    lightboxReturn = null;
  }
  if (lightbox) lightbox.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (lightbox && !lightbox.hidden) closeLightbox();
    else closeClue();
  });

  /* ---------- Hints: one opens every HINT_EVERY questions, or early by hand ---------- */
  const HINT_EVERY = 15;
  // Hints opened early by hand count toward the rank; hints opened automatically do not.
  function manualHints(g) {
    const src = Array.isArray(g.hintSrc) ? g.hintSrc : [];
    let n = 0;
    for (let i = 0; i < g.hints; i++) if (src[i] !== "auto") n++;
    return n;
  }
  function openHint(c, g, src) {
    if (!c || !g || g.status !== "open" || g.hints >= c.hints.length) return;
    if (!Array.isArray(g.hintSrc)) g.hintSrc = [];
    g.hintSrc[g.hints] = src;
    g.hints += 1;
    showClue(g.hints - 1, true);
  }
  function autoHint(c, g) {
    if (g.status === "open" && g.hints < c.hints.length && counted(g) >= HINT_EVERY * (g.hints + 1)) openHint(c, g, "auto");
  }

  /* ---------- Hint pop-up ---------- */
  const clueBox = document.getElementById("clue");
  let clue = null;          // { i: hint index, fresh: true right after it opened }
  let clueReturn = null;
  function showClue(i, fresh) {
    if (!clueBox) return;
    if (!clue) clueReturn = document.activeElement;
    clue = { i, fresh };
    renderClue();
    const btn = clueBox.querySelector("[data-clue='close']");
    if (btn) btn.focus({ preventScroll: true });
  }
  function closeClue(silent) {
    if (!clueBox || !clue) return;
    clue = null;
    clueBox.hidden = true;
    clueBox.innerHTML = "";
    if (!silent && clueReturn && document.contains(clueReturn)) clueReturn.focus({ preventScroll: true });
    clueReturn = null;
  }
  function renderClue() {
    if (!clueBox) return;
    const c = cur();
    if (!clue || !c || state.view !== "case") { clueBox.hidden = true; clueBox.innerHTML = ""; return; }
    const t = u();
    const g = game(c.id);
    const total = g.hints;
    if (total < 1) { closeClue(true); return; }
    const i = Math.max(0, Math.min(clue.i, total - 1));
    const auto = (g.hintSrc || [])[i] === "auto";
    clueBox.innerHTML = `<div class="clue-card" role="dialog" aria-modal="true" aria-labelledby="clue-h">
      <p class="eyebrow">${esc(t.hintBtn(i + 1))}</p>
      <h2 id="clue-h">${esc(clue.fresh ? t.clueNew : t.hintBtn(i + 1))}</h2>
      <p class="clue-text">${esc(L(c.hints[i]))}</p>
      ${CAN_IMAGES ? media(`${c.id}-hint${i + 1}`, `${L(c.title)} · ${t.hintBtn(i + 1)}`, { cls: "clue-media" }) : ""}
      <p class="fineprint">${esc(auto ? t.clueAuto(HINT_EVERY * (i + 1)) : t.clueManual)}</p>
      ${total > 1 ? `<div class="clue-nav">
        <button type="button" class="btn btn-small" data-clue="prev" ${i === 0 ? "disabled" : ""}>‹ ${esc(t.cluePrev)}</button>
        <span>${i + 1} / ${total}</span>
        <button type="button" class="btn btn-small" data-clue="next" ${i >= total - 1 ? "disabled" : ""}>${esc(t.clueNext)} ›</button>
      </div>` : ""}
      <button type="button" class="btn btn-primary clue-close" data-clue="close">${esc(t.close)}</button>
    </div>`;
    clueBox.hidden = false;
  }
  if (clueBox) clueBox.addEventListener("click", e => {
    if (e.target === clueBox) { closeClue(); return; }
    const b = e.target.closest("[data-clue]");
    if (!b || b.disabled || !clue) return;
    const act = b.dataset.clue;
    if (act === "close") { closeClue(); return; }
    clue = { i: clue.i + (act === "next" ? 1 : -1), fresh: false };
    renderClue();
    const same = clueBox.querySelector(`[data-clue='${act}']`);
    const target = same && !same.disabled ? same : clueBox.querySelector("[data-clue='close']");
    if (target) target.focus({ preventScroll: true });
  });

  const KEEP = ["q", "sol", "memo", "relay-url", "relay-pass"];
  function render() {
    const active = document.activeElement ? document.activeElement.id : "";
    const kept = {};
    for (const id of KEEP) { const el = document.getElementById(id); if (el) kept[id] = el.value; }
    document.documentElement.lang = state.lang;
    app.innerHTML = header() + (showSettings ? settingsPanel() : "") + (state.view === "case" && cur() ? caseView() : homeView());
    for (const id of KEEP) { const el = document.getElementById(id); if (el && kept[id] !== undefined) el.value = kept[id]; }
    if (active) {
      const el = document.getElementById(active);
      if (el && !el.disabled) el.focus({ preventScroll: true });
    }
    freshStamp = false;
  }

  function clearInputs() {
    for (const id of ["q", "sol", "memo"]) { const el = document.getElementById(id); if (el) el.value = ""; }
  }
  function clearSettingsInputs() {
    for (const id of ["relay-url", "relay-pass"]) { const el = document.getElementById(id); if (el) el.value = ""; }
  }
  function resetPanels() {
    showSolve = false;
    showNotes = false;
    confirmAct = null;
  }
  function scrollToClosing() {
    const el = document.querySelector(".closing");
    if (!el) return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }

  /* ---------- Actions ---------- */
  function openCase(id) {
    closeClue(true);
    clearInputs();
    state.view = "case";
    state.caseId = id;
    resetPanels();
    ai.noticeKey = "";
    render();
    window.scrollTo(0, 0);
  }
  function goHome() {
    closeClue(true);
    if (busy === "check" && checkCtl) checkCtl.abort();
    clearInputs();
    state.view = "home";
    resetPanels();
    ai.noticeKey = "";
    render();
    window.scrollTo(0, 0);
  }

  function handleError(e) {
    const code = e && e.code;
    if (code === "cancelled") return;
    if (code === "not_granted") { ai.status = "blocked"; ai.noticeKey = "notGranted"; return; }
    if (["sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
      ai.status = "off"; ai.noticeKey = "unavailable"; return;
    }
    if (code === "rate_limited") { ai.noticeKey = "rate"; return; }
    if (code === "session_expired") { ai.noticeKey = "session"; return; }
    if (code === "refused") { ai.noticeKey = "refused"; return; }
    if (code === "bad_passcode") { ai.noticeKey = "badPass"; return; }
    if (code === "relay_rate") { ai.noticeKey = "relayRate"; return; }
    if (code === "relay_down") { ai.noticeKey = "relayDown"; return; }
    if (code === "relay_config") { ai.noticeKey = "relayConfig"; return; }
    ai.noticeKey = "generic";
  }

  function errKey(e) {
    const code = e && e.code;
    return code === "bad_passcode" ? "badPass"
      : code === "relay_rate" ? "relayRate"
      : code === "relay_down" ? "relayDown"
      : code === "relay_config" ? "relayConfig"
      : "generic";
  }

  async function saveRelay() {
    if (testing) return;
    const url = ((document.getElementById("relay-url") || {}).value || "").trim();
    const pass = ((document.getElementById("relay-pass") || {}).value || "").trim();
    if (!url || !pass) { settingsMsg = { key: "settingsMissing", ok: false }; render(); return; }
    if (!/^https:\/\/\S+$/i.test(url)) { settingsMsg = { key: "settingsBadUrl", ok: false }; render(); return; }
    const before = { url: relay.url, pass: relay.pass, source: ai.source, status: ai.status };
    relay.url = url;
    relay.pass = pass;
    ai.source = "relay";
    testing = true;
    settingsMsg = null;
    render();
    try {
      const r = await aiJSON('Reply with only this JSON and nothing else: {"ok":true}', "judge");
      if (!r || r.ok !== true) throw { code: "invalid_json" };
      remember(RELAY_URL_KEY, url);
      remember(RELAY_PASS_KEY, pass);
      ai.status = "ready";
      ai.noticeKey = "";
      state.mode = "ai";
      remember("caseRoomMode", "ai");
      settingsMsg = { key: "settingsOk", ok: true };
    } catch (e) {
      relay.url = before.url;
      relay.pass = before.pass;
      ai.source = before.source;
      ai.status = before.status;
      settingsMsg = { key: errKey(e), ok: false };
    } finally {
      testing = false;
      render();
    }
  }

  function disconnectRelay() {
    forget(RELAY_URL_KEY);
    forget(RELAY_PASS_KEY);
    relay.url = "";
    relay.pass = "";
    ai.source = "";
    ai.status = "off";
    ai.noticeKey = "";
    resetPanels();
    clearSettingsInputs();
    settingsMsg = { key: "disconnected", ok: true };
    render();
  }

  async function ask(text) {
    if (busy || ai.status !== "ready" || effMode() !== "ai") return;
    const c = cur();
    if (!c) return;
    const g = game(c.id);
    if (g.status !== "open") return;
    busy = "ask";
    pendingQ = text;
    ai.noticeKey = "";
    render();
    try {
      const res = await aiJSON(judgePrompt(c, g, text), "judge");
      let v = String((res && res.verdict) || "").trim().toUpperCase().replace(/[\s-]+/g, "_");
      if (c.kind === "bible" && v === "IRRELEVANT") v = "NOT_STATED";
      if (c.kind === "mystery" && v === "NOT_STATED") v = "IRRELEVANT";
      if (!VERDICTS[v]) throw { code: "invalid_json" };
      const note = v === "INVALID" && res && typeof res.note === "string" ? res.note.trim().slice(0, 160) : "";
      g.log.push({ q: text, v, note });
      const qEl = document.getElementById("q");
      if (qEl && qEl.value.trim() === text) qEl.value = "";
      freshStamp = true;
      autoHint(c, g);
    } catch (e) {
      handleError(e);
    } finally {
      busy = null;
      pendingQ = "";
      render();
    }
  }

  async function check(text) {
    if (busy || ai.status !== "ready") return;
    const c = cur();
    if (!c) return;
    const g = game(c.id);
    busy = "check";
    checkCtl = new AbortController();
    ai.noticeKey = "";
    render();
    try {
      const res = await aiJSON(gradePrompt(c, text), "grade", checkCtl.signal);
      const hits = {};
      let all = true;
      for (const k of c.keys) {
        const raw = res && res.hits ? res.hits[k.id] : false;
        const ok = raw === true || raw === "true";
        hits[k.id] = ok;
        if (!ok) all = false;
      }
      g.attempts += 1;
      g.lastCheck = { hits, feedback: res && typeof res.feedback === "string" ? res.feedback.trim().slice(0, 240) : "" };
      if (all) { g.status = "solved"; resetPanels(); freshStamp = true; }
    } catch (e) {
      handleError(e);
    } finally {
      busy = null;
      checkCtl = null;
      render();
      if (cur() && game(cur().id).status === "solved") scrollToClosing();
    }
  }

  app.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    const c = cur();
    const g = c && state.view === "case" ? game(c.id) : null;
    switch (act) {
      case "lang":
        if (b.dataset.lang !== state.lang) { state.lang = b.dataset.lang; remember("caseRoomLang", state.lang); render(); renderClue(); }
        break;
      case "mode":
        if (b.dataset.mode !== state.mode) {
          if (busy === "check" && checkCtl) checkCtl.abort();
          state.mode = b.dataset.mode; remember("caseRoomMode", state.mode);
          resetPanels(); ai.noticeKey = ""; render();
        }
        break;
      case "settings":
        showSettings = !showSettings;
        settingsMsg = null;
        render();
        if (showSettings) {
          const urlEl = document.getElementById("relay-url");
          const passEl = document.getElementById("relay-pass");
          if (urlEl && !urlEl.value) urlEl.value = relay.url;
          if (passEl && !passEl.value) passEl.value = relay.pass;
          window.scrollTo(0, 0);
          if (urlEl) urlEl.focus({ preventScroll: true });
        }
        break;
      case "settings-close": showSettings = false; settingsMsg = null; clearSettingsInputs(); render(); break;
      case "disconnect": disconnectRelay(); break;
      case "zoom": {
        const box = b.closest("[data-media]");
        const im = box && box.querySelector("img[data-ok]");
        if (im) openLightbox(im.getAttribute("src"), im.getAttribute("alt"));
        break;
      }
      case "open": openCase(b.dataset.id); break;
      case "home": goHome(); break;
      case "reload-cases": loadCases(); break;
      case "hint":
        if (g && g.hints < c.hints.length) { openHint(c, g, "manual"); render(); }
        break;
      case "clue":
        if (g && g.hints > 0) showClue(Math.max(0, Number(b.dataset.i) || 0), false);
        break;
      case "stamp":
        if (g && g.status === "open" && VERDICTS[b.dataset.v]) {
          const memo = document.getElementById("memo");
          const text = memo ? memo.value.trim().slice(0, 200) : "";
          g.log.push({ q: text, v: b.dataset.v, note: "" });
          if (memo) memo.value = "";
          freshStamp = true;
          autoHint(c, g);
          render();
        }
        break;
      case "undo":
        if (g && g.log.length) { g.log.pop(); render(); }
        break;
      case "notes": showNotes = !showNotes; confirmAct = null; render(); break;
      case "notes-close": showNotes = false; render(); break;
      case "solve-open":
        showSolve = true; confirmAct = null; render();
        requestAnimationFrame(() => { const s = document.getElementById("sol"); if (s) s.focus(); });
        break;
      case "solve-close": showSolve = false; render(); break;
      case "check-cancel": if (checkCtl) checkCtl.abort(); break;
      case "solved": confirmAct = "solved"; showNotes = false; showSolve = false; render(); break;
      case "reveal": confirmAct = "reveal"; showNotes = false; showSolve = false; render(); break;
      case "confirm-no": confirmAct = null; render(); break;
      case "confirm-yes":
        if (g && confirmAct) {
          g.status = confirmAct === "reveal" ? "revealed" : "solved";
          resetPanels(); freshStamp = true; render(); scrollToClosing();
        }
        break;
      case "again":
        if (c) { closeClue(true); delete state.games[c.id]; resetPanels(); ai.noticeKey = ""; clearInputs(); render(); window.scrollTo(0, 0); }
        break;
    }
  });

  app.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.form === "ask") {
      const v = (document.getElementById("q") || {}).value || "";
      if (v.trim()) ask(v.trim());
    } else if (f.dataset.form === "solve") {
      const v = (document.getElementById("sol") || {}).value || "";
      if (v.trim()) check(v.trim());
    } else if (f.dataset.form === "settings") {
      saveRelay();
    }
  });

  /* ---------- Start ---------- */
  async function initAI() {
    if (!hasClaude) return;
    try {
      const s = await window.claude.use("sample");
      if (s) { ai.sample = s; ai.status = "ready"; } else { ai.status = "off"; }
    } catch (e) {
      ai.status = "off";
    }
    render();
  }

  function restore(data) {
    if (!data || typeof data !== "object") return;
    if (data.lang === "ko" || data.lang === "en") state.lang = data.lang;
    if (data.mode === "ai" || data.mode === "host") state.mode = data.mode;
    if (data.games && typeof data.games === "object") state.games = data.games;
    if (data.view === "case" && CASES.some(c => c.id === data.caseId)) { state.view = "case"; state.caseId = data.caseId; }
    render();
  }

  async function loadCases() {
    casesStatus = "loading";
    render();
    try {
      const res = await fetch("cases.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const list = (Array.isArray(data) ? data : data.cases || []).filter(c => c && c.id && c.title && c.setup && Array.isArray(c.keys));
      if (!list.length) throw new Error("no cases");
      CASES.splice(0, CASES.length, ...list);
      casesStatus = "ready";
    } catch (e) {
      casesStatus = "error";
    }
    render();
  }

  render();
  if (casesStatus !== "ready") loadCases();
  initAI();
  try {
    const hot = window.claude && window.claude.hot;
    if (hot) {
      if (typeof hot.snapshot === "function") hot.snapshot(() => ({ lang: state.lang, mode: state.mode, view: state.view, caseId: state.caseId, games: state.games }));
      if (typeof hot.ready === "function") hot.ready(restore);
      else if (hot.data) restore(hot.data);
    }
  } catch (e) { /* live-update hook unavailable */ }
})();
</script>
</body>
</html>
