<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="예/아니오 질문만으로 사건의 진상을 밝히는 추리 게임 · A yes-or-no deduction game">
<meta name="theme-color" content="#E3E9E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121929" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Case Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
:root {
  /* Layout: an interrogation desk. Cases are index cards laid on the desk. Inside a case, the case card sits left and the questioning, verdict stamp and transcript sit right; phones stack card, question, tools, transcript. */
  --desk: #E3E9E3;
  --card: #FDFDF9;
  --card-line: #D3DFEA;
  --card-rule: #D9534A;
  --ink: #16202F;
  --ink-soft: #4A5567;
  --rule: #C3CFC6;
  --accent: #2442A3;
  --on-accent: #FFFFFF;
  --highlight: #E9C92E;
  --yes: #1C7A4D;
  --no: #C1352D;
  --meh: #5F6675;
  --silent: #6A3EA2;
  --rephrase: #9C620C;
  --shadow: rgba(22, 32, 47, 0.18);
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-type: "Courier Prime", "Courier New", ui-monospace, monospace;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
}
:root[lang="ko"] {
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-type: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #121929;
    --card: #1B2437;
    --card-line: #27334B;
    --card-rule: #E2655C;
    --ink: #E8ECF3;
    --ink-soft: #A7B1C3;
    --rule: #2C3852;
    --accent: #93ABFF;
    --on-accent: #0F1626;
    --highlight: #E9CF3C;
    --yes: #4FC48D;
    --no: #FF7B70;
    --meh: #A3AABA;
    --silent: #BC97F2;
    --rephrase: #E8B551;
    --shadow: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #121929;
  --card: #1B2437;
  --card-line: #27334B;
  --card-rule: #E2655C;
  --ink: #E8ECF3;
  --ink-soft: #A7B1C3;
  --rule: #2C3852;
  --accent: #93ABFF;
  --on-accent: #0F1626;
  --highlight: #E9CF3C;
  --yes: #4FC48D;
  --no: #FF7B70;
  --meh: #A3AABA;
  --silent: #BC97F2;
  --rephrase: #E8B551;
  --shadow: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

html { font-size: clamp(15px, 0.55vw + 10px, 21px); font-synthesis: none; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-ui); font-size: 1rem; line-height: 1.5; }
:root[lang="ko"] body { word-break: keep-all; overflow-wrap: break-word; }
button, input, textarea { font: inherit; color: inherit; }
p, h1, h2, h3, h4 { margin: 0; }

.wrap {
  max-width: 1440px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.1rem 3rem;
}

/* Header */
.top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 0.75rem 1.5rem; padding-bottom: 0.9rem; border-bottom: 2px solid var(--ink);
}
.brand {
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink);
  font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; line-height: 1;
  text-transform: uppercase; letter-spacing: 0.02em;
  text-decoration: underline; text-decoration-color: var(--highlight);
  text-decoration-thickness: 0.16em; text-underline-offset: 0.14em;
}
.brand:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 0.3rem 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--desk); }
.seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.mode-chip { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); }
.mode-chip i { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--ink); }
.mode-chip[data-s="connecting"] i { background: var(--meh); }

/* Shared pieces */
.eyebrow { font-family: var(--font-ui); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
.chip-stamp {
  display: inline-block; font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.04em; font-size: 0.95rem; line-height: 1.2; border: 3px double currentColor;
  border-radius: 3px; padding: 0.1rem 0.5rem;
}
.v-yes { color: var(--yes); }
.v-no { color: var(--no); }
.v-meh { color: var(--meh); }
.v-silent { color: var(--silent); }
.v-rephrase { color: var(--rephrase); }
.pips { display: inline-flex; gap: 3px; }
.pips span { width: 0.55rem; height: 0.55rem; border: 1.5px solid var(--ink); }
.pips span.on { background: var(--ink); }
.btn {
  border: 2px solid var(--ink); background: transparent; color: var(--ink);
  padding: 0.5rem 1rem; border-radius: 4px; font-weight: 600; cursor: pointer; line-height: 1.3;
}
.btn:hover { background: var(--card); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-stop { border-color: var(--no); color: var(--no); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn:focus-visible, .back:focus-visible, .undo:focus-visible, .stamp-btn:focus-visible, .case-card:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.btn-small { padding: 0.3rem 0.75rem; font-size: 0.9rem; }
.settings { display: grid; gap: 0.6rem; max-width: 40rem; margin-top: 1.1rem; padding: 1rem 1.2rem 1.2rem; }
.settings-title { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.03em; }
.settings-form { display: grid; gap: 0.4rem; }
.settings-form label { font-weight: 600; font-size: 0.9rem; margin-top: 0.3rem; }
.settings-form input {
  min-width: 0; padding: 0.6rem 0.7rem; border: 2px solid var(--ink); border-radius: 4px;
  background: var(--desk); font-family: var(--font-type); font-size: 1rem;
}
.settings-form input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.settings-form .actions { margin-top: 0.5rem; }
.ok-msg { border: 2px solid var(--yes); background: var(--card); padding: 0.65rem 0.85rem; border-radius: 4px; font-size: 0.95rem; }
.notice { border: 2px solid var(--rephrase); background: var(--card); padding: 0.65rem 0.85rem; border-radius: 4px; font-size: 0.95rem; }
.fineprint { font-size: 0.82rem; color: var(--ink-soft); }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); align-items: center; gap: 1.5rem; padding-block: 2.2rem 2.4rem; }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr) auto; gap: 3rem; } }
.hero h2 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 4.8vw, 4.4rem);
  line-height: 1.02; text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; max-width: 16ch;
}
:root[lang="ko"] .hero h2 { max-width: 13em; line-height: 1.18; }
.steps { list-style: none; margin: 1.4rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.8rem 2.2rem; counter-reset: step; }
.steps li { counter-increment: step; display: flex; align-items: baseline; gap: 0.6rem; max-width: 24ch; font-family: var(--font-type); font-size: 1.05rem; line-height: 1.45; }
.steps li::before { content: counter(step); font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1; color: var(--accent); }
.hero-stamps { position: relative; width: 17rem; height: 10rem; }
.hero-stamps .stamp { position: absolute; font-size: 3.6rem; }
.hero-stamps .s1 { left: 0; top: 0.4rem; transform: rotate(-9deg); }
.hero-stamps .s2 { right: 0; bottom: 0; transform: rotate(7deg); }
@media (max-width: 899px) { .hero-stamps { display: none; } }

.shelf { border-top: 2px solid var(--ink); padding-block: 1.3rem 2.4rem; }
.shelf-head { display: grid; gap: 0.45rem; margin-bottom: 1.2rem; }
.shelf-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.75rem; }
.shelf h2 { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em; }
.count { font-family: var(--font-type); color: var(--ink-soft); }
.note { color: var(--ink-soft); }
.answer-set { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 1rem; }
.case-card {
  display: flex; flex-direction: column; gap: 0.6rem; text-align: left; cursor: pointer;
  background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 2px;
  padding: 0.85rem 1rem 1rem; box-shadow: 0 1px 0 var(--shadow), 0 12px 26px -20px var(--shadow);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.case-card:hover { transform: translateY(-2px); box-shadow: 0 1px 0 var(--shadow), 0 18px 32px -20px var(--shadow); }
.cc-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding-bottom: 0.45rem; border-bottom: 2px solid var(--card-rule); }
.cc-title { font-family: var(--font-type); font-weight: 700; font-size: 1.2rem; line-height: 1.3; overflow-wrap: anywhere; }
.cc-teaser {
  font-family: var(--font-type); font-size: 0.92rem; line-height: 1.5; color: var(--ink-soft);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.cc-status { margin-top: auto; align-self: flex-start; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); }

/* Case */
.case-head { display: grid; gap: 0.4rem; padding-block: 1.1rem 1.4rem; }
.back { justify-self: start; background: none; border: 0; padding: 0.2rem 0; color: var(--accent); font-weight: 600; cursor: pointer; }
.fileline { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; }
.fileno { font-family: var(--font-type); font-size: 0.9rem; color: var(--ink-soft); letter-spacing: 0.02em; }
.case-title {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 4.2vw, 3.6rem);
  line-height: 1; text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance;
}
.case-grid { display: flex; flex-direction: column; gap: 1.25rem; }
.col-left, .col-right { display: contents; }
.b-statement { order: 1; }
.b-ask { order: 2; }
.b-tools { order: 3; }
.b-log { order: 4; }
@media (min-width: 900px) {
  .case-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 2.5rem; align-items: start; }
  .col-left, .col-right { display: flex; flex-direction: column; gap: 1.25rem; min-width: 0; }
  .col-left {
    position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; overscroll-behavior: contain;
    padding: 2px 10px 26px 2px; margin: -2px -10px -26px -2px;
  }
}
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 2px; box-shadow: 0 1px 0 var(--shadow), 0 16px 34px -24px var(--shadow); }
.statement { display: grid; gap: 1rem; padding: 1rem 1.4rem 1.4rem; }
.card-head { padding-bottom: 0.5rem; border-bottom: 2px solid var(--card-rule); }
.setup {
  --lh: 2.35rem;
  font-family: var(--font-type); font-size: 1.42rem; line-height: var(--lh); max-width: 60ch;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--card-line) calc(var(--lh) - 1px), var(--card-line) var(--lh));
}

.tools { display: grid; gap: 0.9rem; }
.hint-slip { display: grid; gap: 0.2rem; background: var(--card); border: 1.5px dashed var(--ink-soft); padding: 0.6rem 0.85rem; }
.hint-slip p:last-child { font-family: var(--font-type); font-size: 1.1rem; }
.panel { display: grid; gap: 0.6rem; background: var(--card); border: 1px solid var(--rule); padding: 0.9rem 1rem; }
.panel.warn { border: 2px solid var(--no); }
.confirm-q { font-weight: 600; }
.notes-warn { font-weight: 600; color: var(--no); }
.panel h4 { margin-top: 0.3rem; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.03em; }
.solve textarea {
  width: 100%; box-sizing: border-box; min-height: 8rem; padding: 0.7rem 0.8rem; border: 2px solid var(--ink);
  border-radius: 4px; background: var(--desk); font-family: var(--font-type); font-size: 1.1rem; line-height: 1.5; resize: vertical;
}
.waiting { font-family: var(--font-type); color: var(--ink-soft); align-self: center; }
.check-result { display: grid; gap: 0.4rem; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
.checklist li { display: flex; gap: 0.6rem; align-items: baseline; }
.mark { font-family: var(--font-display); font-weight: 800; width: 1.1rem; flex: none; }
.mark.hit { color: var(--yes); }
.mark.miss { color: var(--no); }
.feedback { font-family: var(--font-type); color: var(--ink-soft); }

.ask-panel { display: grid; gap: 0.8rem; }
.ask, .memo-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.6rem; align-items: center; }
.memo-row { grid-template-columns: auto minmax(0, 1fr); }
.qmark { font-family: var(--font-type); font-weight: 700; font-size: 1.6rem; }
.ask input, .memo-row input {
  min-width: 0; padding: 0.7rem 0.8rem; border: 2px solid var(--ink); border-radius: 4px;
  background: var(--card); font-family: var(--font-type); font-size: 1.25rem;
}
.ask input:disabled { opacity: 0.55; }
.ask input:focus-visible, .memo-row input:focus-visible, .solve textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.stamp-pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem; }
.stamp-btn {
  min-height: 4.4rem; padding: 0.6rem 0.4rem 0.5rem; background: transparent; cursor: pointer;
  border: 4px double currentColor; border-radius: 4px;
  font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
  font-size: clamp(1.4rem, 2.4vw, 2.1rem); line-height: 1.05; overflow-wrap: anywhere;
  transition: background-color 0.12s ease, transform 0.08s ease;
}
.stamp-btn.long { font-size: clamp(1.05rem, 1.6vw, 1.4rem); }
.stamp-btn:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
.stamp-btn:active { transform: scale(0.97); }
.pad-foot { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.4rem 1rem; }
.undo { background: none; border: 0; padding: 0.1rem 0; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: 0.9rem; }

.stage {
  min-height: 12rem; display: grid; align-content: center; justify-items: center; gap: 0.9rem;
  text-align: center; padding: 1.25rem 0.5rem; border-block: 2px solid var(--ink);
}
.stage-q { font-family: var(--font-type); font-size: 1.2rem; color: var(--ink-soft); max-width: 44ch; overflow-wrap: anywhere; }
.stage-empty { font-family: var(--font-type); color: var(--ink-soft); }
.stage-note { color: var(--rephrase); font-weight: 600; }
.stamp {
  display: inline-block; max-width: 100%; box-sizing: border-box;
  font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
  font-size: clamp(2.4rem, 5vw, 4.6rem); line-height: 1.02; padding: 0.18em 0.45em 0.12em;
  border: 0.09em double currentColor; border-radius: 0.08em; transform: rotate(-4deg); text-wrap: balance;
}
.stamp.long { font-size: clamp(1.8rem, 3.4vw, 3.2rem); }
.stamp.fresh { animation: thunk 0.32s cubic-bezier(0.2, 0.8, 0.3, 1.25) both; }
@keyframes thunk {
  0% { transform: rotate(-4deg) scale(1.7); opacity: 0; }
  60% { transform: rotate(-4deg) scale(0.95); opacity: 1; }
  100% { transform: rotate(-4deg) scale(1); opacity: 1; }
}
.thinking { font-family: var(--font-type); font-size: 1.5rem; color: var(--ink-soft); }
.thinking::after { content: "▍"; margin-left: 0.15rem; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.log { display: grid; gap: 0.6rem; }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 2rem; }
.stat { display: flex; align-items: center; gap: 0.6rem; }
.stat b { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tally { display: inline-flex; flex-wrap: wrap; gap: 0.3rem; color: var(--ink); }
.tally svg { height: 1.6rem; width: auto; }
.tally line { stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.transcript { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.transcript li {
  display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto; gap: 0.25rem 0.75rem;
  align-items: baseline; padding: 0.6rem 0; border-bottom: 1px solid var(--rule);
}
.tn { font-family: var(--font-type); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.tq { font-family: var(--font-type); font-size: 1.05rem; overflow-wrap: anywhere; }
.tq.muted { color: var(--ink-soft); }
.tv {
  font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
  font-size: 1rem; line-height: 1.25; border: 3px double currentColor; border-radius: 3px; padding: 0 0.45rem; white-space: nowrap;
}
.tnote { grid-column: 2 / -1; font-size: 0.85rem; color: var(--rephrase); }
.empty { color: var(--ink-soft); font-family: var(--font-type); }
@media (max-width: 560px) {
  .transcript li { grid-template-columns: 2.6rem minmax(0, 1fr); }
  .tv { grid-column: 2; justify-self: start; white-space: normal; }
}

.closing { display: grid; gap: 0.9rem; padding-block: 0.5rem 1.5rem; border-bottom: 2px solid var(--ink); }
.closing .stamp { justify-self: start; margin-block: 0.4rem 0.2rem; }
.closing h3 { margin-top: 0.6rem; font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; text-transform: uppercase; letter-spacing: 0.03em; }
.rank { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.1; text-transform: uppercase; }
.truth { font-family: var(--font-type); font-size: 1.15rem; line-height: 1.65; max-width: 68ch; }
.keylist, .silentlist { margin: 0; padding-left: 1.25rem; display: grid; gap: 0.45rem; max-width: 68ch; }
.readit { font-family: var(--font-type); }

@media (prefers-reduced-motion: reduce) {
  .stamp.fresh, .thinking::after { animation: none; }
  .case-card, .stamp-btn { transition: none; }
  .case-card:hover { transform: none; }
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
(() => {
  "use strict";

  /* ---------- Cases ---------- */
  const CASES = [
    {
      id: "blank-homework", kind: "mystery", level: 1, file: "No. 01",
      title: { en: "The Blank Homework", ko: "백지 숙제" },
      setup: {
        en: `Maya turned in her homework: a completely blank sheet of paper. Her teacher took the page to her desk, and a moment later she smiled and gave Maya an A+.`,
        ko: `마야는 아무것도 쓰여 있지 않은 백지 한 장을 숙제로 냈습니다. 선생님은 그 종이를 자기 책상으로 가져가더니, 잠시 뒤 미소를 지으며 마야에게 A+를 주었습니다.`
      },
      truth: {

      facts: `- A church youth winter retreat at a cabin. The snacks were kept in a cooler locked with a 4-digit combination lock.

    {
      id: "elevator-man", kind: "mystery", level: 2, file: "No. 07",
      title: { en: "The Elevator Man", ko: "엘리베이터의 남자" },
      setup: {
        en: `A man lives on the 10th floor of an apartment building. Every morning he takes the elevator down to the lobby. Every evening he rides it only to the 7th floor and walks up the last three floors. But on rainy days, or when someone else is in the elevator, he rides all the way to the 10th floor.`,
        ko: `한 남자가 아파트 10층에 삽니다. 아침마다 그는 엘리베이터를 타고 1층으로 내려갑니다. 그런데 저녁에 돌아올 때는 7층까지만 엘리베이터를 타고, 나머지 세 층은 계단으로 걸어 올라갑니다. 단, 비가 오는 날이나 엘리베이터에 다른 사람이 함께 탔을 때는 10층까지 곧장 올라갑니다.`
      },
      truth: {
        en: `The man is very short. Inside the elevator, the highest button he can reach is 7. Going down is easy, because the lobby button is low. On rainy days he carries an umbrella and presses 10 with its tip, and when someone else is in the elevator, he simply asks them to press 10 for him.`,
        ko: `남자는 키가 아주 작습니다. 엘리베이터 안에서 그의 손이 닿는 가장 높은 버튼이 7층입니다. 1층 버튼은 낮은 곳에 있어서 내려갈 때는 문제가 없습니다. 비 오는 날에는 우산을 들고 있으니 우산 끝으로 10층 버튼을 누르고, 다른 사람이 함께 탔을 때는 10층을 눌러 달라고 부탁합니다.`
      },
      keys: [
        { id: "reach", label: { en: "Why he stops at 7", ko: "7층에서 내리는 이유" },
          text: { en: "He is very short and can't reach the 10 button; 7 is the highest he can reach.", ko: "키가 아주 작아 10층 버튼에 손이 닿지 않고, 7층이 닿는 한계다." } },
        { id: "help", label: { en: "Rainy days and other riders", ko: "비 오는 날과 다른 사람이 있을 때" },
          text: { en: "On rainy days he presses 10 with his umbrella; when others are there, he asks them to press it.", ko: "비 오는 날은 우산으로 10층을 누르고, 다른 사람이 있으면 눌러 달라고 한다." } }
      ],
      hints: [
        { en: "The answer has to do with the buttons, not with exercise.", ko: "답은 운동이 아니라 버튼과 관련이 있습니다." },
        { en: "What does he carry on rainy days, and how could it help him?", ko: "비 오는 날 그가 들고 다니는 물건은 무엇이고, 그것이 어떻게 도움이 될까요?" }
      ],
      facts: `- The man is an adult who is very short, about the height of a young child.
- Inside the elevator, the highest button he can reach is 7. The lobby button is low, so going down is easy.
- He is not exercising, not afraid of anything, and nothing is wrong with the elevator or with floors 8 to 10. He is not visiting anyone on the 7th floor.
- On rainy days he carries an umbrella and presses 10 with its tip. When someone else is in the elevator, he asks them to press 10.
- His name and job are not part of the story (IRRELEVANT).`
    },
    {
      id: "desert-man", kind: "mystery", level: 2, file: "No. 08",
      title: { en: "The Man in the Desert", ko: "사막의 남자" },
      setup: {
        en: `A man lies dead in the middle of the desert, without a stitch of clothing. In his hand is half of a broken match. There are no footprints anywhere around him.`,
        ko: `사막 한가운데에 한 남자가 옷을 하나도 걸치지 않은 채 죽어 있습니다. 그의 손에는 반쯤 부러진 성냥개비가 쥐어져 있습니다. 주변 어디에도 발자국이 없습니다.`
      },
      truth: {
        en: `The man had been flying over the desert in a hot-air balloon with a few friends. The balloon began to sink, and they were going to crash. They threw out everything they could, even their clothes, but the balloon kept sinking. One person still had to go. They drew matches, agreeing that whoever got the short, broken one would jump. He drew it, and he jumped so the others could live. That is why he has no clothes, holds a broken match, and left no footprints.`,
        ko: `남자는 친구 몇 명과 열기구를 타고 사막 위를 날고 있었습니다. 그런데 열기구가 점점 내려앉아 추락할 상황이 되었습니다. 그들은 짐은 물론 옷까지 모두 던져 버렸지만, 열기구는 계속 가라앉았습니다. 결국 한 사람이 내려야 했습니다. 그들은 성냥개비로 제비를 뽑아, 부러진 짧은 성냥을 뽑는 사람이 뛰어내리기로 했습니다. 그가 부러진 성냥을 뽑았고, 다른 사람들을 살리려고 뛰어내렸습니다. 그래서 그는 옷이 없고, 부러진 성냥을 쥐고 있으며, 발자국도 남기지 않은 것입니다.`
      },
      keys: [
        { id: "balloon", label: { en: "How he got there", ko: "그가 그곳에 온 방법" },
          text: { en: "He fell from a hot-air balloon, which is why there are no footprints.", ko: "열기구에서 떨어졌다. 그래서 발자국이 없다." } },
        { id: "weight", label: { en: "Why he had no clothes", ko: "옷이 없는 이유" },
          text: { en: "The balloon was sinking, so they threw everything out to lighten it, even their clothes.", ko: "열기구가 가라앉아 무게를 줄이려고 옷까지 다 던졌다." } },
        { id: "match", label: { en: "What the match means", ko: "성냥의 의미" },
          text: { en: "They drew matches to decide who would jump; he drew the broken one and jumped to save the others.", ko: "누가 뛰어내릴지 성냥으로 제비를 뽑았고, 부러진 성냥을 뽑은 그가 다른 사람들을 살리려고 뛰어내렸다." } }
      ],
      hints: [
        { en: "He didn't walk to the spot where he died.", ko: "그는 걸어서 그 자리에 온 것이 아닙니다." },
        { en: "The broken match was part of a choice made by a group of people.", ko: "부러진 성냥은 여러 사람이 무언가를 정할 때 쓰였습니다." }
      ],
      facts: `- The man was flying over the desert in a hot-air balloon with a few friends. How many friends does not matter.
- The balloon was sinking and would crash. They threw out all their supplies and even took off their clothes and threw them out to make it lighter. It still kept sinking.
- They agreed one person had to jump. They drew lots with matches; one match was broken short. Whoever drew the broken match would jump.
- He drew the broken match and jumped, by his own choice as the group had agreed, so the others could live. He died from the fall.
- He was not pushed, murdered, or robbed. He did not die of thirst or heat, and he was not lost. He was not depressed or wanting to die.
- There are no footprints because he fell from the sky.
- The others landed safely.
- His name, his nationality, and which desert it was are not part of the story (IRRELEVANT).`
    },
    {
      id: "forest-swimmer", kind: "mystery", level: 2, file: "No. 09",
      title: { en: "The Swimmer in the Forest", ko: "숲속의 수영복" },
      setup: {
        en: `After a huge forest fire was put out, rescuers found a man lying dead in the middle of the burned forest. He was wearing only a swimsuit. The nearest lake was miles away.`,
        ko: `거대한 산불이 꺼진 뒤, 구조대는 불탄 숲 한가운데서 죽어 있는 남자를 발견했습니다. 그는 수영복만 입고 있었습니다. 가장 가까운 호수는 몇 킬로미터나 떨어져 있었습니다.`
      },
      truth: {
        en: `The man had been swimming in that faraway lake. To fight the fire, a firefighting plane swooped low over the lake and scooped up a huge load of water, and it scooped him up too, without anyone noticing. Then the plane flew over the burning forest and dropped its water, and the man fell with it into the middle of the fire.`,
        ko: `남자는 몇 킬로미터 떨어진 그 호수에서 수영을 하고 있었습니다. 산불을 끄려고 소방 비행기가 호수 위로 낮게 날며 물을 한가득 퍼 담았는데, 아무도 모르는 사이에 그도 물과 함께 퍼 올려졌습니다. 비행기가 불타는 숲 위로 날아가 물을 쏟아붓자, 남자는 물과 함께 불길 한가운데로 떨어졌습니다.`
      },
      keys: [
        { id: "swim", label: { en: "What he was doing before", ko: "그가 하고 있던 일" },
          text: { en: "He was swimming in a lake far from the forest.", ko: "숲에서 멀리 떨어진 호수에서 수영하고 있었다." } },
        { id: "plane", label: { en: "How he got into the forest", ko: "숲에 오게 된 경위" },
          text: { en: "A firefighting plane scooped him up with the lake water and dropped him on the fire.", ko: "소방 비행기가 호수 물을 퍼 올릴 때 함께 퍼 올려져 불 위에 떨어졌다." } }
      ],
      hints: [
        { en: "He did not walk or run into the forest.", ko: "그는 걸어서도, 뛰어서도 숲에 들어가지 않았습니다." },
        { en: "Think about how such a huge fire is put out, and where all that water comes from.", ko: "그렇게 큰 산불을 어떻게 끄는지, 그 많은 물은 어디서 오는지 생각해 보세요." }
      ],
      facts: `- There was a large forest fire. Firefighting aircraft scooped water from a lake miles away and dropped it on the fire.
- The man was swimming in that lake. A firefighting plane skimmed the lake and scooped him up along with the water. Nobody noticed. (If asked about a helicopter with a water bucket, answer YES; the idea is the same.)
- The plane dropped the water over the fire, and the man fell into the burning forest with it. He died from the fall and the fire.
- He was not murdered, not a firefighter, not a lost hiker, and not running from the fire. Nobody put him there on purpose.
- This is a famous tale told as a puzzle; within the game, treat it as what happened.
- His name and the lake's name are not part of the story (IRRELEVANT).`
    },
    {
      id: "turtle-soup", kind: "mystery", level: 3, file: "No. 10",
      title: { en: "Sea Turtle Soup", ko: "바다거북 스프" },
      setup: {
        en: `A man ordered sea turtle soup at a seaside restaurant. After one spoonful, he asked the chef, "Excuse me, is this really sea turtle soup?" The chef said it was. The man paid, went home, and took his own life that night.`,
        ko: `한 남자가 바닷가 식당에서 바다거북 스프를 주문했습니다. 한 숟가락 맛본 그는 요리사에게 "실례지만, 이게 정말 바다거북 스프입니까?" 하고 물었습니다. 요리사가 그렇다고 하자, 남자는 값을 치르고 집으로 돌아가 그날 밤 스스로 목숨을 끊었습니다.`
      },
      truth: {
        en: `Years earlier, the man's ship had sunk, and he drifted for many days in a lifeboat with a few other survivors, including his close friend. There was nothing to eat, and his friend died. When the man was close to starving, the other survivors gave him a bowl they called "sea turtle soup." He ate it and survived. At the restaurant, he tasted real sea turtle soup for the first time and realized it tasted nothing like the soup in the lifeboat. He understood that what he had eaten back then was made from his dead friend. Unable to live with that, he took his own life.`,
        ko: `몇 년 전, 남자가 탄 배가 침몰했고 그는 몇몇 생존자와 함께 구명보트를 타고 여러 날 바다를 떠돌았습니다. 그중에는 그의 친한 친구도 있었습니다. 먹을 것은 하나도 없었고, 친구는 결국 죽었습니다. 굶어 죽기 직전이던 남자에게 다른 생존자들이 '바다거북 스프'라며 한 그릇을 건넸고, 그는 그것을 먹고 살아남았습니다. 식당에서 진짜 바다거북 스프를 처음 맛본 그는, 그 맛이 구명보트에서 먹은 것과 전혀 다르다는 것을 알았습니다. 그때 먹은 스프가 죽은 친구로 만든 것이었음을 깨달은 그는 그 사실을 견디지 못하고 스스로 목숨을 끊었습니다.`
      },
      keys: [
        { id: "wreck", label: { en: "His past", ko: "그의 과거" },
          text: { en: "He once survived a shipwreck, adrift and starving in a lifeboat.", ko: "예전에 배가 침몰해 구명보트에서 굶주리며 표류한 적이 있다." } },
        { id: "soup", label: { en: "The first soup", ko: "처음 먹은 스프" },
          text: { en: "The 'sea turtle soup' he was given in the lifeboat was really made from his dead friend.", ko: "구명보트에서 '바다거북 스프'라며 받은 것은 사실 죽은 친구로 만든 것이었다." } },
        { id: "taste", label: { en: "Why one spoonful changed everything", ko: "한 숟가락이 모든 것을 바꾼 이유" },
          text: { en: "Real sea turtle soup tasted different, so he realized the truth and couldn't live with it.", ko: "진짜 바다거북 스프는 맛이 달랐고, 그래서 진실을 깨달아 견디지 못했다." } }
      ],
      hints: [
        { en: "This was not the first time in his life someone had told him he was eating sea turtle soup.", ko: "그가 '바다거북 스프'라는 말을 들으며 무언가를 먹은 것은 이번이 처음이 아니었습니다." },
        { en: "Long ago, he and a few others were stranded at sea with nothing to eat.", ko: "오래전 그는 몇 사람과 함께 먹을 것 하나 없이 바다에 고립된 적이 있습니다." }
      ],
      facts: `- Years earlier, the man's ship sank. He and a few other survivors, including his close friend, drifted in a lifeboat for many days with no food.
- His friend died in the lifeboat from hunger and exhaustion. Nobody killed him.
- When the man was close to starving, the other survivors gave him a bowl they called "sea turtle soup." It was really made from his dead friend's body. He did not know. He ate it and survived, and they were rescued later.
- At the seaside restaurant, he tasted real sea turtle soup for the first time. It tasted completely different from the lifeboat soup.
- He realized what he had eaten back then. Unable to bear it, he took his own life that night.
- The restaurant soup really was sea turtle soup. The chef did nothing wrong and is not otherwise involved. There was no poison.
- The man was not allergic, sick, or in debt.
- Names, the restaurant's name, and the year are not part of the story (IRRELEVANT).`
    },
    {
      id: "through-the-roof", kind: "bible", level: 1,
      ref: { en: "Mark 2:1–12", ko: "마가복음 2:1–12" },
      abbr: { en: "Mk 2:1–12", ko: "막 2:1–12" },
      title: { en: "Through the Roof", ko: "지붕을 뚫고" },
      setup: {
        en: `Four men climbed onto a packed house and dug a hole through the roof. Then they lowered a man lying on a mat down into the crowded room. A little later, that same man walked out in front of everyone, carrying the mat himself, and the whole crowd praised God.`,
        ko: `네 사람이 사람들로 꽉 찬 집 지붕에 올라가 구멍을 뚫었습니다. 그리고 자리에 누운 한 사람을 북적이는 방 안으로 달아 내렸습니다. 잠시 후 바로 그 사람이 자기 자리를 직접 들고 모든 사람 앞에서 걸어 나갔고, 모인 사람들이 다 하나님께 영광을 돌렸습니다.`
      },
      truth: {
        en: `Jesus had come back to Capernaum, and so many people crowded into the house where he was that there was no room left, not even at the door. Some people came bringing a paralyzed man, carried by four men. Because of the crowd they couldn't get him to Jesus, so they opened up the roof above him and lowered the man on his mat. When Jesus saw their faith, he said to the man, "Son, your sins are forgiven." Some teachers of the law sitting there thought, "This is blasphemy. Who can forgive sins but God alone?" Jesus knew their thoughts. To show that the Son of Man has authority on earth to forgive sins, he told the man, "Get up, take your mat, and go home." The man got up, picked up his mat at once, and walked out in front of them all. Everyone was amazed and praised God, saying, "We have never seen anything like this!"`,
        ko: `예수님이 가버나움으로 돌아오시자, 예수님이 계신 집에 사람들이 몰려들어 문 앞까지 빈자리가 없었습니다. 사람들이 중풍병자 한 사람을 데려왔는데, 네 사람이 그를 메고 있었습니다. 무리 때문에 예수님께 데려갈 수 없자, 그들은 예수님이 계신 곳 위의 지붕을 뜯어 구멍을 내고 중풍병자가 누운 자리를 달아 내렸습니다. 예수님은 그들의 믿음을 보시고 그 사람에게 "얘야, 네 죄가 용서받았다"고 말씀하셨습니다. 거기 앉아 있던 몇몇 서기관은 속으로 "이것은 신성모독이다. 하나님 한 분 외에 누가 죄를 용서할 수 있는가?" 하고 생각했습니다. 예수님은 그들의 생각을 아시고, 인자가 땅에서 죄를 용서하는 권세가 있음을 보이시려고 그 사람에게 "일어나 네 자리를 들고 집으로 가라"고 하셨습니다. 그는 일어나 곧 자리를 들고 모든 사람 앞에서 나갔습니다. 사람들은 다 놀라 하나님께 영광을 돌리며 "우리가 이런 일을 처음 본다"고 말했습니다.`
      },
      keys: [
        { id: "who", label: { en: "Who the man was and why they came", ko: "그 사람은 누구이고 왜 왔나" },
          text: { en: "He was paralyzed, and four men were bringing him to Jesus, who was inside.", ko: "중풍병자였고, 네 사람이 그를 안에 계신 예수님께 데려가려 했다." } },
        { id: "roof", label: { en: "Why the roof", ko: "왜 지붕이었나" },
          text: { en: "The crowd blocked the door, so they opened the roof to get him to Jesus.", ko: "무리가 문을 막고 있어서 지붕을 뚫어 예수님께 내렸다." } },
        { id: "forgive", label: { en: "What Jesus did", ko: "예수님이 하신 일" },
          text: { en: "Jesus forgave his sins and healed him to show he has authority to forgive sins.", ko: "예수님이 그의 죄를 용서하시고, 죄를 용서하는 권세를 보이시려고 그를 고치셨다." } }
      ],
      hints: [
        { en: "Someone everyone wanted to see was inside that house, and the door was blocked.", ko: "모두가 보고 싶어 하던 분이 그 집 안에 계셨고, 문은 막혀 있었습니다." },
        { en: "The man could not walk. Before healing him, Jesus said something that only God has the right to say.", ko: "그 사람은 걸을 수 없었습니다. 예수님은 그를 고치시기 전에, 하나님만 하실 수 있는 말씀을 먼저 하셨습니다." }
      ],
      silent: [
        { en: "Whether the four men were his friends or family. Mark only says he was carried by four.", ko: "네 사람이 그의 친구였는지 가족이었는지. 마가는 '네 사람이 메었다'고만 말합니다." },
        { en: "Whose house it was. Many readers connect it with Simon Peter's house (Mark 1:29), but Mark 2 doesn't name the owner.", ko: "누구의 집이었는지. 많은 해석자가 시몬 베드로의 집(막 1:29)과 연결하지만, 2장은 집주인을 밝히지 않습니다." },
        { en: "Who fixed the roof afterward.", ko: "누가 나중에 지붕을 고쳤는지." }
      ],
      facts: `- Place: a house in Capernaum where Jesus was staying ("at home") after he returned (Mark 2:1).
- So many gathered that there was no more room, not even at the door; Jesus was preaching the word to them (2:2).
- Some people came bringing to him a paralyzed man, carried by four men (2:3).
- They could not get near Jesus because of the crowd, so they removed the roof above him, dug through, and let down the mat (bed) the paralyzed man lay on (2:4).
- When Jesus saw their faith, he said to the paralyzed man, "Son (child), your sins are forgiven" (2:5).
- Some scribes (teachers of the law) sitting there questioned in their hearts: "Why does this man speak like that? He is blaspheming! Who can forgive sins but God alone?" (2:6-7)
- Jesus knew in his spirit what they were thinking and asked which is easier, to say "Your sins are forgiven" or "Rise, take up your bed and walk" (2:8-9).
- "So that you may know that the Son of Man has authority on earth to forgive sins," he said to the paralyzed man, "Rise, pick up your bed, and go home" (2:10-11).
- The man rose, immediately picked up his bed, and went out before them all. All were amazed and glorified God, saying, "We never saw anything like this!" (2:12)
- Parallel accounts are Matthew 9:1-8 and Luke 5:17-26; details found there also count as stated (Luke 5:19 says they let him down through the roof tiles; Luke 5:17 says Pharisees and teachers of the law were sitting there).
- Jesus did not scold the men about the roof. Nobody was arrested or punished.`,

        ko: `늦은 밤, 많은 사람이 모여 있던 집 대문을 한 남자가 두드렸습니다. 한 여종이 그의 목소리를 알아듣고 너무 기뻐서, 문도 열지 않은 채 안으로 달려 들어갔습니다. 안에 있던 사람들은 그녀에게 "네가 미쳤구나!" 하고 말했습니다. 남자는 계속 문을 두드렸습니다.`
      },
      truth: {
        en: `King Herod had put James, the brother of John, to death with the sword. When he saw that this pleased the people, he arrested Peter too, planning to bring him out to the people after the Passover. Peter was kept in prison under heavy guard, but the church was praying hard to God for him. On the night before Herod was going to bring him out, Peter was sleeping between two soldiers, bound with two chains. An angel of the Lord woke him; the chains fell from his hands, and Peter followed the angel past the guards. The iron gate leading into the city opened by itself. At first Peter thought he was seeing a vision. Then he went to the house of Mary, the mother of John Mark, where many were gathered and praying. When he knocked, a servant girl named Rhoda came to answer. She recognized Peter's voice and, in her joy, ran back without opening the gate. They told her she was out of her mind; when she kept insisting, they said, "It is his angel." Peter kept knocking, and when they opened the gate, they were amazed. He told them how the Lord had brought him out of prison, asked them to tell James and the brothers, and left for another place.`,
        ko: `헤롯 왕은 요한의 형제 야고보를 칼로 죽였고, 그 일을 사람들이 기뻐하는 것을 보고 베드로까지 잡아 가두었습니다. 유월절이 지나면 백성 앞에 끌어낼 생각이었습니다. 베드로는 삼엄한 경비 속에 갇혀 있었지만, 교회는 그를 위해 하나님께 간절히 기도하고 있었습니다. 헤롯이 그를 끌어내려던 바로 전날 밤, 베드로는 두 쇠사슬에 묶인 채 두 군인 사이에서 자고 있었습니다. 주의 천사가 그를 깨우자 쇠사슬이 손에서 벗겨졌고, 베드로는 천사를 따라 경비병들을 지나갔습니다. 성으로 통하는 쇠문이 저절로 열렸습니다. 베드로는 처음에 환상을 보는 줄 알았습니다. 정신을 차린 베드로는 마가라 하는 요한의 어머니 마리아의 집으로 갔고, 그곳에는 많은 사람이 모여 기도하고 있었습니다. 베드로가 대문을 두드리자 로데라는 여종이 나왔습니다. 로데는 베드로의 목소리를 알아듣고 너무 기뻐서 문을 열지도 않고 달려 들어갔습니다. 사람들은 "네가 미쳤다"고 했고, 로데가 거듭 우기자 "그의 천사다"라고 했습니다. 베드로가 계속 문을 두드렸고, 사람들이 문을 열고 그를 보자 깜짝 놀랐습니다. 베드로는 주께서 어떻게 자기를 감옥에서 이끌어 내셨는지 이야기하고, 이 일을 야고보와 형제들에게 전하라고 한 뒤 다른 곳으로 떠났습니다.`

      hints: [

      ],
      facts: `- Herod the king laid violent hands on some who belonged to the church and killed James the brother of John with the sword (Acts 12:1-2).
- Seeing that it pleased the Jews, he arrested Peter also, during the days of Unleavened Bread. He put him in prison, guarded by four squads of four soldiers each, intending to bring him out to the people after the Passover (12:3-4).
- Peter was kept in prison, but earnest prayer for him was made to God by the church (12:5).

- Peter followed, not knowing that what the angel was doing was real; he thought he was seeing a vision (12:9).
- They passed the first and second guard and came to the iron gate leading into the city. It opened for them by itself. They went along one street, and then the angel left him (12:10).
- Peter came to himself and said, "Now I am sure that the Lord has sent his angel and rescued me from the hand of Herod" (12:11).
- He went to the house of Mary, the mother of John whose other name was Mark, where many were gathered together and were praying (12:12).
- He knocked at the door of the gateway, and a servant girl named Rhoda came to answer (12:13). Recognizing Peter's voice, in her joy she did not open the gate but ran in and reported that Peter was standing at the gate (12:14).
- They said, "You are out of your mind." She kept insisting, and they kept saying, "It is his angel!" (12:15)
- Peter continued knocking. When they opened, they saw him and were amazed (12:16).
- He motioned with his hand for them to be silent, described how the Lord had brought him out of the prison, said "Tell these things to James and to the brothers," and departed to another place (12:17).
- Afterward, at daybreak there was great disturbance among the soldiers. Herod searched for Peter, did not find him, examined the sentries, and ordered that they be put to death (12:18-19).`,

    {

      ref: { en: "1 Kings 3:16–28", ko: "열왕기상 3:16–28" },
      abbr: { en: "1 Kgs 3:16–28", ko: "왕상 3:16–28" },
      title: { en: "The King's Strange Order", ko: "왕의 이상한 명령" },
      setup: {
        en: `A king had a sword brought to him and commanded that a living baby be cut in two. Because of that order, the baby lived and went home in the arms of his real mother.`,
        ko: `한 왕이 칼을 가져오게 하더니, 살아 있는 아기를 둘로 나누라고 명령했습니다. 그런데 바로 그 명령 덕분에 아기는 살았고, 진짜 엄마의 품에 안겨 집으로 돌아갔습니다.`
      },
      truth: {
        en: `Two women came to King Solomon. They lived in the same house, and each had given birth to a son, three days apart; no one else was in the house. During the night, one woman's son died because she lay on him. She got up at midnight, took the other woman's living son from her side while she slept, and put her dead son in his place. In the morning, the mother found the dead baby, looked closely, and saw that he was not her son. Before the king, both women claimed the living child. Solomon called for a sword and ordered the living child divided in two, half for each. The real mother, whose heart burned with love for her son, cried out, "Please, my lord, give her the living child. Don't kill him!" But the other said, "He shall be neither mine nor yours. Divide him!" Then Solomon said, "Give the living child to the first woman. Do not kill him. She is his mother." When all Israel heard the verdict, they stood in awe of the king, because they saw that God's wisdom was in him to do justice.`,
        ko: `두 여인이 솔로몬 왕에게 왔습니다. 두 사람은 한집에 살았고, 사흘 간격으로 각각 아들을 낳았으며, 집에는 그 둘밖에 없었습니다. 밤에 한 여인이 자기 아들 위에 누워 아이가 죽었습니다. 그 여인은 한밤중에 일어나, 다른 여인이 잠든 사이 그 곁에서 살아 있는 아들을 데려가고 자기의 죽은 아들을 그 자리에 뉘었습니다. 아침에 엄마는 죽은 아기를 발견했지만, 자세히 보니 자기 아들이 아니었습니다. 왕 앞에서 두 여인은 모두 살아 있는 아이가 자기 아들이라고 주장했습니다. 솔로몬은 칼을 가져오게 하고, 산 아이를 둘로 나누어 반씩 주라고 명령했습니다. 그러자 아들을 향한 사랑으로 애가 탄 진짜 엄마가 외쳤습니다. "내 주여, 산 아이를 저 여자에게 주시고 제발 죽이지 마십시오!" 그러나 다른 여인은 "내 것도 네 것도 되지 않게 나누자"고 했습니다. 왕은 "산 아이를 처음 여인에게 주고 죽이지 말라. 그가 아이의 어머니다"라고 판결했습니다. 온 이스라엘이 이 판결을 듣고 왕을 두려워했으니, 하나님의 지혜가 그에게 있어 정의를 행하는 것을 보았기 때문입니다.`

      keys: [
        { id: "swap", label: { en: "What the case was about", ko: "어떤 사건이었나" },
          text: { en: "Two women both claimed the same living baby; one woman's baby had died and she secretly swapped them.", ko: "두 여인이 같은 아기를 서로 자기 아이라고 주장했다. 한 여인의 아기가 죽자 몰래 바꿔치기했다." } },

      ],
      facts: `- Two women who were prostitutes came to King Solomon and stood before him (1 Kings 3:16).
- They lived in the same house. The first gave birth while the other was in the house; three days later the second also gave birth. They were alone; no one else was in the house (3:17-18).
- The second woman's son died in the night because she lay on him (3:19).
- She got up at midnight, took the first woman's son from beside her while she slept, laid him at her own breast, and laid her dead son at the first woman's breast (3:20).
- In the morning the first woman got up to nurse her child and found him dead; when she looked at him closely, he was not the son she had borne (3:21).
- Before the king, each insisted that the living child was hers and the dead one was the other's (3:22-23).
- The king said, "Bring me a sword," and a sword was brought (3:24). He said, "Divide the living child in two, and give half to the one and half to the other" (3:25).
- The woman whose son was alive, because her heart yearned for her son, said, "Oh, my lord, give her the living child, and by no means put him to death." The other said, "He shall be neither mine nor yours; divide him" (3:26).
- The king answered, "Give the living child to the first woman, and by no means put him to death; she is his mother" (3:27).
- All Israel heard of the judgment and stood in awe of the king, because they saw that the wisdom of God was in him to do justice (3:28).
- Earlier in the chapter (3:5-14), God appeared to Solomon in a dream at Gibeon; Solomon asked for an understanding mind to govern and to discern between good and evil, and God gave him a wise and discerning mind.
- The baby was not harmed; no sword touched him.`,

- The women's names, the babies' names, or their ages.
- What happened afterward to the woman who lied (no punishment is recorded).

      abbr: { en: "Gen 44–45", ko: "창 44–45" },
      title: { en: "The Cup in the Sack", ko: "자루 속의 은잔" },
      setup: {
        en: `Eleven brothers were chased down on the road and accused of stealing a powerful ruler's silver cup. They swore they were innocent. The ruler's servant searched their grain sacks, from the oldest brother's to the youngest's, and found the cup in the very last one. The brothers tore their clothes in despair. Yet in the end, that same scene turned into a tearful, joyful reunion.`,
        ko: `열한 형제가 길에서 추격당해 붙잡혔고, 한 권력자의 은잔을 훔쳤다는 혐의를 받았습니다. 형제들은 결백하다고 맹세했습니다. 권력자의 청지기가 맏형의 자루부터 막내의 자루까지 차례로 뒤지자, 은잔은 맨 마지막 자루에서 나왔습니다. 형제들은 절망하여 옷을 찢었습니다. 그런데 결국 그 자리는 눈물 어린 기쁜 재회의 자리가 되었습니다.`
      },
      truth: {
        en: `The powerful ruler was Joseph, the governor of Egypt and their own brother. Years earlier, these brothers had sold him into slavery, and they didn't recognize him now. Joseph ordered his steward to fill their sacks with grain, return each man's money, and put his own silver cup in the sack of Benjamin, the youngest. So the brothers really were innocent; the cup had been planted. When they were brought back, Judah said they would all become slaves. Joseph said that only the man who had the cup would stay as his slave, and the rest could go home in peace. Then Judah stepped forward. He explained that their father's life was bound up with Benjamin's, and that losing him would kill their father. He begged to stay as a slave in Benjamin's place. Joseph could no longer hold himself back. He sent everyone else out, wept so loudly that the Egyptians heard, and said, "I am Joseph, your brother, whom you sold into Egypt." He told them not to be distressed, because God had sent him ahead of them to save lives.`,
        ko: `그 권력자는 애굽의 총리 요셉, 곧 그들의 형제였습니다. 여러 해 전 이 형들은 요셉을 노예로 팔았고, 지금은 그를 알아보지 못했습니다. 요셉은 청지기에게 형제들의 자루에 곡식을 채우고, 각 사람의 돈을 도로 넣고, 막내 베냐민의 자루에는 자기 은잔까지 넣으라고 명령했습니다. 그러니 형제들은 정말 결백했고, 은잔은 일부러 넣어 둔 것이었습니다. 다시 끌려온 자리에서 유다는 모두가 종이 되겠다고 했습니다. 요셉은 잔이 나온 사람만 종으로 남고 나머지는 평안히 돌아가라고 했습니다. 그때 유다가 나섰습니다. 아버지의 목숨이 베냐민의 목숨과 하나로 묶여 있어서 베냐민을 잃으면 아버지가 죽을 것이라고 말하고, 자기가 베냐민 대신 종으로 남겠다고 간청했습니다. 요셉은 더 이상 자신을 억제하지 못했습니다. 다른 사람들을 모두 내보내고, 애굽 사람들이 들을 만큼 큰 소리로 울며 말했습니다. "나는 당신들이 애굽에 판 동생 요셉입니다." 그리고 하나님이 생명을 구하시려고 자기를 먼저 보내셨으니 근심하지 말라고 했습니다.`
      },
      keys: [

      facts: `- Background: during a famine, Jacob's sons came to Egypt to buy grain. Years earlier they had sold their brother Joseph to traders (Genesis 37), who took him to Egypt, and Joseph rose to be governor over Egypt, second only to Pharaoh. The brothers did not recognize him (42:8). On this second trip they brought the youngest, Benjamin, Joseph's full brother (Genesis 43).

- At dawn the men were sent away with their donkeys. Not far from the city, Joseph told the steward to pursue them and say, "Why have you repaid evil for good? Is it not from this that my lord drinks, and by this that he practices divination?" (44:3-5)

        en: `Israel had done evil in the LORD's sight, and the LORD let Eglon, king of Moab, defeat them; Israel served Eglon for eighteen years. When the Israelites cried out to the LORD, he raised up a deliverer for them: Ehud, a left-handed man from the tribe of Benjamin. Israel sent Ehud to deliver their tribute to Eglon. Ehud had made a short, double-edged sword and strapped it on his right thigh under his clothes. After he presented the tribute, he sent away the men who had carried it, then turned back alone and said, "I have a secret message for you, O king." The king called for silence, and all his attendants left. Ehud came to Eglon as he sat alone in his cool upper room and said, "I have a message from God for you." As the king rose from his seat, Ehud reached with his left hand, took the sword from his right thigh, and thrust it into the king's belly. Eglon was a very fat man; the fat closed over the blade, and Ehud did not pull it out. Ehud went out, shut the doors of the upper room behind him, and locked them. While the servants waited, Ehud escaped. He blew a trumpet in the hill country of Ephraim, led Israel against Moab, and the land had peace for eighty years.`,
        ko: `이스라엘이 여호와 보시기에 악을 행하자, 여호와께서 모압 왕 에글론이 이스라엘을 치게 하셨고 이스라엘은 열여덟 해 동안 에글론을 섬겼습니다. 이스라엘이 여호와께 부르짖자 여호와께서 구원자를 세우셨는데, 그가 베냐민 지파의 왼손잡이 에훗입니다. 이스라엘은 에훗을 통해 에글론에게 조공을 보냈습니다. 에훗은 양쪽에 날이 선 짧은 칼을 만들어 옷 속 오른쪽 허벅지에 찼습니다. 조공을 바친 뒤 에훗은 조공을 메고 온 사람들을 돌려보내고, 혼자 되돌아와 "왕이여, 내가 은밀히 아뢸 말씀이 있습니다" 하고 말했습니다. 왕이 조용히 하라고 하자 시종들이 모두 나갔습니다. 에훗은 시원한 다락방에 혼자 앉아 있는 에글론에게 다가가 "하나님의 말씀을 전하러 왔습니다" 하고 말했습니다. 왕이 자리에서 일어서자, 에훗은 왼손으로 오른쪽 허벅지의 칼을 뽑아 왕의 배를 찔렀습니다. 에글론은 몹시 뚱뚱한 사람이라 기름이 칼날을 덮었고, 에훗은 칼을 빼지 않았습니다. 에훗은 밖으로 나가 다락방 문을 닫고 잠갔습니다. 신하들이 기다리는 동안 에훗은 도망했습니다. 그는 에브라임 산지에서 나팔을 불어 이스라엘을 이끌고 모압을 쳤고, 그 땅은 팔십 년 동안 평온했습니다.`

- Ehud came to him as he was sitting alone in his cool roof chamber (upper room) and said, "I have a message from God for you." The king rose from his seat (3:20).

- Ehud went out into the porch (Hebrew misderon, meaning uncertain), closed the doors of the roof chamber behind him, and locked them (3:23).
- When he had gone, the servants came. Seeing the doors locked, they thought, "Surely he is relieving himself in the closet of the cool chamber." They waited until they were embarrassed. When he still did not open the doors, they took the key and opened them, and their lord lay dead on the floor (3:24-25).
- Ehud escaped while they delayed, passed beyond the idols, and escaped to Seirah (3:26). He sounded the trumpet in the hill country of Ephraim and said, "Follow me, for the LORD has given your enemies the Moabites into your hand." They seized the fords of the Jordan and struck down about ten thousand Moabites (3:27-29). Moab was subdued that day, and the land had rest for eighty years (3:30).

  };

  const VERDICTS = {
    YES: { cls: "v-yes", en: "Yes", ko: "예" },
    NO: { cls: "v-no", en: "No", ko: "아니오" },
    IRRELEVANT: { cls: "v-meh", en: "Doesn't matter", ko: "상관없음", long: true },
    NOT_STATED: { cls: "v-silent", en: "The text doesn't say", ko: "본문은 말하지 않음", long: true },
    INVALID: { cls: "v-rephrase", en: "Rephrase", ko: "다시 질문" }
  };

  /* ---------- State ---------- */
  const hasClaude = !!(window.claude && typeof window.claude.use === "function");
  const RELAY_URL_KEY = "caseRoomRelayUrl";
  const RELAY_PASS_KEY = "caseRoomRelayPass";
  const relay = { url: recall(RELAY_URL_KEY), pass: recall(RELAY_PASS_KEY) };
  const relayReady = !hasClaude && !!(relay.url && relay.pass);
  const state = { lang: initialLang(), mode: initialMode(), view: "home", caseId: null, games: {} };
  // source: "claude" (inside Claude), "relay" (Cloudflare Workers AI through the relay server), "" (host only)
  const ai = {
    status: hasClaude ? "connecting" : relayReady ? "ready" : "off",
    source: hasClaude ? "claude" : relayReady ? "relay" : "",
    sample: null,
    noticeKey: ""
  };
  let busy = null;          // "ask" | "check" | null
  let pendingQ = "";
  let checkCtl = null;
  let freshStamp = false;
  let confirmAct = null;    // "reveal" | "solved" | null
  let showSolve = false;
  let showNotes = false;
  let showSettings = false;
  let testing = false;
  let settingsMsg = null;   // { key, ok }

  function recall(key) {
    try { return localStorage.getItem(key) || ""; } catch (e) { return ""; }
  }
  function forget(key) {
    try { localStorage.removeItem(key); } catch (e) { /* storage unavailable */ }
  }

  function initialLang() {
    try {
      const saved = localStorage.getItem("caseRoomLang");
      if (saved === "ko" || saved === "en") return saved;
    } catch (e) { /* storage unavailable */ }
    return (navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "en";
  }
  function initialMode() {
    try {
      const saved = localStorage.getItem("caseRoomMode");
      if (saved === "ai" || saved === "host") return saved;
    } catch (e) { /* storage unavailable */ }
    return "ai";
  }
  function remember(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
  }

  const u = () => UI[state.lang];
  const L = obj => (obj && (obj[state.lang] ?? obj.en)) || "";
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
  const cur = () => CASES.find(c => c.id === state.caseId);
  const effMode = () => (state.mode === "host" || ai.status === "off" || ai.status === "blocked") ? "host" : "ai";

  function game(id) {
    if (!state.games[id]) state.games[id] = { log: [], hints: 0, attempts: 0, status: "open", lastCheck: null };
    return state.games[id];
  }
  const counted = g => g.log.filter(x => x.v !== "INVALID").length;
  const rankIndex = (q, h) => { const s = q + 5 * h; return s <= 10 ? 0 : s <= 20 ? 1 : s <= 35 ? 2 : 3; };
  const teaser = c => { const s = L(c.setup); const m = s.match(/^.+?[.!?](?=\s|$)/); return m ? m[0] : s; };

  // Cloudflare refills the free AI allowance at 00:00 UTC; show that moment in local time.
  function resetTime() {
    const d = new Date();
    d.setUTCHours(24, 0, 0, 0);
    try {
      return d.toLocaleTimeString(state.lang === "ko" ? "ko-KR" : "en-US", { hour: "numeric", minute: "2-digit" });
    } catch (e) {
      return "00:00 UTC";
    }
  }
  function errText(t, key) {
    return (t.err[key] || t.err.generic).replace("{time}", resetTime());
  }

  function tally(n) {
    if (!n || n > 40) return "";
    let out = "";
    for (let g = 0; g * 5 < n; g++) {
      const cnt = Math.min(5, n - g * 5);
      let lines = "";
      for (let i = 0; i < Math.min(cnt, 4); i++) {
        const x = 5 + i * 7;
        lines += `<line x1="${x}" y1="3" x2="${x}" y2="25"/>`;
      }
      if (cnt === 5) lines += `<line x1="1" y1="21" x2="31" y2="7"/>`;
      out += `<svg viewBox="0 0 32 28" aria-hidden="true">${lines}</svg>`;
    }
    return out;
  }

  /* ---------- AI prompts (used only inside Claude) ---------- */
  function judgePrompt(c, g, question) {
    const bible = c.kind === "bible";
    const langName = state.lang === "ko" ? "Korean" : "English";
    const history = g.log.filter(x => x.v !== "INVALID" && x.q).slice(-8)
      .map(x => `Q: ${x.q}\nA: ${x.v}`).join("\n") || "(none yet)";
    const parts = [
      "You are the judge in a yes/no deduction game. A group (often a church youth group) sees only the SETUP and tries to uncover the hidden story by asking yes/no questions. You answer each new question with exactly one verdict.",
      "",
      `CASE TYPE: ${bible ? "Bible case based on " + c.ref.en : "fictional mystery"}`,
      `SETUP shown to players:\n${c.setup.en}`,
      "",
      `SECRET FACTS (authoritative${bible ? "; they summarize the passage" : "; treat them as the complete truth"}):\n${c.facts}`
    ];
    if (bible) {
      parts.push("",
        `Judge strictly by what the Bible text says (${c.ref.en}; parallel passages count). Do not add church tradition, movie or storybook details, or guesses about feelings and motives the text does not state.`,
        `THE TEXT DOES NOT STATE (answer NOT_STATED if asked):\n${c.notStated}`);
    }
    parts.push("",
      "VERDICTS:",
      `YES = the question is true according to the ${bible ? "text" : "facts"}.`,
      `NO = the question is false according to the ${bible ? "text" : "facts"}.`,
      bible
        ? "NOT_STATED = the text does not say, even if tradition or common sense suggests an answer."
        : "IRRELEVANT = the facts do not settle it, and it does not matter for solving the case.",
      `INVALID = it cannot be answered with yes or no, it asks two separate things at once, it asks you to explain or reveal the answer, or it is not a real question. Only for INVALID, write a short reason in ${langName} (at most 12 words) in "note".`,
      "",
      "RULES:",
      "- Judge only the NEW question. Use earlier questions only to understand words like \"he\" or \"that\".",
      "- Accept loose wording, synonyms, typos, and either Korean or English.",
      "- If a single claim is partly false, answer NO.",
      "- Never add hints or explanations. \"note\" must be \"\" unless the verdict is INVALID.",
      "",
      `EARLIER QUESTIONS:\n${history}`,
      "",
      `NEW QUESTION: ${question}`,
      "",
      `Reply with only JSON, for example {"verdict":"YES","note":""}. Allowed verdicts: YES, NO, ${bible ? "NOT_STATED" : "IRRELEVANT"}, INVALID.`
    );
    return parts.join("\n");
  }

  function gradePrompt(c, text) {
    const langName = state.lang === "ko" ? "Korean" : "English";
    const keys = c.keys.map(k => `- ${k.id}: ${k.text.en}`).join("\n");
    return [
      "You check a player's proposed solution in a yes/no deduction game.",
      "",
      `SETUP: ${c.setup.en}`,
      `TRUTH: ${c.truth.en}`,
      `FACTS:\n${c.facts}`,
      "",
      "KEY POINTS the solution must capture. Wording may differ, and Korean or English is fine, but the core idea must be right. A vague guess that only hints at it does not count. Wrong extra details elsewhere do not cancel a key point that is right.",
      keys,
      "",
      `PLAYER'S SOLUTION:\n"""${text}"""`,
      "",
      "For each key point id, give true if the solution captures it and false if it is missing or wrong.",
      `Also write "feedback": one short encouraging sentence in ${langName} that does NOT reveal any missing or secret information.`,
      `Reply with only JSON, for example {"hits":{"${c.keys[0].id}":true},"feedback":"..."}`
    ].join("\n");
  }

  /* ---------- Asking the AI: Claude inside Claude, Cloudflare Workers AI through the relay elsewhere ---------- */
  function parseJSONLoose(text) {
    try { return JSON.parse(text); } catch (e) { /* try the braces */ }
    const a = text.indexOf("{");
    const b = text.lastIndexOf("}");
    if (a >= 0 && b > a) {
      try { return JSON.parse(text.slice(a, b + 1)); } catch (e) { /* not JSON */ }
    }
    return null;
  }

  async function aiJSON(prompt, task, signal) {
    if (ai.source === "claude") {
      return ai.sample.json(prompt, task === "grade" ? { modelTier: "default", signal } : { modelTier: "quick" });
    }
    if (ai.source !== "relay" || !relay.url) throw { code: "not_declared" };
    let res;
    try {
      res = await fetch(relay.url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Passcode": relay.pass },
        body: JSON.stringify({ prompt, task }),
        signal
      });
    } catch (e) {
      if (e && e.name === "AbortError") throw { code: "cancelled" };
      throw { code: "relay_down" };
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    if (!res.ok) {
      const err = data && data.error;
      if (res.status === 401 || err === "bad_passcode") throw { code: "bad_passcode" };
      if (res.status === 429 || err === "rate_limited") throw { code: "relay_rate" };
      if (err === "not_configured") throw { code: "relay_config" };
      throw { code: "upstream_error" };
    }
    const parsed = parseJSONLoose(data && typeof data.text === "string" ? data.text : "");
    if (parsed === null || typeof parsed !== "object") throw { code: "invalid_json" };
    return parsed;
  }

  /* ---------- Rendering ---------- */
  const app = document.getElementById("app");

  function chip(v) {
    const V = VERDICTS[v];
    return `<span class="chip-stamp ${V.cls}">${esc(V[state.lang])}</span>`;
  }
  function pips(c) {
    return `<span class="pips" role="img" aria-label="${esc(u().level[c.level - 1])}">${[1, 2, 3].map(n => `<span class="${n <= c.level ? "on" : ""}"></span>`).join("")}</span>`;
  }
  function truthBlock(c, t, Tag) {
    const bible = c.kind === "bible";
    return `<${Tag}>${esc(t.truthTitle)}</${Tag}>
      <p class="truth">${esc(L(c.truth))}</p>
      <${Tag}>${esc(t.keysTitle)}</${Tag}>
      <ul class="keylist">${c.keys.map(k => `<li><strong>${esc(L(k.label))}.</strong> ${esc(L(k.text))}</li>`).join("")}</ul>
      ${bible ? `<${Tag}>${esc(t.silentTitle)}</${Tag}>
      <ul class="silentlist">${c.silent.map(s => `<li>${esc(L(s))}</li>`).join("")}</ul>` : ""}`;
  }

  function header() {

    if (ai.status === "ready") {
      mode = `<div class="seg" role="group" aria-label="${esc(t.modeLabel)}">
        <button type="button" data-act="mode" data-mode="ai" aria-pressed="${state.mode === "ai"}">${esc(t.modeAi)}</button>

      mode = `<span class="mode-chip" data-s="${connecting ? "connecting" : "host"}"><i></i>${esc(connecting ? t.aiConnecting : t.modeHost)}</span>`;
    }
    const connect = hasClaude ? "" :
      `<button type="button" class="btn btn-small" data-act="settings" aria-expanded="${showSettings}">${esc(t.connectBtn)}</button>`;

          <button type="button" data-act="lang" data-lang="en" aria-pressed="${state.lang === "en"}">English</button>

  function homeView() {

    return `<main>
