<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="예/아니오 질문만으로 사건의 진상을 밝히는 추리 게임 · A yes-or-no deduction game">
<meta name="theme-color" content="#0a0e15">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Case Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root {
  /* Layout: a dark case room. Home is a grid of picture case files; a case shows its picture and statement on the left and the questioning desk on the right; phones stack picture, questions, tools, transcript. One dark look by design. */
  color-scheme: dark;
  --bg: #0a0e15;
  --panel: #10151f;
  --panel-2: #161d2a;
  --field: #0c1119;
  --line: #1f2836;
  --line-strong: #2e3a4e;
  --ink: #e8ecf3;
  --ink-2: #aab3c3;
  --ink-3: #7a869b;
  --accent: #d9b25f;
  --accent-ink: #171207;
  --yes: #5fd09a;
  --no: #ff8a7d;
  --meh: #a8b0bf;
  --silent: #b99cf4;
  --rephrase: #7cc0ea;
  --shadow: rgba(0, 0, 0, 0.6);
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-display: "Noto Serif KR", "AppleMyungjo", "Batang", Georgia, serif;
}

html { font-size: clamp(15px, 0.5vw + 10.5px, 20px); font-synthesis: none; -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(1100px 520px at 85% -8%, rgba(217, 178, 95, 0.07), transparent 62%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.55;
}
:root[lang="ko"] body { word-break: keep-all; overflow-wrap: break-word; }
button, input, textarea { font: inherit; color: inherit; }
p, h1, h2, h3, h4 { margin: 0; }
h1, h2, h3, h4 { font-weight: 700; }

.wrap {
  max-width: 1320px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 3rem;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Header */
.top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 0.75rem 1.25rem; padding-block: 1rem; border-bottom: 1px solid var(--line);
}
.brand {
  display: inline-flex; align-items: center; gap: 0.6rem; background: none; border: 0; padding: 0;
  color: var(--ink); cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; line-height: 1.2;
}
.brand svg { width: 1.55rem; height: 1.55rem; color: var(--accent); flex: none; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--field); border: 1px solid var(--line-strong); border-radius: 9px; }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); padding: 0.3rem 0.7rem; border-radius: 6px;
  font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.mode-chip { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
.mode-chip i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--ink-3); }
.mode-chip[data-s="connecting"] i { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }

/* Shared pieces */
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
:root[lang="ko"] .eyebrow { letter-spacing: 0.08em; }
.fineprint { font-size: 0.82rem; color: var(--ink-3); }
.vchip {
  display: inline-flex; align-items: center; padding: 0.1rem 0.55rem; border-radius: 6px;
  font-size: 0.8rem; font-weight: 700; line-height: 1.5; white-space: nowrap; color: var(--c);
  background: color-mix(in srgb, var(--c) 12%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
}
.v-yes { --c: var(--yes); }
.v-no { --c: var(--no); }
.v-meh { --c: var(--meh); }
.v-silent { --c: var(--silent); }
.v-rephrase { --c: var(--rephrase); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--line-strong); }
.dots i.on { background: var(--accent); }
.keys-chip {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em; color: var(--ink-2);
  border: 1px solid var(--line-strong); border-radius: 5px; padding: 0.06rem 0.45rem; white-space: nowrap;
}
.answer-set { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.55rem; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink);
  padding: 0.55rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; line-height: 1.3; cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s, filter 0.15s;
}
.btn:hover { border-color: var(--ink-3); }
a.btn { text-decoration: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.08); }
.btn-danger { background: transparent; border-color: color-mix(in srgb, var(--no) 55%, transparent); color: var(--no); }
.btn-small { padding: 0.35rem 0.75rem; font-size: 0.85rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.notice {
  border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--ink); padding: 0.65rem 0.85rem; border-radius: 8px; font-size: 0.95rem;
}
.ok-msg {
  border: 1px solid color-mix(in srgb, var(--yes) 50%, transparent); background: color-mix(in srgb, var(--yes) 8%, transparent);
  color: var(--ink); padding: 0.65rem 0.85rem; border-radius: 8px; font-size: 0.95rem;
}
.panel { display: grid; gap: 0.7rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; }
.panel.warn { border-color: color-mix(in srgb, var(--no) 50%, transparent); }
.panel h4 { font-family: var(--font-display); font-size: 1.05rem; margin-top: 0.3rem; }

/* Pictures */
.media { display: block; position: relative; overflow: hidden; background: var(--field); aspect-ratio: 16 / 9; max-width: 100%; }
.media .ph {
  position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 0.4rem; color: var(--ink-3);
  background-image:
    radial-gradient(120% 90% at 50% 0%, rgba(217, 178, 95, 0.06), transparent 60%),
    repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 14px);
}
.media .ph b { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1; color: rgba(232, 236, 243, 0.12); }
.media .ph svg { width: 1.6rem; height: 1.6rem; opacity: 0.55; }
.media img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
  transition: opacity 0.35s ease, transform 0.5s ease, filter 0.35s ease;
}
.media img[data-ok] { opacity: 1; }
.media .tag {
  position: absolute; left: 0.6rem; top: 0.6rem; z-index: 1; font-family: var(--font-mono); font-size: 0.68rem;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); background: rgba(8, 11, 17, 0.74);
  border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.18rem 0.5rem; border-radius: 5px;
}
.media .tag.status { left: auto; right: 0.6rem; color: var(--accent); letter-spacing: 0.04em; text-transform: none; font-family: var(--font-ui); font-weight: 600; }
.media.zoomable.has-img { cursor: zoom-in; }
.zoom {
  position: absolute; right: 0.6rem; bottom: 0.6rem; z-index: 1; display: none; align-items: center; gap: 0.35rem;
  background: rgba(8, 11, 17, 0.78); color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 7px; padding: 0.3rem 0.6rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;
}
.zoom svg { width: 0.9rem; height: 0.9rem; }
.media.has-img .zoom { display: inline-flex; }

/* Home */
.intro { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2rem; align-items: center; padding-block: 2.6rem 2.2rem; }
.intro h2 {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 3.8vw, 3.2rem);
  line-height: 1.22; letter-spacing: -0.01em; text-wrap: balance; max-width: 16ch; margin-top: 0.6rem;
}
:root[lang="ko"] .intro h2 { max-width: 12em; }
.rules { list-style: none; margin: 1.5rem 0 0; padding: 0; display: grid; gap: 0.55rem; max-width: 34rem; }
.rules li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); align-items: baseline; color: var(--ink-2); font-size: 1.02rem; }
.rules li b { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; color: var(--accent); }
.hero-media { border-radius: 14px; border: 1px solid var(--line); aspect-ratio: 16 / 10; }
.hero-media:not(.has-img) { display: none; }
@media (min-width: 900px) {
  .intro:has(.hero-media.has-img) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 3rem; }
}
.shelf { padding-block: 1.8rem 1rem; border-top: 1px solid var(--line); }
.shelf-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.7rem 1.5rem; margin-bottom: 1.2rem; }
.shelf-title { display: flex; align-items: baseline; gap: 0.6rem; }
.shelf h2 { font-family: var(--font-display); font-size: 1.65rem; line-height: 1.15; }
.count { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-3); }
.note { color: var(--ink-2); font-size: 0.92rem; margin-top: 0.3rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 1.1rem; }
.case-card {
  display: flex; flex-direction: column; text-align: left; padding: 0; cursor: pointer; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
}
.case-card:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: 0 18px 36px -24px var(--shadow); }
.case-card .media { aspect-ratio: 16 / 10; border-bottom: 1px solid var(--line); }
.case-card .media img { filter: grayscale(0.85) brightness(0.8); }
.case-card:hover .media img, .case-card:focus-visible .media img { filter: none; transform: scale(1.03); }
.cc-body { display: grid; gap: 0.4rem; padding: 0.85rem 1rem 1rem; }
.cc-title { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.3; }
.cc-teaser {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-size: 0.88rem; line-height: 1.5; color: var(--ink-2);
}
.cc-meta { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.15rem; }
/* College versions: the youth / college switch and the content note */
.audience { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem 0.7rem; margin-top: 0.6rem; }
.warn-chip {
  display: inline-flex; align-items: center; gap: 0.35rem; justify-self: start; max-width: 100%;
  font-size: 0.76rem; font-weight: 600; line-height: 1.4; color: var(--no);
  border: 1px solid color-mix(in srgb, var(--no) 40%, transparent); background: color-mix(in srgb, var(--no) 9%, transparent);
  border-radius: 6px; padding: 0.1rem 0.5rem;
}
.warn-chip svg { width: 0.85rem; height: 0.85rem; flex: none; }

/* Settings */
.settings { margin-top: 1rem; max-width: 40rem; }
.settings-title { font-family: var(--font-display); font-size: 1.3rem; }
.settings-form { display: grid; gap: 0.45rem; }
.settings-form label { font-weight: 600; font-size: 0.9rem; margin-top: 0.3rem; }
.settings-form input {
  min-width: 0; padding: 0.6rem 0.75rem; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--field); font-family: var(--font-mono); font-size: 0.95rem;
}
.settings-form .actions { margin-top: 0.5rem; }

/* Case */
.case-head { display: grid; gap: 0.45rem; padding-block: 1.2rem 1.3rem; }
.back { justify-self: start; background: none; border: 0; padding: 0.2rem 0; color: var(--ink-2); font-weight: 600; font-size: 0.92rem; cursor: pointer; }
.back:hover { color: var(--ink); }
.fileline { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; }
.fileno { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.case-title { font-family: var(--font-display); font-size: clamp(1.9rem, 3.2vw, 2.7rem); line-height: 1.15; text-wrap: balance; }
.case-grid { display: flex; flex-direction: column; gap: 1.1rem; }
.col-left, .col-right { display: contents; }
.b-scene { order: 1; }
.b-ask { order: 2; }
.b-tools { order: 3; }
.b-log { order: 4; }
@media (min-width: 960px) {
  .case-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 1.6rem; align-items: start; }
  .col-left, .col-right { display: flex; flex-direction: column; gap: 1.1rem; min-width: 0; }
}
.scene { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.scene > .media { border-bottom: 1px solid var(--line); }
.scene-body { display: grid; gap: 0.9rem; padding: 1.1rem 1.3rem 1.3rem; }
.setup { font-size: 1.3rem; line-height: 1.72; font-weight: 500; max-width: 62ch; }
.scene-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 1rem; }

.tools { display: grid; gap: 0.9rem; }
.hint-card {
  display: grid; gap: 0.5rem; width: 100%; text-align: left; cursor: pointer; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.85rem 1rem 1rem; transition: border-color 0.15s;
}
.hint-card:hover { border-color: var(--line-strong); }
.hint-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.3rem 1rem; }
.hint-tag { font-size: 0.78rem; color: var(--ink-3); }
.hint-card .eyebrow { color: var(--accent); }
.htext { display: block; font-size: 1.08rem; line-height: 1.6; }
.hint-media { border-radius: 9px; border: 1px solid var(--line); margin-top: 0.2rem; width: 100%; max-width: 28rem; }
.hint-media:not(.has-img) { display: none; }
.confirm-q { font-weight: 600; }
.notes-warn { font-weight: 600; color: var(--no); }
.solve textarea {
  width: 100%; box-sizing: border-box; min-height: 8rem; padding: 0.7rem 0.8rem; border: 1px solid var(--line-strong);
  border-radius: 8px; background: var(--field); font-size: 1.05rem; line-height: 1.55; resize: vertical;
}
.waiting { color: var(--ink-2); align-self: center; }
.check-result { display: grid; gap: 0.4rem; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
.checklist li { display: flex; gap: 0.6rem; align-items: baseline; }
.mark { font-weight: 700; width: 1.1rem; flex: none; }
.mark.hit { color: var(--yes); }
.mark.miss { color: var(--no); }
.feedback { color: var(--ink-2); }

.desk { display: grid; gap: 0.9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.2rem 1.2rem; }
.desk-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
.count-big { display: flex; align-items: baseline; gap: 0.5rem; }
.count-big b { font-size: 2.5rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.count-big span { color: var(--ink-3); font-size: 0.9rem; }
.count-small { display: flex; flex-direction: column; align-items: flex-end; gap: 0.15rem; text-align: right; color: var(--ink-2); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.next-hint { color: var(--accent); font-size: 0.82rem; }
.count-small b { color: var(--ink); }
.ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.55rem; }
.ask input, .memo {
  min-width: 0; width: 100%; box-sizing: border-box; padding: 0.75rem 0.9rem; border: 1px solid var(--line-strong);
  border-radius: 10px; background: var(--field); font-size: 1.1rem;
}
.ask input:disabled { opacity: 0.55; }
.ask .btn { padding-inline: 1.2rem; }
.vpad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6rem; }
.vbtn {
  min-height: 4.4rem; padding: 0.6rem 0.4rem; border-radius: 10px; cursor: pointer; color: var(--c);
  border: 1.5px solid color-mix(in srgb, var(--c) 50%, transparent); background: color-mix(in srgb, var(--c) 9%, transparent);
  font-weight: 700; font-size: clamp(1.15rem, 1.9vw, 1.6rem); line-height: 1.15; overflow-wrap: anywhere;
  transition: background-color 0.12s, transform 0.08s;
}
.vbtn.long { font-size: clamp(0.95rem, 1.3vw, 1.15rem); }
.vbtn:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
.vbtn:active { transform: scale(0.98); }
.pad-foot { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.4rem 1rem; }
.undo { background: none; border: 0; padding: 0.1rem 0; color: var(--ink-2); text-decoration: underline; cursor: pointer; font-size: 0.88rem; }
.stage {
  min-height: 10.5rem; display: grid; align-content: center; justify-items: center; gap: 0.8rem; text-align: center;
  padding: 1.2rem 0.6rem; border-radius: 12px; background: var(--field); border: 1px solid var(--line);
}
.stage-q { color: var(--ink-2); font-size: 1.05rem; max-width: 40ch; overflow-wrap: anywhere; }
.stage-empty { color: var(--ink-3); }
.stage-note { color: var(--rephrase); font-weight: 600; }
.verdict {
  display: inline-block; max-width: 100%; box-sizing: border-box; color: var(--c);
  font-weight: 700; font-size: clamp(2.1rem, 4.2vw, 3.6rem); line-height: 1.08; text-wrap: balance;
  padding: 0.16em 0.6em 0.2em; border-radius: 14px;
  border: 2px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent);
}
.verdict.long { font-size: clamp(1.6rem, 3vw, 2.5rem); }
.verdict.fresh { animation: pop 0.28s cubic-bezier(0.2, 0.8, 0.3, 1.2) both; }
@keyframes pop { from { transform: scale(0.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.thinking { color: var(--ink-2); font-size: 1.2rem; }
.thinking::after { content: "▍"; margin-left: 0.15rem; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.log { display: grid; gap: 0.5rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.2rem 0.5rem; }
.log-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
.transcript { list-style: none; margin: 0; padding: 0; }
.transcript li {
  display: grid; grid-template-columns: 2.8rem minmax(0, 1fr) auto; gap: 0.25rem 0.75rem;
  align-items: baseline; padding: 0.62rem 0; border-top: 1px solid var(--line);
}
.tn { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tq { font-size: 1rem; overflow-wrap: anywhere; }
.tq.muted { color: var(--ink-3); }
.tnote { grid-column: 2 / -1; font-size: 0.85rem; color: var(--rephrase); }
.empty { color: var(--ink-3); padding: 0.2rem 0 0.8rem; }
@media (max-width: 560px) {
  .transcript li { grid-template-columns: 2.4rem minmax(0, 1fr); }
  .transcript .vchip { grid-column: 2; justify-self: start; }
}

.truth { font-size: 1.08rem; line-height: 1.75; }
.keylist, .silentlist { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.45rem; color: var(--ink-2); }
.keylist strong { color: var(--ink); }
.readit { color: var(--ink-2); }

/* Closing screen: one centered column */
.closing-page { max-width: 54rem; margin: 0 auto; display: grid; gap: 1.4rem; padding-block: 1.2rem 1rem; }
.closing-page > .back { justify-self: start; }
.cp-head { display: grid; justify-items: center; gap: 0.55rem; text-align: center; padding-block: 0.8rem 0.2rem; }
.cp-head.fresh { animation: pop 0.4s cubic-bezier(0.2, 0.8, 0.3, 1.2) both; }
.cp-kicker { font-family: var(--font-mono); font-size: 0.82rem; font-weight: 500; letter-spacing: 0.34em; padding-left: 0.34em; color: var(--accent); }
.cp-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.7rem, 7vw, 4.6rem); line-height: 1.05; letter-spacing: -0.01em; }
.cp-sub { color: var(--ink-2); max-width: 36rem; }
.cp-score {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 1rem 1.4rem;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 16px; padding: 1.1rem 1.4rem;
}
.cp-rank { display: grid; gap: 0.25rem; padding-right: 1.4rem; border-right: 1px solid var(--line); }
.cp-rank strong { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.2; color: var(--accent); white-space: nowrap; }
.cp-rank strong.muted { color: var(--ink-3); }
.cp-case { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.6rem; min-width: 0; }
.cp-case strong { flex-basis: 100%; font-family: var(--font-display); font-size: 1.2rem; line-height: 1.3; }
.cp-hints { flex-basis: 100%; color: var(--ink-3); font-size: 0.86rem; }
.cp-count { display: grid; justify-items: center; gap: 0.3rem; line-height: 1; }
.cp-count b { font-size: clamp(2.6rem, 6vw, 3.6rem); font-weight: 700; font-variant-numeric: tabular-nums; }
.cp-count span { color: var(--ink-3); font-size: 0.86rem; }
@media (max-width: 600px) {
  .cp-score:not(.cp-teams) { grid-template-columns: minmax(0, 1fr) auto; }
  .cp-rank { border-right: 0; padding-right: 0; }
  .cp-score:not(.cp-teams) .cp-case { grid-column: 1 / -1; grid-row: 2; padding-top: 0.85rem; border-top: 1px solid var(--line); }
}
.cp-truth { display: grid; gap: 1.1rem; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.3rem 1.4rem 1.5rem; }
.cp-truth > .eyebrow { justify-self: center; color: var(--accent); }
.cp-media { border-radius: 12px; border: 1px solid var(--line); }
.cp-media:not(.has-img) { display: none; }
.cp-setup { display: grid; gap: 0.35rem; background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 0.9rem 1.1rem; }
.cp-setup p:last-child { color: var(--ink-2); line-height: 1.65; }
.cp-story { display: grid; gap: 0.9rem; font-size: 1.12rem; line-height: 1.8; }
.cp-bible { display: grid; gap: 0.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.kchips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.45rem; }
.kchip {
  display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.32rem 0.7rem; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--field); color: var(--ink-2); font-size: 0.9rem; font-weight: 600;
}
.kchip.hit { color: var(--yes); border-color: color-mix(in srgb, var(--yes) 50%, transparent); }
.kchip i { font-style: normal; }
.cp-archive { display: grid; gap: 0.8rem; }
.arch-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.8rem; }
.arch-head h3 { flex: 1 1 auto; }
.arch-head h3 b { color: var(--ink); margin-left: 0.25rem; }
.arch-toggle {
  background: none; border: 1px solid var(--line-strong); border-radius: 999px; padding: 0.3rem 0.85rem;
  color: var(--ink-2); font-size: 0.85rem; font-weight: 600; cursor: pointer;
}
.arch-toggle:hover { color: var(--ink); border-color: var(--ink-3); }
.arch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap: 0.9rem; }
.arch-card {
  display: grid; gap: 0.55rem; align-content: start; box-sizing: border-box; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.85rem 1rem 1rem;
}
.arch-card .eyebrow { color: var(--accent); }
.arch-card.unlocked { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.arch-media { border-radius: 9px; border: 1px solid var(--line); }
.arch-media:not(.has-img) { display: none; }
.cp-log { display: grid; gap: 0.6rem; }
.cp-log > .arch-toggle { justify-self: start; }
.cp-log .transcript { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 1rem; }
.cp-log .transcript li:first-child { border-top: 0; }
.cp-actions { display: grid; justify-items: center; gap: 0.7rem; padding-top: 0.6rem; }
.btn-big { width: min(100%, 28rem); padding: 1rem 1.4rem; font-size: 1.15rem; border-radius: 12px; }

/* Host screen */
.host-banner {
  margin-top: 0.75rem; padding: 0.5rem 0.9rem; border-radius: 8px; text-align: center; font-weight: 700; font-size: 0.9rem;
  color: var(--no); background: color-mix(in srgb, var(--no) 10%, transparent); border: 1px solid color-mix(in srgb, var(--no) 45%, transparent);
}
.mode-chip[data-s="linked"] i { background: var(--yes); }
.mode-chip[data-s="alone"] i { background: var(--no); }
.host-intro { margin-top: 1.6rem; max-width: 46rem; }
.host-intro h2 { font-family: var(--font-display); font-size: 1.5rem; }
.host-intro p { color: var(--ink-2); }
.host-scene .setup { font-size: 1.1rem; }
.host-notes { display: grid; gap: 0.9rem; }
.hn-guide, .hn-block { display: grid; gap: 0.55rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.9rem 1.1rem 1rem; }
.hn-guide > .arch-toggle { justify-self: start; }
.hn-guide ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.4rem; color: var(--ink-2); font-size: 0.95rem; }
.hn-block h3 { color: var(--accent); }
.hn-block h3 + .silentlist, .hn-block .hfacts + h3 { margin-top: 0.3rem; }
.hkeys, .hhints { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.55rem; }
.hkey { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 0.7rem; align-items: start; }
.hkey > span { display: grid; gap: 0.1rem; color: var(--ink-2); }
.hkey strong { color: var(--ink); }
.hkey-box {
  width: 2.2rem; height: 2.2rem; padding: 0; display: grid; place-items: center; border-radius: 8px; cursor: pointer;
  border: 1.5px solid var(--line-strong); background: var(--field); color: var(--yes); font-weight: 700; font-size: 1.1rem;
}
.hkey.found .hkey-box { border-color: var(--yes); background: color-mix(in srgb, var(--yes) 14%, transparent); }
.hkey.found strong { color: var(--yes); }
.hfacts { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.3rem; color: var(--ink-2); font-size: 0.95rem; }
.hhint { display: grid; gap: 0.35rem; padding: 0.7rem 0.85rem; border-radius: 10px; border: 1px dashed var(--line-strong); }
.hhint.shown { border-style: solid; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.hhint .btn { justify-self: start; }
@media (min-width: 960px) {
  .host-grid .col-right { position: sticky; top: 0.8rem; max-height: calc(100vh - 1.6rem); overflow-y: auto; }
}
.unlock-chip {
  font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent); border-radius: 6px; padding: 0.15rem 0.5rem;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
}
.hint-tag.unlocked { color: var(--accent); }

/* Hint pop-up */
.clue-modal {
  position: fixed; inset: 0; z-index: 40; display: flex; overflow-y: auto; background: rgba(3, 5, 9, 0.8);
  padding: max(1rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px)) max(1rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
}
.clue-card {
  margin: auto; width: min(100%, 50rem); box-sizing: border-box; display: grid; gap: 0.9rem; justify-items: center; text-align: center;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 16px; padding: 1.4rem 1.5rem 1.5rem;
  box-shadow: 0 40px 90px -30px #000; animation: rise 0.25s ease both;
}
.clue-card .eyebrow { color: var(--accent); }
.clue-card h2 { font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); line-height: 1.25; text-wrap: balance; }
.clue-text {
  width: 100%; box-sizing: border-box; text-align: left; font-size: 1.28rem; line-height: 1.65;
  background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.2rem;
}
.clue-media { width: 100%; border-radius: 12px; border: 1px solid var(--line); }
.clue-media:not(.has-img) { display: none; }
.clue-nav { display: flex; align-items: center; gap: 0.6rem; }
.clue-nav span { font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-3); }
.clue-close { min-width: 8rem; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Picture viewer */
.lightbox {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; cursor: zoom-out;
  padding: max(1rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px)) max(1rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
  background: rgba(3, 5, 9, 0.92);
}
.lightbox img { max-width: min(96vw, 1600px); max-height: 88vh; border-radius: 10px; box-shadow: 0 30px 80px -20px #000; }
.lb-close {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 0.8rem); right: calc(env(safe-area-inset-right, 0px) + 0.8rem);
  width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: 50%; cursor: pointer;
  background: rgba(16, 21, 31, 0.9); color: var(--ink); border: 1px solid var(--line-strong);
}
.lb-close svg { width: 1.1rem; height: 1.1rem; }

/* Hint sound button */
.icon-btn {
  display: inline-grid; place-items: center; width: 2.2rem; height: 2.2rem; padding: 0; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink-3);
}
.icon-btn svg { width: 1.15rem; height: 1.15rem; }
.icon-btn[aria-pressed="true"] { color: var(--accent); }
.icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }

/* Play mode dock on the home screen */
.play-dock {
  position: sticky; bottom: 0; z-index: 20; display: grid; gap: 0.6rem; margin-top: 1.2rem;
  padding-block: 0.8rem max(0.8rem, env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.play-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; padding: 0.7rem 0.9rem;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 18px 40px -24px #000;
}
.tchips { display: flex; flex-wrap: wrap; gap: 0.4rem; flex: 1 1 auto; }
.tchip {
  display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.65rem; border-radius: 999px; font-size: 0.88rem; font-weight: 600;
  border: 1px solid color-mix(in srgb, var(--tc) 50%, transparent); background: color-mix(in srgb, var(--tc) 10%, transparent);
}
.tchip b { color: var(--ink-2); font-weight: 600; }
.tchip i, .ts-name i, .team-stats i, .team-table th i, .team-btn i {
  display: inline-block; flex: none; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--tc);
}
.team-setup { max-width: 40rem; }
.ts-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
.ts-names { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: 0.5rem; }
.ts-name { display: flex; align-items: center; gap: 0.5rem; padding: 0 0.6rem; background: var(--field); border: 1px solid var(--line-strong); border-radius: 8px; }
.ts-name input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0.55rem 0; font-size: 1rem; }
.ts-name input:focus { outline: none; }
.ts-name:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Desk: total with penalty, hint meter, emergency hint */
.count-big { flex-wrap: wrap; }
.count-big em { flex-basis: 100%; font-style: normal; font-size: 0.82rem; color: var(--no); }
.hint-meter { display: grid; gap: 0.45rem; }
.hm-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.4rem 0.8rem; }
.hm-bar { height: 0.5rem; border-radius: 999px; background: var(--field); border: 1px solid var(--line); overflow: hidden; }
.hm-bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width 0.3s ease; }
.btn-emergency { color: var(--no); border-color: color-mix(in srgb, var(--no) 55%, transparent); background: color-mix(in srgb, var(--no) 8%, transparent); }
.btn-emergency:hover { border-color: var(--no); }
.hint-confirm { padding: 0.8rem 0.9rem; }

/* Team battle on the case screen */
.team-strip { display: grid; gap: 0.6rem; padding: 0.75rem 0.85rem; border-radius: 12px; background: var(--field); border: 1px solid var(--line); }
.turn-now { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.7rem; }
.turn-now span { font-size: 0.85rem; color: var(--ink-3); }
.turn-now b { flex: 1 1 auto; font-size: 1.35rem; font-weight: 700; color: var(--tc); }
.team-stats { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.team-stats li {
  display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.6rem; border-radius: 8px;
  border: 1px solid var(--line-strong); font-size: 0.9rem; color: var(--ink-2);
}
.team-stats li b { color: var(--ink); font-variant-numeric: tabular-nums; }
.team-stats li.on { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 12%, transparent); color: var(--ink); }
.stage-team { font-size: 0.85rem; font-weight: 700; color: var(--tc); }
.tteam {
  display: inline-block; margin-right: 0.45rem; padding: 0 0.4rem; border-radius: 5px; vertical-align: 0.08em;
  font-size: 0.78rem; font-weight: 700; color: var(--tc); border: 1px solid color-mix(in srgb, var(--tc) 50%, transparent);
}
.team-btn.on { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); }

/* Team battle on the closing screen */
.cp-teams { grid-template-columns: minmax(0, 1fr); }
.cp-title[style] { color: var(--tc); }
.team-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.team-table th, .team-table td { padding: 0.55rem 0.6rem; border-top: 1px solid var(--line); text-align: right; }
.team-table thead th { border-top: 0; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em; color: var(--ink-3); }
.team-table thead th:first-child, .team-table th[scope="row"] { text-align: left; }
.team-table th[scope="row"] { font-weight: 700; white-space: nowrap; }
.team-table th[scope="row"] i { margin-right: 0.45rem; vertical-align: 0.1em; }
.team-table tr.win th, .team-table tr.win td { background: color-mix(in srgb, var(--tc) 10%, transparent); }
.team-table td b { font-size: 1.1rem; }
.win-tag { margin-left: 0.3rem; padding: 0.05rem 0.4rem; border-radius: 5px; font-size: 0.72rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); vertical-align: 0.1em; }
.cp-series { color: var(--ink-2); font-size: 0.92rem; }
.cp-series .eyebrow { margin-right: 0.4rem; }

/* Rooms: joining and creating */
.room-setup { display: grid; gap: 1rem 1.6rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); }
.room-setup > .notice { grid-column: 1 / -1; }
.rs-col { display: grid; gap: 0.55rem; align-content: start; }
.rs-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.rs-row input {
  flex: 1 1 8rem; min-width: 0; padding: 0.6rem 0.75rem; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--field); font-size: 1.05rem;
}
#join-code { flex: 0 1 7.5rem; text-transform: uppercase; font-family: var(--font-mono); letter-spacing: 0.2em; }

/* Rooms: code, QR code and players */
.room-bar {
  display: grid; gap: 1rem 1.6rem; grid-template-columns: minmax(0, 1fr); margin-block: 1rem 1.2rem;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; padding: 1rem 1.2rem;
}
@media (min-width: 760px) { .room-bar { grid-template-columns: auto minmax(0, 1fr); align-items: start; } }
.rb-main { display: grid; grid-template-columns: auto auto; justify-content: start; gap: 0.5rem 1.2rem; align-items: center; }
.rb-code b { display: block; font-family: var(--font-mono); font-size: 2.6rem; font-weight: 500; letter-spacing: 0.16em; line-height: 1.05; color: var(--accent); }
.room-bar.big .rb-code b { font-size: clamp(3rem, 8vw, 5rem); }
.rb-qr { width: 6.5rem; height: 6.5rem; padding: 0.3rem; background: #fff; border-radius: 8px; box-sizing: border-box; }
.room-bar.big .rb-qr { width: 10rem; height: 10rem; }
.rb-qr svg { display: block; width: 100%; height: 100%; }
.rb-how { grid-column: 1 / -1; max-width: 30rem; color: var(--ink-2); font-size: 0.9rem; }
/* On the case screen the room bar stays slim so the case and the answer keep the space. */
.room-bar:not(.big) { padding: 0.6rem 1rem; gap: 0.6rem 1.4rem; align-items: center; }
.room-bar:not(.big) .rb-how { display: none; }
.room-bar:not(.big) .rb-code b { font-size: 1.7rem; }
.room-bar:not(.big) .rb-qr { width: 4.2rem; height: 4.2rem; padding: 0.2rem; }
.room-bar:not(.big) .rb-side { gap: 0.4rem; }
.rb-side { display: grid; gap: 0.6rem; align-content: start; }
.rb-players { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.rb-players li {
  display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.65rem; border-radius: 999px;
  border: 1px solid var(--line-strong); font-size: 0.92rem;
}
.rb-players li i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--yes); flex: none; }
.rb-players li.off { opacity: 0.45; }
.rb-players li.off i { background: var(--ink-3); }
.rb-players li.turn { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 700; }
.rb-players li.me { box-shadow: inset 0 0 0 1px var(--ink-3); }
.rb-players li b { font-size: 0.72rem; color: var(--accent); }
.rb-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.8rem; }
.rb-confirm { font-weight: 600; color: var(--no); }
.room-pick { margin-bottom: 0.4rem; }
.pending {
  display: grid; gap: 0.4rem; padding: 0.7rem 0.85rem; border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent);
}
.pending.hidden { border-style: dashed; background: none; color: var(--ink-2); }
.pending-q { font-size: 1.15rem; font-weight: 600; overflow-wrap: anywhere; }
.room-last { font-size: 0.92rem; color: var(--no); }
.cp-wait { text-align: center; color: var(--ink-2); padding-block: 0.6rem; }

/* A player's phone */
.pv { display: grid; gap: 1rem; max-width: 40rem; margin: 0 auto; padding-block: 1rem 2rem; }
.pv-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
.pv-room { display: flex; align-items: baseline; gap: 0.5rem; }
.pv-code { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 500; letter-spacing: 0.15em; color: var(--accent); }
.pv-me { flex: 1 1 auto; color: var(--ink-2); }
.pv-wait { text-align: center; color: var(--ink-2); padding-block: 2rem; }
.pv-title { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.25; }
.pv .setup { font-size: 1.1rem; }
.pv-turn { display: grid; gap: 0.6rem; padding: 1rem 1.1rem; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.pv-turn b { font-size: 1.4rem; }
.pv-turn.mine { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pv-turn.wait { border-style: dashed; color: var(--ink-2); }
.pv-turn-title { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--accent); }
.pv-mine { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.pv-ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; }
.pv-ask input, .pv-solve textarea {
  min-width: 0; width: 100%; box-sizing: border-box; padding: 0.75rem 0.9rem; border: 1px solid var(--line-strong);
  border-radius: 10px; background: var(--field); font-size: 1.05rem;
}
.pv-solve { display: grid; gap: 0.5rem; }
.pv-solve textarea { min-height: 7rem; resize: vertical; line-height: 1.55; }
.pv-players { display: grid; gap: 0.5rem; }

@media (prefers-reduced-motion: reduce) {

      `NEW QUESTION: ${question}`,
      "",
      `Reply with only JSON, for example {"verdict":"YES","note":""}. Allowed verdicts: YES, NO, ${bible ? "NOT_STATED" : "IRRELEVANT"}, INVALID.`
    );
    return parts.join("\n");
  }

  function gradePrompt(c, text) {
    const langName = state.lang === "ko" ? "Korean" : "English";
    const keys = c.keys.map(k => `- ${k.id}: ${k.text.en}`).join("\n");
    return [
      "You check a player's proposed solution in a yes/no deduction game.",
      "",
      `SETUP: ${c.setup.en}`,
      `TRUTH: ${c.truth.en}`,
      `FACTS:\n${c.facts}`,
      "",
      "KEY POINTS the solution must capture. Wording may differ, and Korean or English is fine, but the core idea must be right. A vague guess that only hints at it does not count. Wrong extra details elsewhere do not cancel a key point that is right.",
      keys,
      "",
      `PLAYER'S SOLUTION:\n"""${text}"""`,
      "",
      "For each key point id, give true if the solution captures it and false if it is missing or wrong.",
      `Also write "feedback": one short encouraging sentence in ${langName} that does NOT reveal any missing or secret information.`,
      `Reply with only JSON, for example {"hits":{"${c.keys[0].id}":true},"feedback":"..."}`
    ].join("\n");
  }

  /* ---------- Asking the AI: Claude inside Claude, Cloudflare Workers AI through the relay elsewhere ---------- */
  function parseJSONLoose(text) {
    try { return JSON.parse(text); } catch (e) { /* try the braces */ }
    const a = text.indexOf("{");
    const b = text.lastIndexOf("}");
    if (a >= 0 && b > a) {
      try { return JSON.parse(text.slice(a, b + 1)); } catch (e) { /* not JSON */ }
    }
    return null;
  }

  async function aiJSON(prompt, task, signal) {
    if (ai.source === "claude") {
      return ai.sample.json(prompt, task === "grade" ? { modelTier: "default", signal } : { modelTier: "quick" });
    }
    if (ai.source !== "relay" || !relay.url) throw { code: "not_declared" };
    let res;
    try {
      res = await fetch(relay.url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Passcode": relay.pass },
        body: JSON.stringify({ prompt, task }),
        signal
      });
    } catch (e) {
      if (e && e.name === "AbortError") throw { code: "cancelled" };
      throw { code: "relay_down" };
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    if (!res.ok) {
      const err = data && data.error;
      if (res.status === 401 || err === "bad_passcode") throw { code: "bad_passcode" };
      if (res.status === 429 || err === "rate_limited") throw { code: "relay_rate" };
      if (err === "not_configured") throw { code: "relay_config" };
      throw { code: "upstream_error" };
    }
    const parsed = parseJSONLoose(data && typeof data.text === "string" ? data.text : "");
    if (parsed === null || typeof parsed !== "object") throw { code: "invalid_json" };
    return parsed;
  }

  /* ---------- Pictures ---------- */
  // Pictures live in an images/ folder next to index.html:
  //   images/<case id>-cover.jpg, images/<case id>-hint1.jpg, images/<case id>-hint2.jpg, images/hero.jpg (.png works too)

  const CAN_IMAGES = !hasClaude;
  const IMG_EXT = ["jpg", "png"];

  const hasPic = name => CAN_IMAGES && typeof imgState[name] === "string";
  // A college version uses its youth picture unless it has its own. In "adult.pictures", a slot name
  // such as "hint1" reuses that youth picture, and {scene, check} is a new picture saved as <id>-adult-<slot>.
  function picOf(c, slot) {
    if (!c.baseId) return `${c.id}-${slot}`;
    const p = c.pictures && c.pictures[slot];
    if (p && typeof p === "object") return `${c.baseId}-adult-${slot}`;
    return `${c.baseId}-${typeof p === "string" ? p : slot}`;
  }

  const ICON_LENS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>';
  const ICON_MARK = '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="1.5" y="1.5" width="25" height="25" rx="7"/><circle cx="12.5" cy="12.5" r="5"/><path d="M16.3 16.3 20.5 20.5"/></svg>';
  const ICON_ZOOM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>';
  const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
  const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>';
  const ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.8 2.8 19.6h18.4z"/><path d="M12 9.6v4.6M12 16.9v.01"/></svg>';
  const ICON_CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  function pic(name, alt, lazy) {
    if (!CAN_IMAGES || imgState[name] === null) return "";
    const known = imgState[name];
    const src = known || `images/${name}.${IMG_EXT[0]}`;
    return `<img src="${esc(src)}" alt="${esc(alt)}" decoding="async"${lazy ? ' loading="lazy"' : ""} data-pic="${esc(name)}" data-ext="0"${known ? " data-ok" : ""}>`;
  }

  // o.el: "span" inside buttons. o.big: faint text shown while there is no picture.
  function media(name, alt, o = {}) {
    const el = o.el || "div";
    const cls = ["media", o.cls || "", o.zoom ? "zoomable" : "", hasPic(name) ? "has-img" : ""].filter(Boolean).join(" ");
    return `<${el} class="${cls}" data-media${o.zoom ? ' data-act="zoom"' : ""}>
      <span class="ph" aria-hidden="true">${o.big ? `<b>${esc(o.big)}</b>` : ICON_LENS}</span>
      ${pic(name, alt, o.lazy)}
      ${o.tag ? `<span class="tag">${esc(o.tag)}</span>` : ""}
      ${o.status ? `<span class="tag status">${esc(o.status)}</span>` : ""}
      ${o.zoom ? `<button type="button" class="zoom" data-act="zoom">${ICON_ZOOM}<span>${esc(u().zoom)}</span></button>` : ""}
    </${el}>`;
  }

  // When a picture loads, remember its address; when it is missing, try the next file type, then fall back to the placeholder.
  document.addEventListener("load", e => {
    const im = e.target;
    if (!(im instanceof HTMLImageElement) || !im.dataset.pic) return;
    imgState[im.dataset.pic] = im.getAttribute("src");
    im.setAttribute("data-ok", "");
    const box = im.closest("[data-media]");
    if (box) box.classList.add("has-img");
  }, true);
  document.addEventListener("error", e => {
    const im = e.target;
    if (!(im instanceof HTMLImageElement) || !im.dataset.pic) return;
    const next = Number(im.dataset.ext || 0) + 1;
    if (next < IMG_EXT.length) {
      im.dataset.ext = String(next);
      im.src = `images/${im.dataset.pic}.${IMG_EXT[next]}`;
      return;
    }
    imgState[im.dataset.pic] = null;
    const box = im.closest("[data-media]");
    im.remove();
    if (box) box.classList.remove("has-img");
  }, true);

  // Cases are numbered by their place on each shelf. A Bible case shows its passage only after it is closed.

      ${err ? `<p class="notice" role="status">${esc(err)}</p>` : ""}`;
    const roster = r && r.players.length ? `<section class="pv-players">
        <p class="eyebrow">${esc(t.roomPlayers(r.players.filter(p => p.on).length))}</p>
        <ul class="rb-players">${r.players.map((p, i) => {
          const turn = i === r.turn && p.on;
          return `<li class="${p.on ? "on" : "off"}${turn ? " turn" : ""}${p.pid === me.pid ? " me" : ""}"><i></i>${esc(p.name)}${turn ? `<b>${esc(t.roomTurnTag)}</b>` : ""}</li>`;
        }).join("")}</ul>
      </section>` : "";
    if (!c || !r) {
      return `<main class="pv">${head}<section class="panel pv-wait"><p>${esc(t.roomWaitCase)}</p></section>${roster}</main>`;
    }
    const g = game(c.id);
    if (g.status !== "open") return `<main class="pv">${head}${closingView(c, g, t)}${roster}</main>`;

    const tp = turnPlayer();
    const mine = !!(tp && tp.on && tp.pid === me.pid);
    const p = r.pending;
    const bounced = r.bounce && r.bounce.pid === me.pid && r.bounce.n === g.log.length;
    const aiFail = r.notice && r.notice.pid === me.pid && r.notice.code === "ai_fail";
    const ready = net.status === "open" && net.ownerOn;
    let turn;
    if (p) {
      turn = `<div class="pv-turn wait" aria-live="polite">
          <p>${esc(p.pid === me.pid ? t.roomWaitJudge : p.kind === "solve" ? t.roomOtherSolve(p.name) : t.roomOtherAsked(p.name))}</p>
          ${p.pid === me.pid ? `<p class="pv-mine">${p.kind === "ask" ? `“${esc(p.text)}”` : esc(p.text)}</p>` : ""}
        </div>`;
    } else if (mine) {
      const box = pSolveOpen
        ? `<form class="pv-solve" data-form="p-solve" autocomplete="off">
            <textarea id="p-sol" maxlength="1500" placeholder="${esc(t.roomSolvePh)}" aria-label="${esc(t.roomSolveOpen)}"></textarea>
            <div class="actions"><button type="submit" class="btn btn-primary" ${ready ? "" : "disabled"}>${esc(t.roomSolveSend)}</button>
              <button type="button" class="btn" data-act="p-solve-close">${esc(t.cancel)}</button></div>
          </form>`
        : `<form class="pv-ask" data-form="p-ask" autocomplete="off">
            <input id="p-q" type="text" maxlength="200" placeholder="${esc(t.roomAskPh)}" aria-label="${esc(t.roomAskPh)}">
            <button type="submit" class="btn btn-primary" ${ready ? "" : "disabled"}>${esc(t.roomAskBtn)}</button>
          </form>`;
      const more = confirmAct === "p-hint"
        ? `<div class="panel warn hint-confirm" role="group"><p class="confirm-q">${esc(t.roomHintConfirm)}</p>
            <div class="actions"><button type="button" class="btn btn-primary" data-act="p-hint-yes">${esc(t.emergencyYes)}</button>
            <button type="button" class="btn" data-act="confirm-no">${esc(t.keepGoing)}</button></div></div>`
        : `<div class="actions">
            ${pSolveOpen ? "" : `<button type="button" class="btn btn-small" data-act="p-solve-open">${esc(t.roomSolveOpen)}</button>`}
            ${g.hints < c.hints.length ? `<button type="button" class="btn btn-small btn-emergency" data-act="p-hint" ${ready ? "" : "disabled"}>${esc(t.emergencyBtn)}</button>` : ""}
            <button type="button" class="btn btn-small" data-act="p-pass" ${ready ? "" : "disabled"}>${esc(t.roomPass)}</button>
          </div>`;
      turn = `<div class="pv-turn mine">
          <p class="pv-turn-title">${esc(t.roomYourTurn)}</p>
          ${bounced ? `<p class="notice" role="status">${esc(t.roomBounced)}</p>` : ""}
          ${aiFail ? `<p class="notice" role="status">${esc(t.roomAiFail)}</p>` : ""}
          ${box}
          ${more}
        </div>`;
    } else {
      turn = `<div class="pv-turn"><span class="eyebrow">${esc(t.roomTurnNow)}</span><b>${esc(tp && tp.on ? tp.name : t.roomNoTurn)}</b></div>`;
    }
    const lastNo = r.last && !r.last.ok && r.last.n === g.log.length
      ? `<p class="room-last">${esc(t.roomLastNo(r.last.name, r.last.found || 0, r.last.total || 0))}</p>` : "";
    const hints = c.hints.slice(0, g.hints).map((h, i) => `<button type="button" class="hint-card" data-act="clue" data-i="${i}">
        <span class="hint-top"><span class="eyebrow">${esc(t.hintBtn(i + 1))}</span><span class="hint-tag">${esc((g.hintSrc || [])[i] === "auto" ? t.hintAutoTag(HINT_EVERY * (i + 1)) : t.hintManualTag)}</span></span>
        <span class="htext">${esc(L(h))}</span>
      </button>`).join("");
    const pen = penaltyOf(g), q = counted(g);
    return `<main class="pv">
      ${head}
      <article class="scene">
        ${media(picOf(c, "cover"), L(c.title), { zoom: true, big: bigFor(c) })}
        <div class="scene-body">
          <div class="fileline"><span class="fileno">${esc(tagFor(c))}</span>${dots(c)}${warnChip(c)}</div>
          <h2 class="pv-title">${esc(L(c.title))}</h2>
          <p class="setup">${esc(L(c.setup))}</p>
        </div>
      </article>
      ${turn}
      ${lastNo}
      <section class="desk">
        <div class="desk-head">
          <div class="count-big"><b>${q + pen}</b><span>${esc(t.totalLabel)}</span>${pen ? `<em>${esc(t.totalBreak(q, pen))}</em>` : ""}</div>
          <div class="count-small"><span>${esc(t.hints)} <b>${g.hints}</b> / ${c.hints.length}</span></div>
        </div>
        ${hintMeter(c, g, t, "")}
        ${stageHtml(g, t)}
      </section>
      ${hints ? `<section class="tools">${hints}</section>` : ""}
      <section class="log" aria-labelledby="log-h"><div class="log-head"><h3 id="log-h" class="eyebrow">${esc(t.transcript)}</h3></div>${transcriptList(g, t)}</section>
      ${roster}
    </main>`;
  }

  // Room code, QR code and players, on the main screen, the host's screen and the big screen.
  function roomBar(t, big) {
    const r = state.room;
    if (!r) return "";
    const owner = net.role === "owner";
    const here = r.players.filter(p => p.on).length;
    const players = r.players.length
      ? `<ul class="rb-players">${r.players.map((p, i) => {
          const turn = i === r.turn && p.on;
          return `<li class="${p.on ? "on" : "off"}${turn ? " turn" : ""}"><i></i>${esc(p.name)}${turn ? `<b>${esc(t.roomTurnTag)}</b>` : ""}</li>`;
        }).join("")}</ul>`
      : `<p class="fineprint">${esc(t.roomNoPlayers)}</p>`;
    const conn = net.role ? `<span class="mode-chip" data-s="${net.status === "open" ? "linked" : "connecting"}"><i></i>${esc(net.status === "open" ? t.roomConnOpen : t.roomConnWait)}</span>` : "";
    let ctl = "";
    if (owner) {
      ctl = confirmAct === "room-close"
        ? `<span class="rb-confirm">${esc(t.roomCloseConfirm)}</span><button type="button" class="btn btn-small btn-danger" data-act="room-close-yes">${esc(t.roomClose)}</button><button type="button" class="btn btn-small" data-act="confirm-no">${esc(t.keepGoing)}</button>`
        : `<button type="button" class="btn btn-small" data-act="room-close">${esc(t.roomClose)}</button>`;
    } else if (net.role === "viewer") {
      ctl = `<button type="button" class="btn btn-small" data-act="room-leave">${esc(t.roomLeave)}</button>`;
    }
    const qr = HOST_VIEW ? "" : qrSvg(joinUrl(r.code));
    return `<section class="room-bar${big ? " big" : ""}" aria-label="${esc(t.roomCode)}">
        <div class="rb-main">
          <div class="rb-code"><span class="eyebrow">${esc(t.roomCode)}</span><b>${esc(r.code)}</b></div>
          ${qr ? `<div class="rb-qr">${qr}</div>` : ""}
          <p class="rb-how">${esc(t.roomHow(joinHost()))}</p>
        </div>
        <div class="rb-side">
          <p class="eyebrow">${esc(t.roomPlayers(here))} · ${esc(t.roomJudgeIs(roomJudgeOf()))}</p>
          ${players}
          <div class="rb-meta">${conn}${ctl}</div>
        </div>
      </section>`;
  }

  // Question record, shared by the case screen and the closing screen.
  function transcriptList(g, t) {
    let n = 0;
    const rows = g.log.map(x => ({ x, num: x.v === "INVALID" ? "–" : String(++n).padStart(2, "0") })).reverse();
    return rows.length ? `<ul class="transcript">${rows.map(({ x, num }) => {
      const V = VERDICTS[x.v];
      const who = typeof x.t === "number" ? `<span class="tteam" style="--tc:${teamColor(x.t)}">${esc(teamName(x.t))}</span>`
        : x.n ? `<span class="tteam" style="--tc:var(--ink-2)">${esc(x.n)}</span>` : "";
      return `<li><span class="tn">Q${esc(num)}</span>${x.q ? `<span class="tq">${who}${esc(x.q)}</span>` : `<span class="tq muted">${who}${esc(t.noRecord)}</span>`}<span class="vchip ${V.cls}">${esc(V[state.lang])}</span>${x.note ? `<span class="tnote">${esc(x.note)}</span>` : ""}</li>`;
    }).join("")}</ul>` : `<p class="empty">${esc(t.noQuestions)}</p>`;
  }

  // Two sentences per paragraph, so the whole story reads like a story. A quotation is never split.
  function paragraphs(text) {
    const s = String(text || "");
    const parts = s.match(/[^.!?]+[.!?]+["”’']?(\s+|$)|[^.!?]+$/g) || [s];
    const sents = [];
    let buf = "";
    for (const p of parts) {
      buf += p;
      const straight = (buf.match(/"/g) || []).length;
      const curly = (buf.match(/“/g) || []).length - (buf.match(/”/g) || []).length;
      if (straight % 2 === 0 && curly <= 0) { sents.push(buf); buf = ""; }
    }
    if (buf) sents.push(buf);
    const out = [];
    for (let i = 0; i < sents.length; i += 2) out.push(sents.slice(i, i + 2).join("").trim());
    return out.filter(Boolean);
  }

  // Key points found, by the AI check or ticked by the host.
  function foundKeys(g) {
    const out = {};
    if (g.lastCheck && g.lastCheck.hits) for (const k in g.lastCheck.hits) if (g.lastCheck.hits[k]) out[k] = true;
    if (g.hostHits) for (const k in g.hostHits) if (g.hostHits[k]) out[k] = true;
    return out;
  }
  function keyChips(c, g, t) {
    const hits = foundKeys(g);
    const tracked = !!g.lastCheck || !!(g.hostHits && Object.values(g.hostHits).some(Boolean));
    const found = c.keys.filter(k => hits[k.id]).length;
    return `<div class="kchips-wrap"><p class="eyebrow">${esc(tracked ? t.keysFound(found, c.keys.length) : t.keyChipsTitle(c.keys.length))}</p>
      <div class="kchips">${c.keys.map(k => `<span class="kchip${hits[k.id] ? " hit" : ""}">${hits[k.id] ? '<i aria-hidden="true">✓</i>' : ""}${esc(L(k.label))}</span>`).join("")}</div></div>`;
  }

  // Once a case is closed, every hint is shown with its picture, including the ones nobody opened.
  function clueArchive(c, g, t) {
    const unlocked = Math.max(0, c.hints.length - g.hints);
    const cards = c.hints.map((h, i) => {
      const opened = i < g.hints;
      return `<article class="arch-card${opened ? "" : " unlocked"}">
          <span class="hint-top"><span class="eyebrow">${esc(t.hintBtn(i + 1))}</span><span class="hint-tag${opened ? "" : " unlocked"}">${esc(opened ? t.clueOpenedTag : t.clueUnlockedTag)}</span></span>
          ${CAN_IMAGES ? media(picOf(c, `hint${i + 1}`), `${L(c.title)} · ${t.hintBtn(i + 1)}`, { cls: "arch-media", zoom: true }) : ""}
          <p class="htext">${esc(L(h))}</p>
        </article>`;
    }).join("");
    return `<section class="cp-archive" aria-labelledby="arch-h">
        <div class="arch-head">
          <h3 id="arch-h" class="eyebrow">${esc(t.archiveTitle)} <b>${c.hints.length}</b></h3>
          ${unlocked ? `<span class="unlock-chip">${esc(t.unlockedChip(unlocked))}</span>` : ""}
          <button type="button" class="arch-toggle" data-act="archive" aria-expanded="${archiveOpen}">${esc(archiveOpen ? t.archiveHide : t.archiveShow)}</button>
        </div>
        ${archiveOpen ? `${unlocked ? `<p class="fineprint">${esc(t.archiveNote)}</p>` : ""}<div class="arch-grid">${cards}</div>` : ""}
      </section>`;
  }

  // The closing screen: one centered column, like a case file that has just been closed.
  // Team battle result: each team's questions and penalties, the winner, and the wins so far.
  function teamResult(c, g, t) {
    const rows = teamStats(g);
    const w = g.status === "solved" && typeof g.winner === "number" ? g.winner : -1;
    const series = Array.from({ length: state.teams.n }, (_, i) => `${teamName(i)} ${t.teamWinsShort(state.teams.wins[i] || 0)}`).join(" · ");
    return `<section class="cp-score cp-teams" aria-label="${esc(t.cpScoreLabel)}">
        <div class="cp-case"><span class="fileno">${esc(tagFor(c))}</span>${dots(c)}<strong>${esc(L(c.title))}</strong><span class="cp-hints">${esc(t.cpHints(g.hints, g.hints - manualHints(g), manualHints(g), penaltyOf(g)))}</span></div>
        <table class="team-table">
          <thead><tr><th scope="col">${esc(t.teamColName)}</th><th scope="col">${esc(t.teamColQ)}</th><th scope="col">${esc(t.teamColPen)}</th><th scope="col">${esc(t.teamColTotal)}</th></tr></thead>
          <tbody>${rows.map((r, i) => `<tr class="${i === w ? "win" : ""}" style="--tc:${teamColor(i)}"><th scope="row"><i></i>${esc(teamName(i))}${i === w ? ` <span class="win-tag">${esc(t.winnerTag)}</span>` : ""}</th><td>${r.q}</td><td>${r.pen}</td><td><b>${r.total}</b></td></tr>`).join("")}</tbody>
        </table>
        <p class="cp-series"><span class="eyebrow">${esc(t.teamSeries)}</span> ${esc(series)}</p>
      </section>`;
  }

  function closingView(c, g, t) {
    const bible = c.kind === "bible";
    const solved = g.status === "solved";
    const q = totalOf(g);
    const manual = manualHints(g);
    const team = isTeam(g);
    const winner = team && solved && typeof g.winner === "number" ? g.winner : -1;
    const story = paragraphs(L(c.truth)).map(p => `<p>${esc(p)}</p>`).join("");
    const remote = remoteRole();
    return `<main class="closing-page">
      ${remote ? "" : `<button type="button" class="back" data-act="home">← ${esc(t.allCases)}</button>`}
      <header class="cp-head${freshStamp ? " fresh" : ""}">
        <p class="cp-kicker">${solved ? "CASE CLOSED" : "FILE OPENED"}</p>
        <h2 class="cp-title"${winner >= 0 ? ` style="--tc:${teamColor(winner)}"` : ""}>${esc(winner >= 0 ? t.teamWins(teamName(winner)) : solved ? t.closedSolved : t.closedRevealed)}</h2>
        <p class="cp-sub">${esc(winner >= 0 ? t.teamSub : solved ? t.cpSubSolved : t.cpSubRevealed)}</p>
      </header>
      ${team ? teamResult(c, g, t) : `<section class="cp-score" aria-label="${esc(t.cpScoreLabel)}">
        <div class="cp-rank"><span class="eyebrow">${esc(t.cpRankLabel)}</span>${solved ? `<strong>${esc(t.rank[rankIndex(q)])}</strong>` : `<strong class="muted">${esc(t.cpNoRank)}</strong>`}</div>
        <div class="cp-case"><span class="fileno">${esc(tagFor(c))}</span>${dots(c)}<strong>${esc(L(c.title))}</strong><span class="cp-hints">${esc(t.cpHints(g.hints, g.hints - manual, manual, penaltyOf(g)))}</span></div>
        <div class="cp-count"><b>${q}</b><span>${esc(t.cpQuestionsUnit)}</span></div>
      </section>`}
      <section class="cp-truth" aria-labelledby="cp-truth-h">
        <p id="cp-truth-h" class="eyebrow">${esc(t.cpTruthLabel)}</p>
        ${CAN_IMAGES ? media(picOf(c, "truth"), `${L(c.title)} · ${t.truthPicTitle}`, { cls: "cp-media", zoom: true }) : ""}
        <div class="cp-setup"><p class="eyebrow">${esc(t.statement)}</p><p>${esc(L(c.setup))}</p></div>
        ${keyChips(c, g, t)}
        <div class="cp-story">${story}</div>
        ${bible ? `<div class="cp-bible"><h3 class="eyebrow">${esc(t.silentTitle)}</h3><ul class="silentlist">${c.silent.map(x => `<li>${esc(L(x))}</li>`).join("")}</ul><p class="readit">${esc(t.readIt)}: <strong>${esc(L(c.ref))}</strong></p></div>` : ""}
      </section>
      ${clueArchive(c, g, t)}
      <section class="cp-log">
        <button type="button" class="arch-toggle" data-act="cp-log" aria-expanded="${cpLogOpen}">${esc(t.cpLogTitle(counted(g)))} ${cpLogOpen ? "▴" : "▾"}</button>
        ${cpLogOpen ? transcriptList(g, t) : ""}
      </section>
      ${remote ? `<p class="cp-wait">${esc(t.roomWaitNext)}</p>` : `<div class="cp-actions">
        <button type="button" class="btn btn-primary btn-big" data-act="home">${esc(t.cpNew)}</button>
        <button type="button" class="btn" data-act="again">${esc(t.playAgain)}</button>
      </div>`}
    </main>`;
  }

  // Everything a host who has never seen the case needs in order to judge it.
  function hostNotes(c, g, t) {
    const bible = c.kind === "bible";
    const lines = x => String(x || "").split("\n").map(y => y.replace(/^\s*-\s*/, "").trim()).filter(Boolean);
    const facts = lines(state.lang === "ko" && c.factsKo ? c.factsKo : c.facts);
    const notStated = bible ? lines(state.lang === "ko" && c.notStatedKo ? c.notStatedKo : c.notStated) : [];
    const hits = g.hostHits || {};
    const keys = c.keys.map(k => {
      const ok = !!hits[k.id];
      return `<li class="hkey${ok ? " found" : ""}">
          <button type="button" class="hkey-box" data-act="hostkey" data-k="${esc(k.id)}" aria-pressed="${ok}" aria-label="${esc(t.hostKeyTick)}: ${esc(L(k.label))}">${ok ? "✓" : ""}</button>
          <span><strong>${esc(L(k.label))}</strong>${esc(L(k.text))}</span>
        </li>`;
    }).join("");
    const hintItems = c.hints.map((h, i) => {
      const shown = i < g.hints;
      return `<li class="hhint${shown ? " shown" : ""}">
          <span class="eyebrow">${esc(t.hintBtn(i + 1))} · ${esc(shown ? t.hostHintOpened : t.hostHintLocked)}</span>
          <span>${esc(L(h))}</span>
        </li>`;
    }).join("");
    return `<div class="host-notes">
        <div class="hn-guide">
          <button type="button" class="arch-toggle" data-act="host-guide" aria-expanded="${hostGuideOpen}">${esc(t.hostGuideTitle)} ${hostGuideOpen ? "▴" : "▾"}</button>
          ${hostGuideOpen ? `<ol>${t.hostGuide(HINT_EVERY).map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
        </div>
        <div class="hn-block"><h3 class="eyebrow">${esc(t.hostTruthTitle)}</h3>${paragraphs(L(c.truth)).map(p => `<p class="truth">${esc(p)}</p>`).join("")}</div>
        <div class="hn-block"><h3 class="eyebrow">${esc(t.hostKeysTitle)}</h3><ul class="hkeys">${keys}</ul></div>
        <div class="hn-block"><h3 class="eyebrow">${esc(t.hostFactsTitle)}</h3><ul class="hfacts">${facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>
        ${bible ? `<div class="hn-block"><h3 class="eyebrow">${esc(t.hostNotStatedTitle)}</h3><ul class="hfacts">${notStated.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
          <h3 class="eyebrow">${esc(t.silentTitle)}</h3><ul class="silentlist">${c.silent.map(x => `<li>${esc(L(x))}</li>`).join("")}</ul>
          <p class="readit">${esc(t.readIt)}: <strong>${esc(L(c.ref))}</strong></p></div>` : ""}
        <div class="hn-block"><h3 class="eyebrow">${esc(t.hostHintsTitle)}</h3><ul class="hhints">${hintItems}</ul></div>
      </div>`;
  }

  // The latest question and its answer, large.
  function stageHtml(g, t) {
    const last = g.log[g.log.length - 1];
    if (busy === "ask") {
      return `<div class="stage" aria-live="polite"><p class="stage-q">“${esc(pendingQ)}”</p><span class="thinking">${esc(t.thinking)}</span></div>`;
    }
    if (!last) return `<div class="stage"><p class="stage-empty">${esc(t.stageEmpty)}</p></div>`;
    const V = VERDICTS[last.v];
    return `<div class="stage" aria-live="polite">
        ${typeof last.t === "number" ? `<span class="stage-team" style="--tc:${teamColor(last.t)}">${esc(teamName(last.t))}</span>`
          : last.n ? `<span class="stage-team" style="--tc:var(--accent)">${esc(last.n)}</span>` : ""}
        ${last.q ? `<p class="stage-q">“${esc(last.q)}”</p>` : ""}
        <span class="verdict ${V.cls}${V.long ? " long" : ""}${freshStamp ? " fresh" : ""}">${esc(V[state.lang])}</span>
        ${last.note ? `<p class="stage-note">${esc(last.note)}</p>` : ""}
      </div>`;
  }

  // How far it is to the next automatic hint, with the emergency hint button.
  function hintMeter(c, g, t, act) {
    const q = counted(g);
    const allOpen = g.hints >= c.hints.length;
    // The meter runs from the question where the last hint opened to the question where the next one opens.
    const end = HINT_EVERY * (g.hints + 1);
    const lastAt = g.hints && Array.isArray(g.hintAt) && typeof g.hintAt[g.hints - 1] === "number" ? g.hintAt[g.hints - 1] : HINT_EVERY * g.hints;
    const start = Math.min(lastAt, HINT_EVERY * g.hints);
    const span = Math.max(1, end - start);
    const done = allOpen ? span : Math.max(0, Math.min(span, q - start));
    return `<div class="hint-meter">
        <div class="hm-top"><span class="next-hint">${esc(allOpen ? t.allHintsOpen : t.nextHintIn(Math.max(0, end - q)))}</span>
          ${!act || allOpen ? "" : `<button type="button" class="btn btn-small btn-emergency" data-act="${act}">${esc(t.emergencyBtn)}</button>`}</div>
        <div class="hm-bar" role="progressbar" aria-label="${esc(t.hintMeterLabel)}" aria-valuemin="0" aria-valuemax="${span}" aria-valuenow="${done}"><i style="width:${Math.round((done / span) * 100)}%"></i></div>
      </div>`;
  }

  // In a room: whose turn it is and the question waiting to be judged.
  function roomStrip(c, g, t, viewOnly) {
    const r = state.room;
    const tp = turnPlayer();
    const p = r.pending;
    // Only the host sees a waiting question before it is judged; everyone sees it with its answer.
    const hostEyes = !viewOnly && (HOST_VIEW || (net.role === "owner" && !sync.peer)) && roomJudgeOf() === "host";

      ? `<p class="room-last">${esc(t.roomLastNo(r.last.name, r.last.found || 0, r.last.total || 0))}</p>` : "";
    const someone = r.players.some(x => x.on);

          ${viewOnly || !someone ? "" : `<button type="button" class="btn btn-small" data-act="room-pass">${esc(t.roomPassHost)}</button>`}</div>
        ${pend}

  function caseView() {

    } else if (mode === "ai" && showSolve) {
      let result = "";
      if (g.lastCheck) {

      panel = `<form class="panel solve" data-form="solve" autocomplete="off">
          <label class="eyebrow" for="sol">${esc(t.solveTitle)}</label>

          <div class="actions">
            ${busy === "check"
              ? `<span class="waiting">${esc(t.checking)}</span><button type="button" class="btn btn-danger" data-act="check-cancel">${esc(t.cancel)}</button>`
              : `<button type="submit" class="btn btn-primary" ${aiOk && !busy ? "" : "disabled"}>${esc(t.check)}</button><button type="button" class="btn" data-act="solve-close">${esc(t.cancel)}</button>`}

    const modeBtns = mode === "ai"
      ? (showSolve ? "" : `<button type="button" class="btn" data-act="solve-open" ${aiOk ? "" : "disabled"}>${esc(t.solve)}</button>`)
      : `<button type="button" class="btn" data-act="solved">${esc(t.solvedBtn)}</button>${notesBtn}`;
    const actions = confirmAct === "solved" || confirmAct === "reveal" ? ""
      : `<div class="actions">${modeBtns}<button type="button" class="btn" data-act="reveal">${esc(t.reveal)}</button></div>`;
    const tools = viewOnly ? `<section class="tools b-tools">${hints}</section>`
      : `<section class="tools b-tools">${actions}${panel}${hints}${HOST_VIEW ? hostNotes(c, g, t) : ""}</section>`;

    const stage = stageHtml(g, t);
    const notice = ai.noticeKey ? `<p class="notice" role="status">${esc(errText(t, ai.noticeKey))}</p>` : "";
    const pen = penaltyOf(g);
    const hintConfirm = confirmAct === "hint" ? `<div class="panel warn hint-confirm" role="group">
          <p class="confirm-q">${esc(team ? t.emergencyConfirmTeam(teamName(g.turn)) : t.emergencyConfirm)}</p>
          <div class="actions">
            <button type="button" class="btn btn-primary" data-act="hint-yes">${esc(t.emergencyYes)}</button>
            <button type="button" class="btn" data-act="confirm-no">${esc(t.keepGoing)}</button>
          </div>
