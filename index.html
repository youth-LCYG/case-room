    const teamStrip = team ? `<div class="team-strip">
          <div class="turn-now" style="--tc:${teamColor(g.turn)}"><span>${esc(t.turnNow)}</span><b>${esc(teamName(g.turn))}</b>
            <button type="button" class="btn btn-small" data-act="pass">${esc(t.passTurn)}</button></div>
          <ul class="team-stats">${teamStats(g).map((r, i) => `<li class="${i === g.turn ? "on" : ""}" style="--tc:${teamColor(i)}"><i></i><span>${esc(teamName(i))}</span><b>${r.total}</b></li>`).join("")}</ul>
        </div>` : "";
    const deskHead = `<div class="desk-head">
          <div class="count-big"><b>${q + pen}</b><span>${esc(t.totalLabel)}</span>${pen ? `<em>${esc(t.totalBreak(q, pen))}</em>` : ""}</div>
          <div class="count-small"><span>${esc(t.hints)} <b>${g.hints}</b> / ${c.hints.length}</span></div>
        </div>
        ${hintMeter(c, g, t, viewOnly || confirmAct === "hint" ? "" : "hint")}
        ${hintConfirm}
        ${state.room ? roomStrip(c, g, t, viewOnly) : teamStrip}`;
    let ask;
    if (viewOnly) {
      ask = `<section class="desk b-ask">${deskHead}${stage}</section>`;
    } else if (mode === "ai") {
      ask = `<section class="desk b-ask">
          ${deskHead}
          <form class="ask" data-form="ask" autocomplete="off">
            <input id="q" type="text" maxlength="200" placeholder="${esc(t.askPlaceholder)}" aria-label="${esc(t.askLabel)}" ${aiOk ? "" : "disabled"}>
            <button type="submit" class="btn btn-primary" ${aiOk && !busy ? "" : "disabled"}>${esc(t.ask)}</button>
          </form>
          ${notice}
          <p class="fineprint">${esc(aiOk ? `${ai.source === "relay" ? t.relayConsent : t.consent} ${t.notCounted}` : t.aiConnectingNote)}</p>
          ${stage}
        </section>`;
    } else {
      ask = `<section class="desk b-ask">
          ${deskHead}
          <input id="memo" class="memo" type="text" maxlength="200" placeholder="${esc(t.memoPlaceholder)}" aria-label="${esc(t.memoLabel)}">
          <div class="vpad" role="group" aria-label="${esc(t.stampLabel)}">
            ${["YES", "NO", third].map(v => {
              const V = VERDICTS[v];
              return `<button type="button" id="stamp-${v}" class="vbtn ${V.cls}${V.long ? " long" : ""}" data-act="stamp" data-v="${v}">${esc(V[state.lang])}</button>`;
            }).join("")}
          </div>
          <div class="pad-foot">
            <p class="fineprint">${esc(t.hostIntro)}</p>
            ${g.log.length ? `<button type="button" class="undo" data-act="undo">${esc(t.undo)}</button>` : ""}
          </div>
          ${notice}
          ${stage}
        </section>`;
    }

    const log = `<section class="log b-log" aria-labelledby="log-h">
      <div class="log-head"><h3 id="log-h" class="eyebrow">${esc(t.transcript)}</h3></div>
      ${transcriptList(g, t)}
    </section>`;

    return `<main>
      <div class="case-head">
        ${viewOnly ? "" : `<button type="button" class="back" data-act="home">← ${esc(t.allCases)}</button>`}
        <div class="fileline"><span class="fileno">${esc(tagFor(c))}</span>${dots(c)}${warnChip(c)}</div>
        <h2 class="case-title">${esc(L(c.title))}</h2>
      </div>
      ${state.room ? roomBar(t, false) : ""}
      <div class="case-grid${HOST_VIEW ? " host-grid" : ""}">
        <div class="col-left">${scene}${tools}</div>
        <div class="col-right">${ask}${log}</div>
      </div>
    </main>`;
  }

  /* ---------- Picture viewer ---------- */
  const lightbox = document.getElementById("lightbox");
  let lightboxReturn = null;
  function openLightbox(src, alt) {
    if (!lightbox) return;
    lightboxReturn = document.activeElement;
    lightbox.innerHTML = `<img src="${esc(src)}" alt="${esc(alt || "")}"><button type="button" class="lb-close" aria-label="${esc(u().close)}">${ICON_CLOSE}</button>`;
    lightbox.hidden = false;
    const btn = lightbox.querySelector(".lb-close");
    if (btn) btn.focus({ preventScroll: true });
  }
  function closeLightbox() {
    if (!lightbox || lightbox.hidden) return;
    lightbox.hidden = true;
    lightbox.innerHTML = "";
    if (lightboxReturn && document.contains(lightboxReturn)) lightboxReturn.focus({ preventScroll: true });
    lightboxReturn = null;
  }
  if (lightbox) lightbox.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (lightbox && !lightbox.hidden) closeLightbox();
    else closeClue();
  });

  /* ---------- Hints: one opens every HINT_EVERY questions, or early by hand ---------- */
  const HINT_EVERY = 15;
  const HINT_PENALTY = 10;
  // A hint opened early by hand is an emergency hint: it adds HINT_PENALTY to the count.
  function manualHints(g) {
    const src = Array.isArray(g.hintSrc) ? g.hintSrc : [];
    let n = 0;
    for (let i = 0; i < g.hints; i++) if (src[i] !== "auto") n++;
    return n;
  }
  const penaltyOf = g => HINT_PENALTY * manualHints(g);
  const totalOf = g => counted(g) + penaltyOf(g);
  // Per team: questions asked on its turns and the penalties for emergency hints it opened.
  function teamStats(g) {
    const n = g.team || 0;
    const rows = Array.from({ length: n }, () => ({ q: 0, pen: 0, total: 0 }));
    for (const x of g.log) if (x.v !== "INVALID" && typeof x.t === "number" && rows[x.t]) rows[x.t].q++;
    const src = g.hintSrc || [], by = g.hintBy || [];
    for (let i = 0; i < g.hints; i++) if (src[i] !== "auto" && typeof by[i] === "number" && rows[by[i]]) rows[by[i]].pen += HINT_PENALTY;
    for (const r of rows) r.total = r.q + r.pen;
    return rows;
  }
  function openHint(c, g, src) {
    if (!c || !g || g.status !== "open" || g.hints >= c.hints.length) return;
    if (!Array.isArray(g.hintSrc)) g.hintSrc = [];
    g.hintSrc[g.hints] = src;
    if (!Array.isArray(g.hintAt)) g.hintAt = [];
    g.hintAt[g.hints] = counted(g);
    if (isTeam(g)) { if (!Array.isArray(g.hintBy)) g.hintBy = []; g.hintBy[g.hints] = src === "auto" ? null : g.turn; }
    g.hints += 1;
    if (!HOST_VIEW) showClue(g.hints - 1, true);
  }
  // In a team battle the turn moves on after every counted answer.
  function nextTurn(g) { if (isTeam(g)) g.turn = ((g.turn || 0) + 1) % g.team; }

  /* ---------- Hint sound ---------- */
  let audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; audioCtx = new AC(); }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }
  // Browsers only allow sound after someone has touched the page, so wake the sound up on the first touch.
  document.addEventListener("pointerdown", () => { if (soundOn && !HOST_VIEW) ensureAudio(); }, { passive: true });
  function chime() {
    if (HOST_VIEW || !soundOn) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const start = ctx.currentTime + 0.02;
    [0, 0.62].forEach(round => [[880, 0], [1174.66, 0.12], [1567.98, 0.24]].forEach(([f, dt]) => {
      const o = ctx.createOscillator(), v = ctx.createGain(), at = start + round + dt;
      o.type = "sine";
      o.frequency.value = f;
      v.gain.setValueAtTime(0.0001, at);
      v.gain.exponentialRampToValueAtTime(0.22, at + 0.02);
      v.gain.exponentialRampToValueAtTime(0.0001, at + 0.45);
      o.connect(v).connect(ctx.destination);
      o.start(at);
      o.stop(at + 0.5);
    }));
  }
  function autoHint(c, g) {
    if (g.status === "open" && g.hints < c.hints.length && counted(g) >= HINT_EVERY * (g.hints + 1)) openHint(c, g, "auto");
  }

  /* ---------- Hint pop-up ---------- */
  const clueBox = document.getElementById("clue");
  let clue = null;          // { i: hint index, fresh: true right after it opened }
  let clueReturn = null;
  function showClue(i, fresh) {
    if (fresh) chime();
    if (!clueBox) return;
    if (!clue) clueReturn = document.activeElement;
    clue = { i, fresh };
    renderClue();
    const btn = clueBox.querySelector("[data-clue='close']");
    if (btn) btn.focus({ preventScroll: true });
  }
  function closeClue(silent) {
    if (!clueBox || !clue) return;
    clue = null;
    clueBox.hidden = true;
    clueBox.innerHTML = "";
    if (!silent && clueReturn && document.contains(clueReturn)) clueReturn.focus({ preventScroll: true });
    clueReturn = null;
  }
  function renderClue() {
    if (!clueBox) return;
    const c = cur();
    if (!clue || !c || state.view !== "case") { clueBox.hidden = true; clueBox.innerHTML = ""; return; }
    const t = u();
    const g = game(c.id);
    const total = g.hints;
    if (total < 1) { closeClue(true); return; }
    const i = Math.max(0, Math.min(clue.i, total - 1));
    const auto = (g.hintSrc || [])[i] === "auto";
    clueBox.innerHTML = `<div class="clue-card" role="dialog" aria-modal="true" aria-labelledby="clue-h">
      <p class="eyebrow">${esc(t.hintBtn(i + 1))}</p>
      <h2 id="clue-h">${esc(clue.fresh ? t.clueNew : t.hintBtn(i + 1))}</h2>
      <p class="clue-text">${esc(L(c.hints[i]))}</p>
      ${CAN_IMAGES ? media(picOf(c, `hint${i + 1}`), `${L(c.title)} · ${t.hintBtn(i + 1)}`, { cls: "clue-media" }) : ""}
      <p class="fineprint">${esc(auto ? t.clueAuto(HINT_EVERY * (i + 1)) : t.clueManual)}</p>
      ${total > 1 ? `<div class="clue-nav">
        <button type="button" class="btn btn-small" data-clue="prev" ${i === 0 ? "disabled" : ""}>‹ ${esc(t.cluePrev)}</button>
        <span>${i + 1} / ${total}</span>
        <button type="button" class="btn btn-small" data-clue="next" ${i >= total - 1 ? "disabled" : ""}>${esc(t.clueNext)} ›</button>
      </div>` : ""}
      <button type="button" class="btn btn-primary clue-close" data-clue="close">${esc(t.close)}</button>
    </div>`;
    clueBox.hidden = false;
  }
  if (clueBox) clueBox.addEventListener("click", e => {
    if (e.target === clueBox) { closeClue(); return; }
    const b = e.target.closest("[data-clue]");
    if (!b || b.disabled || !clue) return;
    const act = b.dataset.clue;
    if (act === "close") { closeClue(); return; }
    clue = { i: clue.i + (act === "next" ? 1 : -1), fresh: false };
    renderClue();
    const same = clueBox.querySelector(`[data-clue='${act}']`);
    const target = same && !same.disabled ? same : clueBox.querySelector("[data-clue='close']");
    if (target) target.focus({ preventScroll: true });
  });

  const KEEP = ["q", "sol", "memo", "relay-url", "relay-pass", "join-code", "join-name", "p-q", "p-sol"];
  function render() {
    const active = document.activeElement ? document.activeElement.id : "";
    const kept = {};
    for (const id of KEEP) { const el = document.getElementById(id); if (el) kept[id] = el.value; }
    document.documentElement.lang = state.lang;
    if (net.role === "owner" && state.room) state.room.judge = effMode();
    app.innerHTML = header() + (showSettings ? settingsPanel() : "")
      + (net.role === "player" ? playerView() : state.view === "case" && cur() ? caseView() : homeView());
    for (const id of KEEP) { const el = document.getElementById(id); if (el && kept[id] !== undefined) el.value = kept[id]; }
    if (active) {
      const el = document.getElementById(active);
      if (el && !el.disabled) el.focus({ preventScroll: true });
    }
    freshStamp = false;
    syncShare();
    roomPush();
  }

  function clearInputs() {
    for (const id of ["q", "sol", "memo", "p-q", "p-sol"]) { const el = document.getElementById(id); if (el) el.value = ""; }
  }
  function clearSettingsInputs() {
    for (const id of ["relay-url", "relay-pass"]) { const el = document.getElementById(id); if (el) el.value = ""; }
  }
  function resetPanels() {
    showSolve = false;
    showNotes = false;
    confirmAct = null;
  }
  function scrollToClosing() {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  }

  /* ---------- Actions ---------- */
  function roomFresh() {
    if (state.room) Object.assign(state.room, { pending: null, last: null, bounce: null, notice: null });
  }
  function openCase(id) {
    roomFresh();
    closeClue(true);
    clearInputs();
    state.view = "case";
    state.caseId = id;
    resetPanels();
    ai.noticeKey = "";
    render();
    window.scrollTo(0, 0);
  }
  function goHome() {
    roomFresh();
    closeClue(true);
    if (busy === "check" && checkCtl) checkCtl.abort();
    clearInputs();
    state.view = "home";
    resetPanels();
    ai.noticeKey = "";
    render();
    window.scrollTo(0, 0);
  }

  function handleError(e) {
    const code = e && e.code;
    if (code === "cancelled") return;
    if (code === "not_granted") { ai.status = "blocked"; ai.noticeKey = "notGranted"; return; }
    if (["sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
      ai.status = "off"; ai.noticeKey = "unavailable"; return;
    }
    if (code === "rate_limited") { ai.noticeKey = "rate"; return; }
    if (code === "session_expired") { ai.noticeKey = "session"; return; }
    if (code === "refused") { ai.noticeKey = "refused"; return; }
    if (code === "bad_passcode") { ai.noticeKey = "badPass"; return; }
    if (code === "relay_rate") { ai.noticeKey = "relayRate"; return; }
    if (code === "relay_down") { ai.noticeKey = "relayDown"; return; }
    if (code === "relay_config") { ai.noticeKey = "relayConfig"; return; }
    ai.noticeKey = "generic";
  }

  function errKey(e) {
    const code = e && e.code;
    return code === "bad_passcode" ? "badPass"
      : code === "relay_rate" ? "relayRate"
      : code === "relay_down" ? "relayDown"
      : code === "relay_config" ? "relayConfig"
      : "generic";
  }

  async function saveRelay() {
    if (testing) return;
    const url = ((document.getElementById("relay-url") || {}).value || "").trim();
    const pass = ((document.getElementById("relay-pass") || {}).value || "").trim();
    if (!url || !pass) { settingsMsg = { key: "settingsMissing", ok: false }; render(); return; }
    if (!/^https:\/\/\S+$/i.test(url)) { settingsMsg = { key: "settingsBadUrl", ok: false }; render(); return; }
    const before = { url: relay.url, pass: relay.pass, source: ai.source, status: ai.status };
    relay.url = url;
    relay.pass = pass;
    ai.source = "relay";
    testing = true;
    settingsMsg = null;
    render();
    try {
      const r = await aiJSON('Reply with only this JSON and nothing else: {"ok":true}', "judge");
      if (!r || r.ok !== true) throw { code: "invalid_json" };
      remember(RELAY_URL_KEY, url);
      remember(RELAY_PASS_KEY, pass);
      ai.status = "ready";
      ai.noticeKey = "";
      state.mode = "ai";
      remember("caseRoomMode", "ai");
      settingsMsg = { key: "settingsOk", ok: true };
    } catch (e) {
      relay.url = before.url;
      relay.pass = before.pass;
      ai.source = before.source;
      ai.status = before.status;
      settingsMsg = { key: errKey(e), ok: false };
    } finally {
      testing = false;
      render();
    }
  }

  function disconnectRelay() {
    forget(RELAY_URL_KEY);
    forget(RELAY_PASS_KEY);
    relay.url = "";
    relay.pass = "";
    ai.source = "";
    ai.status = "off";
    ai.noticeKey = "";
    resetPanels();
    clearSettingsInputs();
    settingsMsg = { key: "disconnected", ok: true };
    render();
  }

  async function ask(text, from) {
    if (busy || ai.status !== "ready" || effMode() !== "ai") return;
    const c = cur();
    if (!c) return;
    const g = game(c.id);
    if (g.status !== "open") return;
    busy = "ask";
    pendingQ = text;
    ai.noticeKey = "";
    render();
    try {
      const res = await aiJSON(judgePrompt(c, g, text), "judge");
      let v = String((res && res.verdict) || "").trim().toUpperCase().replace(/[\s-]+/g, "_");
      if (c.kind === "bible" && v === "IRRELEVANT") v = "NOT_STATED";
      if (c.kind === "mystery" && v === "NOT_STATED") v = "IRRELEVANT";
      if (!VERDICTS[v]) throw { code: "invalid_json" };
      const note = v === "INVALID" && res && typeof res.note === "string" ? res.note.trim().slice(0, 160) : "";
      const entry = { q: text, v, note };
      if (isTeam(g)) entry.t = g.turn;
      if (from) { entry.p = from.pid; entry.n = from.name; }
      g.log.push(entry);
      if (v !== "INVALID") { nextTurn(g); if (from) roomAdvance(true); }
      const qEl = document.getElementById("q");
      if (!from && qEl && qEl.value.trim() === text) qEl.value = "";
      freshStamp = true;
      autoHint(c, g);
    } catch (e) {
      handleError(e);
      if (from && state.room) state.room.notice = { pid: from.pid, code: "ai_fail" };
    } finally {
      if (from && state.room) state.room.pending = null;
      busy = null;
      pendingQ = "";
      render();
      roomJudgeNext();
    }
  }

  async function check(text, from) {
    if (busy || ai.status !== "ready") return;
    const c = cur();
    if (!c) return;
    const g = game(c.id);
    busy = "check";
    checkCtl = new AbortController();
    ai.noticeKey = "";
    render();
    try {
      const res = await aiJSON(gradePrompt(c, text), "grade", checkCtl.signal);
      const hits = {};
      let all = true;
      for (const k of c.keys) {
        const raw = res && res.hits ? res.hits[k.id] : false;
        const ok = raw === true || raw === "true";
        hits[k.id] = ok;
        if (!ok) all = false;
      }
      g.attempts += 1;
      g.lastCheck = { hits, feedback: res && typeof res.feedback === "string" ? res.feedback.trim().slice(0, 240) : "" };
      if (all) {
        g.status = "solved"; resetPanels(); freshStamp = true;
        // In a team battle the team on turn gave the answer.
        if (isTeam(g)) { g.winner = g.turn; state.teams.wins[g.turn] = (state.teams.wins[g.turn] || 0) + 1; }
      } else if (isTeam(g)) {
        nextTurn(g);
      } else if (from && state.room) {
        // Everyone sees that the answer wasn't it yet, and the turn moves on.
        state.room.last = { name: from.name, ok: false, n: g.log.length, found: c.keys.filter(k => hits[k.id]).length, total: c.keys.length };
        roomAdvance(true);
      }
    } catch (e) {
      handleError(e);
      if (from && state.room) state.room.notice = { pid: from.pid, code: "ai_fail" };
    } finally {
      if (from && state.room) state.room.pending = null;
      busy = null;
      checkCtl = null;
      render();
      if (cur() && game(cur().id).status === "solved") scrollToClosing();
      roomJudgeNext();
    }
  }

  app.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    const c = cur();
    const g = c && state.view === "case" ? game(c.id) : null;
    switch (act) {
      case "lang":
        if (b.dataset.lang !== state.lang) { state.lang = b.dataset.lang; remember("caseRoomLang", state.lang); render(); renderClue(); }
        break;
      case "mode":
        if (b.dataset.mode !== state.mode) {
          if (busy === "check" && checkCtl) checkCtl.abort();
          state.mode = b.dataset.mode; remember("caseRoomMode", state.mode);
          resetPanels(); ai.noticeKey = ""; render();
          roomJudgeNext();
        }
        break;
      case "settings":
        showSettings = !showSettings;
        settingsMsg = null;
        render();
        if (showSettings) {
          const urlEl = document.getElementById("relay-url");
          const passEl = document.getElementById("relay-pass");
          if (urlEl && !urlEl.value) urlEl.value = relay.url;
          if (passEl && !passEl.value) passEl.value = relay.pass;
          window.scrollTo(0, 0);
          if (urlEl) urlEl.focus({ preventScroll: true });
        }
        break;
      case "settings-close": showSettings = false; settingsMsg = null; clearSettingsInputs(); render(); break;
      case "disconnect": disconnectRelay(); break;
      case "zoom": {
        const box = b.closest("[data-media]");
        const im = box && box.querySelector("img[data-ok]");
        if (im) openLightbox(im.getAttribute("src"), im.getAttribute("alt"));
        break;
      }
      case "open": if (!remoteRole()) openCase(b.dataset.id); break;
      case "home": if (!remoteRole()) goHome(); break;
      case "reload-cases": loadCases(); break;
      case "host-open": {
        const w = window.open(b.getAttribute("href"), "caseRoomHost", "popup,width=640,height=900");
        if (w) { e.preventDefault(); try { w.focus(); } catch (err) { /* focus refused */ } }
        break;
      }
      case "hostkey":
        if (g && b.dataset.k) { if (!g.hostHits) g.hostHits = {}; g.hostHits[b.dataset.k] = !g.hostHits[b.dataset.k]; render(); }
        break;
      case "archive": archiveOpen = !archiveOpen; render(); break;
      case "cp-log": cpLogOpen = !cpLogOpen; render(); break;
      case "host-guide": hostGuideOpen = !hostGuideOpen; render(); break;
      case "hint":
        if (g && g.status === "open" && g.hints < c.hints.length) { confirmAct = "hint"; showNotes = false; showSolve = false; render(); }
        break;
      case "hint-yes":
        if (g && confirmAct === "hint") { confirmAct = null; openHint(c, g, "manual"); render(); }
        break;
      case "pass":
        if (g && isTeam(g) && g.status === "open") { nextTurn(g); render(); }
        break;
      case "solved-by":
        if (g && isTeam(g) && confirmAct === "solved") {
          const w = Number(b.dataset.t);
          if (w >= 0 && w < g.team) {
            g.status = "solved"; g.winner = w;
            state.teams.wins[w] = (state.teams.wins[w] || 0) + 1;
            resetPanels(); freshStamp = true; render(); scrollToClosing();
          }
        }
        break;
      case "audience": {
        const a = b.dataset.a === "adult" && GROUP === "college" ? "adult" : "youth";
        if (a !== state.audience) { state.audience = a; remember("caseRoomAudience", a); applyAudience(); render(); }
        break;
      }
      case "play":
        if (b.dataset.play !== state.play && (b.dataset.play === "solo" || b.dataset.play === "team" || (b.dataset.play === "room" && CAN_ROOMS))) {
          net.error = "";
          state.play = b.dataset.play; remember("caseRoomPlay", state.play);
          teamSetupOpen = state.play === "team";
          render();
        }
        break;
      case "team-setup": teamSetupOpen = !teamSetupOpen; render(); break;
      case "team-n":
        if ([2, 3, 4].includes(Number(b.dataset.n))) { state.teams.n = Number(b.dataset.n); saveTeams(); render(); }
        break;
      case "team-reset": state.teams.wins = [0, 0, 0, 0]; render(); break;
      case "room-judge": roomJudge = b.dataset.j === "ai" ? "ai" : "host"; render(); break;
      case "room-create": roomCreate(); break;
      case "room-view": roomJoin(true); break;
      case "room-leave": roomLeave("left"); break;
      case "room-close": confirmAct = "room-close"; render(); break;
      case "room-close-yes":
        if (net.role === "owner") roomSend({ type: "close" });
        roomLeave("left");
        break;
      case "room-pass":
        if (state.room && g && g.status === "open") { state.room.pending = null; roomAdvance(true); render(); }
        break;
      case "room-bounce":
        if (state.room && state.room.pending && g) {
          state.room.bounce = { pid: state.room.pending.pid, n: g.log.length };
          state.room.pending = null;
          render();
        }
        break;
      case "room-solve-ok":
        if (state.room && state.room.pending && state.room.pending.kind === "solve" && g && g.status === "open") {
          state.room.last = { name: state.room.pending.name, ok: true, n: g.log.length };
          state.room.pending = null;
          g.status = "solved";
          resetPanels(); freshStamp = true; render(); scrollToClosing();
        }
        break;
      case "room-solve-no":
        if (state.room && state.room.pending && state.room.pending.kind === "solve" && g) {
          state.room.last = { name: state.room.pending.name, ok: false, n: g.log.length };
          state.room.pending = null;
          roomAdvance(true);
          render();
        }
        break;
      case "p-solve-open":
        pSolveOpen = true; confirmAct = null; render();
        requestAnimationFrame(() => { const el = document.getElementById("p-sol"); if (el) el.focus(); });
        break;
      case "p-solve-close": pSolveOpen = false; render(); break;
      case "p-hint": confirmAct = "p-hint"; render(); break;
      case "p-hint-yes": confirmAct = null; roomSend({ type: "intent", intent: { type: "hint" } }); render(); break;
      case "p-pass": roomSend({ type: "intent", intent: { type: "pass" } }); break;
      case "sound":
        soundOn = !soundOn; remember("caseRoomSound", soundOn ? "on" : "off");
        render();
        if (soundOn) chime();
        break;
      case "clue":
        if (g && g.hints > 0) showClue(Math.max(0, Number(b.dataset.i) || 0), false);
        break;
      case "stamp":
        if (g && g.status === "open" && VERDICTS[b.dataset.v]) {
          const memo = document.getElementById("memo");
          const r = state.room;
          const pend = r && r.pending && r.pending.kind === "ask" ? r.pending : null;
          const text = (memo ? memo.value.trim().slice(0, 200) : "") || (pend ? pend.text : "");
          const entry = { q: text, v: b.dataset.v, note: "" };
          if (isTeam(g)) entry.t = g.turn;
          if (pend) { entry.p = pend.pid; entry.n = pend.name; r.pending = null; r.bounce = null; }
          g.log.push(entry);
          if (memo) memo.value = "";
          freshStamp = true;
          nextTurn(g);
          if (pend) roomAdvance(true);
          autoHint(c, g);
          render();
        }
        break;
      case "undo":
        if (g && g.log.length) {
          const gone = g.log.pop();
          if (isTeam(g) && typeof gone.t === "number") g.turn = gone.t;
          if (state.room && gone.p) { const i = state.room.players.findIndex(x => x.pid === gone.p); if (i >= 0) state.room.turn = i; }
          render();
        }
        break;
      case "notes": showNotes = !showNotes; confirmAct = null; render(); break;
      case "notes-close": showNotes = false; render(); break;
      case "solve-open":
        showSolve = true; confirmAct = null; render();
        requestAnimationFrame(() => { const s = document.getElementById("sol"); if (s) s.focus(); });
        break;
      case "solve-close": showSolve = false; render(); break;
      case "check-cancel": if (checkCtl) checkCtl.abort(); break;
      case "solved": confirmAct = "solved"; showNotes = false; showSolve = false; render(); break;
      case "reveal": confirmAct = "reveal"; showNotes = false; showSolve = false; render(); break;
      case "confirm-no": confirmAct = null; render(); break;
      case "confirm-yes":
        if (g && confirmAct) {
          g.status = confirmAct === "reveal" ? "revealed" : "solved";
          resetPanels(); freshStamp = true; render(); scrollToClosing();
        }
        break;
      case "again":
        if (c && !remoteRole()) { roomFresh(); closeClue(true); delete state.games[c.id]; resetPanels(); ai.noticeKey = ""; clearInputs(); render(); window.scrollTo(0, 0); }
        break;
    }
  });

  app.addEventListener("input", e => {
    const m = /^team-name-(\d)$/.exec(e.target.id || "");
    if (m) state.teams.names[Number(m[1])] = e.target.value.slice(0, 12);
  });
  app.addEventListener("change", e => {
    if (/^team-name-\d$/.test(e.target.id || "")) { saveTeams(); render(); }
  });

  app.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.form === "ask") {
      const v = (document.getElementById("q") || {}).value || "";
      if (v.trim()) ask(v.trim());
    } else if (f.dataset.form === "solve") {
      const v = (document.getElementById("sol") || {}).value || "";
      if (v.trim()) check(v.trim());
    } else if (f.dataset.form === "settings") {
      saveRelay();
    } else if (f.dataset.form === "room-join") {
      roomJoin(false);
    } else if (f.dataset.form === "p-ask") {
      const el = document.getElementById("p-q");
      const v = el ? el.value.replace(/\s+/g, " ").trim().slice(0, 200) : "";
      if (v && roomSend({ type: "intent", intent: { type: "ask", text: v } })) { net.sent = v; el.value = ""; }
    } else if (f.dataset.form === "p-solve") {
      const el = document.getElementById("p-sol");
      const v = el ? el.value.trim().slice(0, 1500) : "";
      if (v && roomSend({ type: "intent", intent: { type: "solve", text: v } })) { el.value = ""; pSolveOpen = false; render(); }
    }
  });

  /* ---------- Rooms: play together on phones, taking turns ---------- */
  // The device that creates a room owns it: it keeps the game and sends it to the rooms server,
  // which passes it on to the players' phones and the big screen. Players send what they want to do;
  // the owner checks whose turn it is and updates the game.
  const ROOM_SERVER = (() => {
    try {
      const s = new URLSearchParams(location.search).get("server");
      if (s && /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(s)) return s;   // local testing only
    } catch (e) { /* no query */ }
    return "https://case-room-rooms.youth-bf0.workers.dev";
  })();
  const newRoom = code => ({ code, judge: "host", players: [], turn: 0, pending: null, last: null, bounce: null, notice: null });
  const turnPlayer = () => (state.room && state.room.players[state.room.turn]) || null;
  const roomJudgeOf = () => (state.room && state.room.judge === "ai" ? "ai" : "host");
  const remoteRole = () => net.role === "player" || net.role === "viewer";
  const joinHost = () => (location.host + location.pathname.replace(/index\.html$/, "")).replace(/\/$/, "");
  const joinUrl = code => `${location.origin}${location.pathname}?join=${code}`;

  function roomSave() {
    try {
      if (net.role) sessionStorage.setItem("caseRoomSession", JSON.stringify({ role: net.role, code: net.code, token: net.token, host: HOST_VIEW }));
      else sessionStorage.removeItem("caseRoomSession");
    } catch (e) { /* storage unavailable */ }
  }
  // After a reload, go back into the room this tab was in.
  function roomResume() {
    if (!CAN_ROOMS) return;
    let s = null;
    try { s = JSON.parse(sessionStorage.getItem("caseRoomSession") || "null"); } catch (e) { s = null; }
    if (!s || !/^[A-Z0-9]{4}$/.test(s.code || "") || !["owner", "player", "viewer"].includes(s.role)) return;
    if (!!s.host !== HOST_VIEW) return;   // a copy that came with a newly opened window
    if (s.role === "player" && !me.name) return;
    state.play = "room";
    if (s.role === "owner") { state.room = newRoom(s.code); net.fresh = true; }
    roomConnect(s.role, s.code, s.token || "");
  }

  async function roomCreate() {
    if (net.busy) return;
    net.busy = true; net.error = ""; render();
    try {
      const res = await fetch(`${ROOM_SERVER}/rooms`, { method: "POST" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data || !/^[A-Z0-9]{4}$/.test(data.code || "") || !data.token) throw new Error("bad reply");
      state.mode = roomJudge === "ai" && ai.status === "ready" ? "ai" : "host";
      remember("caseRoomMode", state.mode);
      state.room = newRoom(data.code);
      state.view = "home";
      net.busy = false;
      roomConnect("owner", data.code, data.token);
    } catch (e) {
      net.busy = false; net.error = "create_failed"; render();
    }
  }

  async function roomJoin(asViewer) {
    const codeEl = document.getElementById("join-code"), nameEl = document.getElementById("join-name");
    const code = String(codeEl ? codeEl.value : "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const name = String(nameEl ? nameEl.value : "").replace(/\s+/g, " ").trim().slice(0, 12);
    if (code.length !== 4) { net.error = "bad_code"; render(); return; }
    if (!asViewer && !name) { net.error = "need_name"; render(); return; }
    if (net.busy) return;
    net.busy = true; net.error = ""; render();
    try {
      const res = await fetch(`${ROOM_SERVER}/rooms/${code}/info`);
      net.busy = false;
      if (res.status === 404) { net.error = "no_room"; render(); return; }
      if (!res.ok) throw new Error("HTTP " + res.status);
    } catch (e) {
      net.busy = false; net.error = "offline"; render(); return;
    }
    if (!asViewer) { me.name = name; remember("caseRoomName", name); }
    state.room = null; state.view = "home"; state.games = {};
    roomConnect(asViewer ? "viewer" : "player", code, "");
  }

  function roomConnect(role, code, token) {
    roomDrop();
    Object.assign(net, { role, code, token, status: "connecting", retry: 0, fails: 0, error: "", last: "", ownerOn: true });
    roomSave();
    roomOpen();
    render();
  }

  function roomOpen() {
    if (!net.role) return;
    const q = new URLSearchParams({ role: net.role });
    if (net.role === "owner") q.set("token", net.token);
    if (net.role === "player") { q.set("pid", me.pid); q.set("name", me.name); }
    let ws;
    try { ws = new WebSocket(`${ROOM_SERVER.replace(/^http/, "ws")}/rooms/${net.code}/ws?${q}`); }
    catch (e) { roomRetry(); return; }
    net.ws = ws;
    ws.onopen = () => {
      if (net.ws !== ws) return;
      net.status = "open"; net.retry = 0; net.fails = 0; net.last = "";
      clearInterval(net.ping);
      net.ping = setInterval(() => { try { if (ws.readyState === 1) ws.send("ping"); } catch (e) { /* closed */ } }, 25000);
      render();
      roomPush(true);
    };
    ws.onmessage = e => { if (net.ws === ws) roomMessage(e.data); };
    ws.onclose = () => {
      if (net.ws !== ws) return;
      net.ws = null;
      clearInterval(net.ping);
      if (!net.role) return;
      net.status = "connecting";
      render();
      roomRetry();
    };
  }

  function roomRetry() {
    clearTimeout(net.timer);
    net.fails += 1;
    const wait = [1000, 2000, 4000, 8000, 15000][Math.min(net.retry++, 4)];
    net.timer = setTimeout(async () => {
      if (!net.role) return;
      if (net.fails >= 3) {
        // Before trying again, check that the room still exists.
        try {
          const res = await fetch(`${ROOM_SERVER}/rooms/${net.code}/info`);
          if (res.status === 404) { roomLeave("gone"); return; }
        } catch (e) { /* offline: keep trying */ }
      }
      roomOpen();
    }, wait);
  }

  function roomDrop() {
    clearTimeout(net.timer);
    clearInterval(net.ping);
    const ws = net.ws;
    net.ws = null;
    if (ws) { try { ws.close(1000, "bye"); } catch (e) { /* closed */ } }
  }

  // Leave the room on this device. reason: "left" | "closed" | "gone"
  function roomLeave(reason) {
    const remote = remoteRole();
    Object.assign(net, { role: "", code: "", token: "", status: "off", fresh: false, presence: [], last: "", sent: "" });
    roomDrop();
    roomSave();
    state.room = null;
    if (remote) { state.games = {}; state.view = "home"; }
    net.error = reason === "left" ? "" : reason;
    pSolveOpen = false;
    resetPanels();
    closeClue(true);
    render();
    window.scrollTo(0, 0);
  }

  function roomSend(obj) {
    if (!net.ws || net.ws.readyState !== 1) return false;
    try { net.ws.send(JSON.stringify(obj)); return true; } catch (e) { return false; }
  }

  // What everyone else sees: the open case, its game, and the room (players, turn, waiting question).
  function roomSnapshot() {
    const g = state.view === "case" && state.caseId ? state.games[state.caseId] || null : null;
    return { view: g ? "case" : "home", caseId: g ? state.caseId : null, game: g, room: state.room };
  }
  function roomPush(force) {
    if (net.role !== "owner" || net.fresh || !state.room || !net.ws || net.ws.readyState !== 1) return;
    const text = JSON.stringify({ type: "state", state: roomSnapshot() });
    if (!force && text === net.last) return;
    net.last = text;
    try { net.ws.send(text); } catch (e) { /* closed */ }
  }

  function roomMessage(raw) {
    if (raw === "pong") return;
    let m;
    try { m = JSON.parse(raw); } catch (e) { return; }
    if (!m || typeof m !== "object") return;
    if (m.type === "state" && remoteRole()) roomApply(m.state);
    else if (m.type === "restore" && net.role === "owner") roomRestore(m.state);
    else if (m.type === "presence" && net.role === "owner") {
      net.presence = Array.isArray(m.players) ? m.players : [];
      net.fresh = false;
      mergePresence();
      render();
    }
    else if (m.type === "intent" && net.role === "owner") roomIntent(m.from, m.intent);
    else if (m.type === "owner") { net.ownerOn = !!m.on; render(); }
    else if (m.type === "closed") roomLeave("closed");
    else if (m.type === "error" && typeof m.code === "string") { net.error = m.code; render(); }
  }

  // A reloaded owner takes back the game it had before the reload.
  function roomRestore(st) {
    if (!net.fresh || !st || typeof st !== "object") return;
    if (st.room && st.room.code === net.code) {
      state.room = st.room;
      if (st.room.judge === "ai" || st.room.judge === "host") state.mode = st.room.judge;
    }
    if (st.view === "case" && st.game && typeof st.game === "object" && hasCase(st.caseId)) {
      state.view = "case"; state.caseId = st.caseId; state.games[st.caseId] = st.game;
    }
  }

  // Mark who is here, add newcomers at the end of the turn order, and keep the turn on someone who is here.
  function mergePresence() {
    const r = state.room;
    if (!r) return;
    const here = new Map();
    for (const p of net.presence) if (p && p.pid) here.set(String(p.pid), String(p.name || "").slice(0, 12));
    for (const [pid, name] of here) {
      const p = r.players.find(x => x.pid === pid);
      if (p) { p.on = true; if (name) p.name = name; }
      else r.players.push({ pid, name: name || "?", on: true });
    }
    for (const p of r.players) if (!here.has(p.pid)) p.on = false;
    const tp = r.players[r.turn];
    if (!tp || !tp.on) roomAdvance(false);
  }

  // Move the turn to the next player who is here (step=false keeps the current player if they are here).
  function roomAdvance(step) {
    const r = state.room;
    if (!r) return;
    const n = r.players.length;
    if (!n) { r.turn = 0; return; }
    if (!(r.turn >= 0 && r.turn < n)) r.turn = 0;
    for (let k = step ? 1 : 0; k <= n; k++) {
      const i = (r.turn + k) % n;
      if (r.players[i].on) { r.turn = i; return; }
    }
  }

  // What a player asked to do. Only the player whose turn it is can act.
  function roomIntent(from, intent) {
    const r = state.room;
    if (!r || !from || !intent || typeof intent !== "object") return;
    const c = cur();
    const g = c && state.view === "case" ? game(c.id) : null;
    if (!g || g.status !== "open") return;
    const tp = turnPlayer();
    if (!tp || tp.pid !== from.pid) return;
    if (intent.type === "pass") {
      if (r.pending) return;
      roomAdvance(true); render(); return;
    }
    if (intent.type === "hint") {
      if (g.hints < c.hints.length) { openHint(c, g, "manual"); render(); }
      return;
    }
    if (r.pending) return;
    const text = String(intent.text || "").replace(/\s+/g, " ").trim();
    if (!text) return;
    if (intent.type === "ask") r.pending = { pid: from.pid, name: from.name, kind: "ask", text: text.slice(0, 200) };
    else if (intent.type === "solve") r.pending = { pid: from.pid, name: from.name, kind: "solve", text: text.slice(0, 1500) };
    else return;
    r.bounce = null; r.notice = null;
    render();
    roomJudgeNext();
  }

  // With AI judging, the owner's device judges the waiting question or answer.
  function roomJudgeNext() {
    const r = state.room;
    if (net.role !== "owner" || !r || !r.pending || busy || effMode() !== "ai" || ai.status !== "ready") return;
    const p = r.pending;
    if (p.kind === "ask") ask(p.text, p); else check(p.text, p);
  }

  // Players and the big screen show what the owner sent.
  function roomApply(st) {
    if (!st || typeof st !== "object") return;
    const prev = remoteBefore();
    state.room = st.room && typeof st.room === "object" ? st.room : null;
    const caseOk = st.view === "case" && st.game && typeof st.game === "object" && hasCase(st.caseId);
    state.view = caseOk ? "case" : "home";
    if (caseOk) { state.caseId = st.caseId; state.games = { [st.caseId]: st.game }; }
    else state.games = {};
    // A question the host sent back goes back into the player's box.
    const r = state.room;
    const refill = net.role === "player" && r && r.bounce && r.bounce.pid === me.pid ? net.sent : "";
    if (refill) net.sent = "";
    remoteAfter(prev);
    if (refill) {
      const box = document.getElementById("p-q");
      if (box && !box.value) box.value = refill;
    }
  }

  // QR code for joining, drawn by qrcode.js (loaded only when a room is open).
  const qrCache = {};
  let qrState = "idle";
  function qrSvg(text) {
    if (qrCache[text]) return qrCache[text];
    if (typeof window.qrcode === "function") {
      try {
        const q = window.qrcode(0, "M");
        q.addData(text);
        q.make();
        qrCache[text] = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
        return qrCache[text];
      } catch (e) { return ""; }
    }
    if (qrState === "idle") {
      qrState = "loading";
      const el = document.createElement("script");
      el.src = "qrcode.js";
      el.async = true;
      el.onload = () => { qrState = "ready"; render(); };
      el.onerror = () => { qrState = "failed"; };
      document.head.appendChild(el);
    }
    return "";
  }

  /* ---------- Host screen link (same computer, same browser) ---------- */
  // The host screen (?host) and the players' screen send each other the game state, so a question,
  // an answer, a hint, or the end of a case entered in one window appears in the other at once.
  function syncPost(msg) {
    if (!sync.ch) return;
    try { sync.ch.postMessage(Object.assign({ from: sync.id, host: HOST_VIEW }, msg)); } catch (e) { /* channel closed */ }
  }
  const syncSnapshot = () => ({ view: state.view, caseId: state.caseId, games: state.games, play: state.play, teams: state.teams, room: state.room, audience: state.audience });
  function syncShare(force) {
    if (!sync.ch || sync.applying || remoteRole()) return;
    const snap = JSON.stringify(syncSnapshot());
    if (!force && snap === sync.last) return;
    sync.last = snap;
    syncPost({ type: "state", state: JSON.parse(snap) });
  }
  function remoteBefore() {
    const pg = state.caseId && state.games[state.caseId];
    return { view: state.view, caseId: state.caseId, hints: pg ? pg.hints : 0, log: pg ? pg.log.length : 0, status: pg ? pg.status : "open" };
  }
  function remoteAfter(prev) {
    const moved = state.view !== prev.view || state.caseId !== prev.caseId;
    if (moved) { resetPanels(); closeClue(true); clearInputs(); pSolveOpen = false; }
    const g = state.view === "case" ? state.games[state.caseId] : null;
    const status = g ? g.status : "open";
    freshStamp = !moved && !!g && (g.log.length > prev.log || (status !== "open" && prev.status === "open"));
    sync.last = JSON.stringify(syncSnapshot());
    sync.applying = true;
    try { render(); renderClue(); } finally { sync.applying = false; }
    if (moved || status !== prev.status) window.scrollTo(0, 0);
    if (!HOST_VIEW && !moved && g) {
      if (status === "open" && g.hints > prev.hints) showClue(g.hints - 1, true);
      else if (clue && (g.log.length !== prev.log || status !== prev.status)) closeClue(true);
    }
  }
  function syncApply(st) {
    if (!st || typeof st !== "object") return;
    const prev = remoteBefore();
    state.games = st.games && typeof st.games === "object" ? st.games : {};
    if (st.play === "solo" || st.play === "team") state.play = st.play;
    if (st.teams && [2, 3, 4].includes(st.teams.n) && Array.isArray(st.teams.names) && Array.isArray(st.teams.wins)) state.teams = st.teams;
    if ((st.audience === "youth" || st.audience === "adult") && st.audience !== state.audience) { state.audience = st.audience; applyAudience(); }
    if ("room" in st) {
      const room = st.room && typeof st.room === "object" ? st.room : null;
      if (net.role !== "owner") state.room = room;
      else if (room && room.code === net.code) { state.room = room; mergePresence(); }   // the owner keeps its own list of who is here
    }
    const caseOk = st.view === "case" && hasCase(st.caseId);
    state.view = caseOk ? "case" : "home";
    if (caseOk) state.caseId = st.caseId;
    remoteAfter(prev);
  }
  function syncMessage(m) {
    // Pair a host screen with a players' screen; ignore windows of the same kind.
    if (!m || m.from === sync.id || m.host === HOST_VIEW || remoteRole()) return;
    if (m.type === "bye") { if (sync.peer) { sync.peer = false; render(); } return; }
    const wasPeer = sync.peer;
    sync.peer = true;
    sync.seen = Date.now();
    if (m.type === "hello") { syncShare(true); if (!wasPeer) render(); return; }
    if (m.type === "state") { syncApply(m.state); return; }
    if (!wasPeer) render();
  }
  function syncStart() {
    if (!CAN_PRESENT || sync.ch) return;
    try { sync.ch = new BroadcastChannel("case-room-link"); } catch (e) { return; }
    sync.ch.onmessage = e => syncMessage(e.data);
    syncPost({ type: "hello" });
    setInterval(() => {
      syncPost({ type: "ping" });
      if (sync.peer && Date.now() - sync.seen > 12000) { sync.peer = false; render(); }
    }, 4000);
    window.addEventListener("pagehide", () => syncPost({ type: "bye" }));
  }

  /* ---------- Start ---------- */
  async function initAI() {
    if (!hasClaude) return;
    try {
      const s = await window.claude.use("sample");
      if (s) { ai.sample = s; ai.status = "ready"; } else { ai.status = "off"; }
    } catch (e) {
      ai.status = "off";
    }
    render();
  }

  function restore(data) {
    if (!data || typeof data !== "object") return;
    if (data.lang === "ko" || data.lang === "en") state.lang = data.lang;
    if (data.mode === "ai" || data.mode === "host") state.mode = data.mode;
    if (data.games && typeof data.games === "object") state.games = data.games;
    if (data.play === "solo" || data.play === "team") state.play = data.play;
    if (data.teams && [2, 3, 4].includes(data.teams.n) && Array.isArray(data.teams.names) && Array.isArray(data.teams.wins)) state.teams = data.teams;
    if (data.view === "case" && hasCase(data.caseId)) { state.view = "case"; state.caseId = data.caseId; }
    render();
  }

  async function loadCases() {
    casesStatus = "loading";
    render();
    try {
      const res = await fetch("cases.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const list = (Array.isArray(data) ? data : data.cases || []).filter(c => c && c.id && c.title && c.setup && Array.isArray(c.keys));
      if (!list.length) throw new Error("no cases");
      indexCases(list);
      casesStatus = "ready";
    } catch (e) {
      casesStatus = "error";
    }
    render();
    if (casesStatus === "ready") { syncStart(); roomResume(); }
  }

  render();
  if (casesStatus !== "ready") loadCases(); else { syncStart(); roomResume(); }
  initAI();
  try {
    const hot = window.claude && window.claude.hot;
    if (hot) {
      if (typeof hot.snapshot === "function") hot.snapshot(() => ({ lang: state.lang, mode: state.mode, view: state.view, caseId: state.caseId, games: state.games, play: state.play, teams: state.teams }));
      if (typeof hot.ready === "function") hot.ready(restore);
      else if (hot.data) restore(hot.data);
    }
  } catch (e) { /* live-update hook unavailable */ }
})();
</script>
</body>
</html>
