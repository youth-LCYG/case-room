      </section>
      ${shelf("mystery", t.mysteries, t.mysteriesNote, ["YES", "NO", "IRRELEVANT"])}
      ${shelf("bible", t.bible, t.bibleNote, ["YES", "NO", "NOT_STATED"])}
    </main>`;
  }

  function caseView() {
    const t = u();
    const c = cur();
    const g = game(c.id);
    const bible = c.kind === "bible";
    const q = counted(g);
    const closed = g.status !== "open";
    const mode = effMode();
    const aiOk = ai.status === "ready";
    const third = bible ? "NOT_STATED" : "IRRELEVANT";

    const statement = `<article class="card statement b-statement">
      <div class="card-head"><p class="eyebrow">${esc(t.statement)}</p></div>
      <p class="setup">${esc(L(c.setup))}</p>
      <div class="answer-set"><span class="eyebrow">${esc(t.answersLabel)}</span>${["YES", "NO", third].map(chip).join("")}</div>
    </article>`;

    let tools = "";
    if (!closed) {
      const hints = c.hints.slice(0, g.hints).map((h, i) =>
        `<div class="hint-slip"><p class="eyebrow">${esc(t.hintBtn(i + 1))}</p><p>${esc(L(h))}</p></div>`).join("");
      let panel = "";
      if (confirmAct) {
        const isReveal = confirmAct === "reveal";
        panel = `<div class="panel warn" role="group">
          <p class="confirm-q">${esc(isReveal ? t.revealConfirm : t.solvedConfirm)}</p>
          <div class="actions">
            <button type="button" class="btn ${isReveal ? "btn-stop" : "btn-primary"}" data-act="confirm-yes">${esc(isReveal ? t.revealYes : t.solvedYes)}</button>
            <button type="button" class="btn" data-act="confirm-no">${esc(t.keepGoing)}</button>
          </div>
        </div>`;
      } else if (mode === "ai" && showSolve) {
        let result = "";
        if (g.lastCheck) {
          const hits = c.keys.filter(k => g.lastCheck.hits[k.id]).length;
          result = `<div class="check-result" aria-live="polite">
            <p class="eyebrow">${esc(t.keysFound(hits, c.keys.length))}</p>
            <ul class="checklist">${c.keys.map(k => {
              const ok = !!g.lastCheck.hits[k.id];
              return `<li><span class="mark ${ok ? "hit" : "miss"}" aria-hidden="true">${ok ? "✓" : "✗"}</span><span>${esc(L(k.label))}</span></li>`;
            }).join("")}</ul>
            ${g.lastCheck.feedback ? `<p class="feedback">${esc(g.lastCheck.feedback)}</p>` : ""}
          </div>`;
        }
        panel = `<form class="panel solve" data-form="solve" autocomplete="off">
          <label class="eyebrow" for="sol">${esc(t.solveTitle)}</label>
          <textarea id="sol" maxlength="1500" placeholder="${esc(t.solvePlaceholder)}"></textarea>
          <div class="actions">
            ${busy === "check"
              ? `<span class="waiting">${esc(t.checking)}</span><button type="button" class="btn btn-stop" data-act="check-cancel">${esc(t.cancel)}</button>`
              : `<button type="submit" class="btn btn-primary" ${aiOk && !busy ? "" : "disabled"}>${esc(t.check)}</button><button type="button" class="btn" data-act="solve-close">${esc(t.cancel)}</button>`}
          </div>
          ${result}
        </form>`;
      } else if (mode === "host" && showNotes) {
        panel = `<div class="panel notes">
          <p class="notes-warn">${esc(t.notesWarn)}</p>
          ${truthBlock(c, t, "h4")}
          <div class="actions"><button type="button" class="btn" data-act="notes-close">${esc(t.close)}</button></div>
        </div>`;
      }
      const hintBtn = g.hints < c.hints.length
        ? `<button type="button" class="btn" data-act="hint">${esc(t.hintBtn(g.hints + 1))}</button>` : "";
      const modeBtns = mode === "ai"
        ? (showSolve ? "" : `<button type="button" class="btn" data-act="solve-open" ${aiOk ? "" : "disabled"}>${esc(t.solve)}</button>`)
        : `<button type="button" class="btn" data-act="solved">${esc(t.solvedBtn)}</button>
           <button type="button" class="btn" data-act="notes" aria-expanded="${showNotes}">${esc(t.notesBtn)}</button>`;
      const actions = confirmAct ? "" : `<div class="actions">${hintBtn}${modeBtns}<button type="button" class="btn" data-act="reveal">${esc(t.reveal)}</button></div>`;
      tools = `<section class="tools b-tools">${hints}${actions}${panel}</section>`;
    }

    let ask;
    if (closed) {
      const solved = g.status === "solved";
      ask = `<section class="closing b-ask" aria-live="polite">
        <span class="stamp ${solved ? "v-yes" : "v-meh"}${freshStamp ? " fresh" : ""}">${esc(solved ? t.closedSolved : t.closedRevealed)}</span>
        ${solved ? `<p class="rank">${esc(t.rank[rankIndex(q, g.hints)])}</p><p class="readit">${esc(t.solvedIn(q, g.hints))}</p>` : ""}
        ${truthBlock(c, t, "h3")}
        ${bible ? `<p class="readit">${esc(t.readIt)}: <strong>${esc(L(c.ref))}</strong></p>` : ""}
        <div class="actions">
          <button type="button" class="btn btn-primary" data-act="home">${esc(t.back)}</button>
          <button type="button" class="btn" data-act="again">${esc(t.playAgain)}</button>
        </div>
      </section>`;
    } else {
      const last = g.log[g.log.length - 1];
      let stage;
      if (busy === "ask") {
        stage = `<div class="stage" aria-live="polite"><p class="stage-q">“${esc(pendingQ)}”</p><span class="thinking">${esc(t.thinking)}</span></div>`;
      } else if (last) {
        const V = VERDICTS[last.v];
        stage = `<div class="stage" aria-live="polite">
          ${last.q ? `<p class="stage-q">“${esc(last.q)}”</p>` : ""}
          <span class="stamp ${V.cls}${V.long ? " long" : ""}${freshStamp ? " fresh" : ""}">${esc(V[state.lang])}</span>
          ${last.note ? `<p class="stage-note">${esc(last.note)}</p>` : ""}
        </div>`;
      } else {
        stage = `<div class="stage"><p class="stage-empty">${esc(t.stageEmpty)}</p></div>`;
      }
      const notice = ai.noticeKey ? `<p class="notice" role="status">${esc(errText(t, ai.noticeKey))}</p>` : "";
      if (mode === "ai") {
        ask = `<section class="ask-panel b-ask">
          <form class="ask" data-form="ask" autocomplete="off">
            <label class="qmark" for="q">Q.</label>
            <input id="q" type="text" maxlength="200" placeholder="${esc(t.askPlaceholder)}" aria-label="${esc(t.askLabel)}" ${aiOk ? "" : "disabled"}>
            <button type="submit" class="btn btn-primary" ${aiOk && !busy ? "" : "disabled"}>${esc(t.ask)}</button>
          </form>
          ${notice}
          <p class="fineprint">${esc(aiOk ? `${ai.source === "relay" ? t.relayConsent : t.consent} ${t.notCounted}` : t.aiConnectingNote)}</p>
          ${stage}
        </section>`;
      } else {
        ask = `<section class="ask-panel b-ask">
          <div class="memo-row">
            <label class="qmark" for="memo">Q.</label>
            <input id="memo" type="text" maxlength="200" placeholder="${esc(t.memoPlaceholder)}" aria-label="${esc(t.memoLabel)}">
          </div>
          <div class="stamp-pad" role="group" aria-label="${esc(t.stampLabel)}">
            ${["YES", "NO", third].map(v => {
              const V = VERDICTS[v];
              return `<button type="button" id="stamp-${v}" class="stamp-btn ${V.cls}${V.long ? " long" : ""}" data-act="stamp" data-v="${v}">${esc(V[state.lang])}</button>`;
            }).join("")}
          </div>
          <div class="pad-foot">
            <p class="fineprint">${esc(t.hostIntro)}</p>
            ${g.log.length ? `<button type="button" class="undo" data-act="undo">${esc(t.undo)}</button>` : ""}
          </div>
          ${notice}
          ${stage}
        </section>`;
      }
    }

    let n = 0;
    const rows = g.log.map(x => ({ x, num: x.v === "INVALID" ? "–" : String(++n).padStart(2, "0") })).reverse();
    const log = `<section class="log b-log" aria-label="${esc(t.transcript)}">
      <div class="stats">
        <div class="stat"><span class="eyebrow">${esc(t.questions)}</span><b>${q}</b><span class="tally">${tally(q)}</span></div>
        <div class="stat"><span class="eyebrow">${esc(t.hints)}</span><b>${g.hints}</b></div>
      </div>
      <h3 class="eyebrow">${esc(t.transcript)}</h3>
      ${rows.length ? `<ul class="transcript">${rows.map(({ x, num }) => {
        const V = VERDICTS[x.v];
        return `<li><span class="tn">Q${esc(num)}</span>${x.q ? `<span class="tq">${esc(x.q)}</span>` : `<span class="tq muted">${esc(t.noRecord)}</span>`}<span class="tv ${V.cls}">${esc(V[state.lang])}</span>${x.note ? `<span class="tnote">${esc(x.note)}</span>` : ""}</li>`;
      }).join("")}</ul>` : `<p class="empty">${esc(t.noQuestions)}</p>`}
    </section>`;

    return `<main>
      <div class="case-head">
        <button type="button" class="back" data-act="home">← ${esc(t.allCases)}</button>
        <div class="fileline"><span class="fileno">${esc(bible ? L(c.ref) : c.file)}</span>${pips(c)}</div>
        <h2 class="case-title">${esc(L(c.title))}</h2>
      </div>
      <div class="case-grid">
        <div class="col-left">${statement}${tools}</div>
        <div class="col-right">${ask}${log}</div>
      </div>
    </main>`;
  }

  const KEEP = ["q", "sol", "memo", "relay-url", "relay-pass"];
  function render() {
    const active = document.activeElement ? document.activeElement.id : "";
    const kept = {};
    for (const id of KEEP) { const el = document.getElementById(id); if (el) kept[id] = el.value; }
    document.documentElement.lang = state.lang;
    app.innerHTML = header() + (showSettings ? settingsPanel() : "") + (state.view === "case" && cur() ? caseView() : homeView());
    for (const id of KEEP) { const el = document.getElementById(id); if (el && kept[id] !== undefined) el.value = kept[id]; }
    if (active) {
      const el = document.getElementById(active);
      if (el && !el.disabled) el.focus({ preventScroll: true });
    }
    freshStamp = false;
  }

  function clearInputs() {
    for (const id of ["q", "sol", "memo"]) { const el = document.getElementById(id); if (el) el.value = ""; }
  }
  function clearSettingsInputs() {
    for (const id of ["relay-url", "relay-pass"]) { const el = document.getElementById(id); if (el) el.value = ""; }
  }
  function resetPanels() {
    showSolve = false;
    showNotes = false;
    confirmAct = null;
  }
  function scrollToClosing() {
    const el = document.querySelector(".closing");
    if (!el) return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }

  /* ---------- Actions ---------- */
  function openCase(id) {
    clearInputs();
    state.view = "case";
    state.caseId = id;
    resetPanels();
    ai.noticeKey = "";
    render();
    window.scrollTo(0, 0);
  }
  function goHome() {
    if (busy === "check" && checkCtl) checkCtl.abort();
    clearInputs();
    state.view = "home";
    resetPanels();
    ai.noticeKey = "";
    render();
    window.scrollTo(0, 0);
  }

  function handleError(e) {
    const code = e && e.code;
    if (code === "cancelled") return;
    if (code === "not_granted") { ai.status = "blocked"; ai.noticeKey = "notGranted"; return; }
    if (["sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
      ai.status = "off"; ai.noticeKey = "unavailable"; return;
    }
    if (code === "rate_limited") { ai.noticeKey = "rate"; return; }
    if (code === "session_expired") { ai.noticeKey = "session"; return; }
    if (code === "refused") { ai.noticeKey = "refused"; return; }
    if (code === "bad_passcode") { ai.noticeKey = "badPass"; return; }
    if (code === "relay_rate") { ai.noticeKey = "relayRate"; return; }
    if (code === "relay_down") { ai.noticeKey = "relayDown"; return; }
    if (code === "relay_config") { ai.noticeKey = "relayConfig"; return; }
    ai.noticeKey = "generic";
  }

  function errKey(e) {
    const code = e && e.code;
    return code === "bad_passcode" ? "badPass"
      : code === "relay_rate" ? "relayRate"
      : code === "relay_down" ? "relayDown"
      : code === "relay_config" ? "relayConfig"
      : "generic";
  }

  async function saveRelay() {
    if (testing) return;
    const url = ((document.getElementById("relay-url") || {}).value || "").trim();
    const pass = ((document.getElementById("relay-pass") || {}).value || "").trim();
    if (!url || !pass) { settingsMsg = { key: "settingsMissing", ok: false }; render(); return; }
    if (!/^https:\/\/\S+$/i.test(url)) { settingsMsg = { key: "settingsBadUrl", ok: false }; render(); return; }
    const before = { url: relay.url, pass: relay.pass, source: ai.source, status: ai.status };
    relay.url = url;
    relay.pass = pass;
    ai.source = "relay";
    testing = true;
    settingsMsg = null;
    render();
    try {
      const r = await aiJSON('Reply with only this JSON and nothing else: {"ok":true}', "judge");
      if (!r || r.ok !== true) throw { code: "invalid_json" };
      remember(RELAY_URL_KEY, url);
      remember(RELAY_PASS_KEY, pass);
      ai.status = "ready";
      ai.noticeKey = "";
      state.mode = "ai";
      remember("caseRoomMode", "ai");
      settingsMsg = { key: "settingsOk", ok: true };
    } catch (e) {
      relay.url = before.url;
      relay.pass = before.pass;
      ai.source = before.source;
      ai.status = before.status;
      settingsMsg = { key: errKey(e), ok: false };
    } finally {
      testing = false;
      render();
    }
  }

  function disconnectRelay() {
    forget(RELAY_URL_KEY);
    forget(RELAY_PASS_KEY);
    relay.url = "";
    relay.pass = "";
    ai.source = "";
    ai.status = "off";
    ai.noticeKey = "";
    resetPanels();
    clearSettingsInputs();
    settingsMsg = { key: "disconnected", ok: true };
    render();
  }

  async function ask(text) {
    if (busy || ai.status !== "ready" || effMode() !== "ai") return;
    const c = cur();
    if (!c) return;
    const g = game(c.id);
    if (g.status !== "open") return;
    busy = "ask";
    pendingQ = text;
    ai.noticeKey = "";
    render();
    try {
      const res = await aiJSON(judgePrompt(c, g, text), "judge");
      let v = String((res && res.verdict) || "").trim().toUpperCase().replace(/[\s-]+/g, "_");
      if (c.kind === "bible" && v === "IRRELEVANT") v = "NOT_STATED";
      if (c.kind === "mystery" && v === "NOT_STATED") v = "IRRELEVANT";
      if (!VERDICTS[v]) throw { code: "invalid_json" };
      const note = v === "INVALID" && res && typeof res.note === "string" ? res.note.trim().slice(0, 160) : "";
      g.log.push({ q: text, v, note });
      const qEl = document.getElementById("q");
      if (qEl && qEl.value.trim() === text) qEl.value = "";
      freshStamp = true;
    } catch (e) {
      handleError(e);
    } finally {
      busy = null;
      pendingQ = "";
      render();
    }
  }

  async function check(text) {
    if (busy || ai.status !== "ready") return;
    const c = cur();
    if (!c) return;
    const g = game(c.id);
    busy = "check";
    checkCtl = new AbortController();
    ai.noticeKey = "";
    render();
    try {
      const res = await aiJSON(gradePrompt(c, text), "grade", checkCtl.signal);
      const hits = {};
      let all = true;
      for (const k of c.keys) {
        const raw = res && res.hits ? res.hits[k.id] : false;
        const ok = raw === true || raw === "true";
        hits[k.id] = ok;
        if (!ok) all = false;
      }
      g.attempts += 1;
      g.lastCheck = { hits, feedback: res && typeof res.feedback === "string" ? res.feedback.trim().slice(0, 240) : "" };
      if (all) { g.status = "solved"; resetPanels(); freshStamp = true; }
    } catch (e) {
      handleError(e);
    } finally {
      busy = null;
      checkCtl = null;
      render();
      if (cur() && game(cur().id).status === "solved") scrollToClosing();
    }
  }

  app.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    const c = cur();
    const g = c && state.view === "case" ? game(c.id) : null;
    switch (act) {
      case "lang":
        if (b.dataset.lang !== state.lang) { state.lang = b.dataset.lang; remember("caseRoomLang", state.lang); render(); }
        break;
      case "mode":
        if (b.dataset.mode !== state.mode) {
          if (busy === "check" && checkCtl) checkCtl.abort();
          state.mode = b.dataset.mode; remember("caseRoomMode", state.mode);
          resetPanels(); ai.noticeKey = ""; render();
        }
        break;
      case "settings":
        showSettings = !showSettings;
        settingsMsg = null;
        render();
        if (showSettings) {
          const urlEl = document.getElementById("relay-url");
          const passEl = document.getElementById("relay-pass");
          if (urlEl && !urlEl.value) urlEl.value = relay.url;
          if (passEl && !passEl.value) passEl.value = relay.pass;
          window.scrollTo(0, 0);
          if (urlEl) urlEl.focus({ preventScroll: true });
        }
        break;
      case "settings-close": showSettings = false; settingsMsg = null; clearSettingsInputs(); render(); break;
      case "disconnect": disconnectRelay(); break;
      case "open": openCase(b.dataset.id); break;
      case "home": goHome(); break;
      case "hint":
        if (g && g.hints < c.hints.length) { g.hints += 1; render(); }
        break;
      case "stamp":
        if (g && g.status === "open" && VERDICTS[b.dataset.v]) {
          const memo = document.getElementById("memo");
          const text = memo ? memo.value.trim().slice(0, 200) : "";
          g.log.push({ q: text, v: b.dataset.v, note: "" });
          if (memo) memo.value = "";
          freshStamp = true;
          render();
        }
        break;
      case "undo":
        if (g && g.log.length) { g.log.pop(); render(); }
        break;
      case "notes": showNotes = !showNotes; confirmAct = null; render(); break;
      case "notes-close": showNotes = false; render(); break;
      case "solve-open":
        showSolve = true; confirmAct = null; render();
        requestAnimationFrame(() => { const s = document.getElementById("sol"); if (s) s.focus(); });
        break;
      case "solve-close": showSolve = false; render(); break;
      case "check-cancel": if (checkCtl) checkCtl.abort(); break;
      case "solved": confirmAct = "solved"; showNotes = false; showSolve = false; render(); break;
      case "reveal": confirmAct = "reveal"; showNotes = false; showSolve = false; render(); break;
      case "confirm-no": confirmAct = null; render(); break;
      case "confirm-yes":
        if (g && confirmAct) {
          g.status = confirmAct === "reveal" ? "revealed" : "solved";
          resetPanels(); freshStamp = true; render(); scrollToClosing();
        }
        break;
      case "again":
        if (c) { delete state.games[c.id]; resetPanels(); ai.noticeKey = ""; clearInputs(); render(); window.scrollTo(0, 0); }
        break;
    }
  });

  app.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.form === "ask") {
      const v = (document.getElementById("q") || {}).value || "";
      if (v.trim()) ask(v.trim());
    } else if (f.dataset.form === "solve") {
      const v = (document.getElementById("sol") || {}).value || "";
      if (v.trim()) check(v.trim());
    } else if (f.dataset.form === "settings") {
      saveRelay();
    }
  });

  /* ---------- Start ---------- */
  async function initAI() {
    if (!hasClaude) return;
    try {
      const s = await window.claude.use("sample");
      if (s) { ai.sample = s; ai.status = "ready"; } else { ai.status = "off"; }
    } catch (e) {
      ai.status = "off";
    }
    render();
  }

  function restore(data) {
    if (!data || typeof data !== "object") return;
    if (data.lang === "ko" || data.lang === "en") state.lang = data.lang;
    if (data.mode === "ai" || data.mode === "host") state.mode = data.mode;
    if (data.games && typeof data.games === "object") state.games = data.games;
    if (data.view === "case" && CASES.some(c => c.id === data.caseId)) { state.view = "case"; state.caseId = data.caseId; }
    render();
  }

  render();
  initAI();
  try {
    const hot = window.claude && window.claude.hot;
    if (hot) {
      if (typeof hot.snapshot === "function") hot.snapshot(() => ({ lang: state.lang, mode: state.mode, view: state.view, caseId: state.caseId, games: state.games }));
      if (typeof hot.ready === "function") hot.ready(restore);
      else if (hot.data) restore(hot.data);
    }
  } catch (e) { /* live-update hook unavailable */ }
})();
</script>
</body>
</html>
