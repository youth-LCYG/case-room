# Case Room rooms server. Deployed by .github/workflows/rooms.yml.
name = "case-room-rooms"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

[vars]
# Sites allowed to open rooms (comma-separated).
ALLOWED_ORIGINS = "https://youth-lcyg.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Durable Objects on the Workers Free plan must use SQLite storage.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
